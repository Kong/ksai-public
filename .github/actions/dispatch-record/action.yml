name: Dispatch record
description: >-
  Read one control-plane package-stage record. Authenticate the run with GitHub OIDC. Validate the
  complete stage contract before the workflow uses any value. Retry temporary failures within a
  fixed budget. Refuse incomplete records and records for other runtime flows.

inputs:
  endpoint:
    description: The bare HTTPS control-plane URL. An empty value skips the read.
    required: false
    default: ""
  record_id:
    description: The record ID from the workflow gate. Its presence permits a named 404 response.
    required: false
    default: ""
  audience:
    description: The audience for the GitHub OIDC token.
    required: false
    default: ksai-cp

outputs:
  read:
    description: Whether the control plane returned a package-stage record.
    value: ${{ steps.record.outputs.read }}
  record_id:
    description: The control-plane record that identifies this package-stage run.
    value: ${{ steps.record.outputs.record_id }}
  workflow_job:
    description: The package job for this stage.
    value: ${{ steps.record.outputs.workflow_job }}
  workflow_instance:
    description: The stage instance for this run.
    value: ${{ steps.record.outputs.workflow_instance }}
  workflow_attempt:
    description: The attempt number for this stage instance.
    value: ${{ steps.record.outputs.workflow_attempt }}
  workflow_lease:
    description: The control-plane lease for this attempt.
    value: ${{ steps.record.outputs.workflow_lease }}
  source_revision:
    description: The source revision from the package-stage record.
    value: ${{ steps.record.outputs.source_revision }}
  changeset_max_bytes:
    description: The most bytes a write stage's change may hold, if the stage writes.
    value: ${{ steps.record.outputs.changeset_max_bytes }}
  changeset_max_files:
    description: The most files a write stage's change may hold, if the stage writes.
    value: ${{ steps.record.outputs.changeset_max_files }}
  merge_base:
    description: The base commit a write stage merges, uncommitted, into its checkout before the model runs, if the stage resolves a merge.
    value: ${{ steps.record.outputs.merge_base }}
  prepare_tools:
    description: Whether a write stage installs the tools its tree pins before the model runs.
    value: ${{ steps.record.outputs.prepare_tools }}
  prepare_dependencies:
    description: Whether a write stage warms its tree's locked dependencies before the model runs.
    value: ${{ steps.record.outputs.prepare_dependencies }}
  stage_pull:
    description: The pull request from the package-stage record, if present.
    value: ${{ steps.record.outputs.stage_pull }}
  stage_issue:
    description: The issue from the package-stage record, if present.
    value: ${{ steps.record.outputs.stage_issue }}
  stage_work_ref:
    description: The external work reference from the package-stage record, if present.
    value: ${{ steps.record.outputs.stage_work_ref }}
  plan_path:
    description: The control-plane plan path for this task, if present.
    value: ${{ steps.record.outputs.plan_path }}
  stage_minutes:
    description: The model budget, in minutes, before the control plane reaps the attempt.
    value: ${{ steps.record.outputs.stage_minutes }}
  stage_job_minutes:
    description: The job budget, in minutes, before the control plane reaps the attempt.
    value: ${{ steps.record.outputs.stage_job_minutes }}
  review_admission:
    description: The validated CP review clock and package stage identity, or empty for an ordinary stage.
    value: ${{ steps.record.outputs.review_admission }}
  workflow_steering_file:
    description: The file that holds the exact control-plane steering envelope.
    value: ${{ steps.record.outputs.workflow_steering_file }}
  workflow_steering_sha256:
    description: The digest of the exact control-plane steering envelope.
    value: ${{ steps.record.outputs.workflow_steering_sha256 }}

runs:
  using: composite
  steps:
    - name: Read the dispatch record
      id: record
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RECORD_ACTION_PATH: ${{ github.action_path }}
        RECORD_ENDPOINT: ${{ inputs.endpoint }}
        RECORD_AUDIENCE: ${{ inputs.audience }}
        RECORD_NAMED: ${{ inputs.record_id }}
      with:
        script: |
          const { isPolicyRefusal, readRecord, reportPolicyRefusal } =
            await import(`file://${process.env.RECORD_ACTION_PATH}/record.mjs`);
          const fs = require('fs');
          const path = require('path');
          let answer;
          try {
            answer = await readRecord({
              endpoint: process.env.RECORD_ENDPOINT,
              audience: process.env.RECORD_AUDIENCE,
              named: process.env.RECORD_NAMED !== '',
              mint: (audience) => core.getIDToken(audience),
              secret: (token) => core.setSecret(token),
              note: (why, wait) => core.info(
                `ksai could not read the dispatch record yet, trying again in ${Math.round(wait / 1000)}s: ${why}`,
              ),
            });
          } catch (refused) {
            if (isPolicyRefusal(refused)) {
              try {
                await reportPolicyRefusal({
                  endpoint: process.env.RECORD_ENDPOINT,
                  audience: process.env.RECORD_AUDIENCE,
                  mint: (audience) => core.getIDToken(audience),
                  secret: (token) => core.setSecret(token),
                });
              } catch {
                core.info('ksai could not report the security policy refusal');
              }
            }
            core.setFailed(refused.message);
            return;
          }
          if (answer.read) core.notice('ksai read the package-stage record');
          core.exportVariable('KSAI_REVIEW_ADMISSION', answer.reviewAdmission ?? '');
          core.setOutput('read', answer.read ? 'true' : 'false');
          for (const [name, held] of [
            ['record_id', 'recordId'],
            ['workflow_job', 'workflowJob'],
            ['workflow_instance', 'workflowInstance'],
            ['workflow_attempt', 'workflowAttempt'],
            ['workflow_lease', 'workflowLease'],
            ['source_revision', 'sourceRevision'],
            ['changeset_max_bytes', 'changesetMaxBytes'],
            ['changeset_max_files', 'changesetMaxFiles'],
            ['merge_base', 'mergeBase'],
            ['prepare_tools', 'prepareTools'],
            ['prepare_dependencies', 'prepareDependencies'],
            ['stage_pull', 'stagePull'],
            ['stage_issue', 'stageIssue'],
            ['stage_work_ref', 'stageWorkRef'],
            ['plan_path', 'planPath'],
            ['stage_minutes', 'stageMinutes'],
            ['stage_job_minutes', 'stageJobMinutes'],
            ['review_admission', 'reviewAdmission'],
          ]) {
            core.setOutput(name, answer[held] ?? '');
          }
          const file = path.join(process.env.RUNNER_TEMP, `ksai-steering-${answer.recordId}.json`);
          fs.writeFileSync(file, answer.workflowSteering, { encoding: 'utf8', mode: 0o600 });
          core.setOutput('workflow_steering_file', file);
          core.setOutput('workflow_steering_sha256', answer.workflowSteeringDigest);
