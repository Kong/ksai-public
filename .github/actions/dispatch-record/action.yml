name: Dispatch record
description: >-
  Read what the control plane decided for this run. The control plane writes a record before it
  dispatches and names it in the dispatch, so a decision it makes does not have to fit the ten inputs
  workflow_dispatch allows.

  Nothing here is a secret. The caller is named by a GitHub Actions OIDC token whose repository and
  run claims are signed by GitHub and cannot be changed from inside the job. The control plane binds a
  record to the run that first reads it and answers only that run afterwards, so the gate and the job
  that does the work can both read it and no other run can.

  A dispatch naming no record skips the read. One naming a record is read or the run fails, and nothing
  falls back to the dispatch inputs. The control plane sends a dispatch whose answer was lost again
  under the same record, so a run that carried on without reading it could be the second run of that
  dispatch doing the work twice, or a run answering a different question than the one decided. A
  failure that can pass - the token mint, the network, a body that does not parse, a 408, a 429 or a
  5xx - is tried again first, and a run that still cannot read its record fails after at most about two
  and a half minutes, however long the control plane asks it to wait. A refusal that would answer the same again,
  and a record named with no endpoint to read it from, fail the run at once.

  What comes back is read, never relayed. A command is passed on only when it is one this runner
  answers, so a record cannot name a flow that does not exist, and a value carrying a newline cannot
  write a second output. The record names no requester and this action reads none: who asked is still
  read from GitHub by the gate, never taken from the control plane.

  The logic ships beside this action.yml, so every caller already has it wherever it has the action,
  and it is a module rather than a shell block so the refusals above are unit-testable.

inputs:
  endpoint:
    description: >-
      Base URL of the control plane, with no trailing path. Empty, which is the default, is right only
      where no dispatch names a record: a record named with no endpoint fails the run.
    required: false
    default: ""
  record_id:
    description: >-
      The record the dispatch named. Empty, which is every dispatch from a control plane that writes
      none, skips the read.
    required: false
    default: ""
  audience:
    description: >-
      Audience the OIDC token is minted for. Both ends have to name the same string, and the control
      plane refuses a token minted for anything else.
    required: false
    default: ksai-cp

outputs:
  read:
    description: "`true` where the record was read, `false` where the dispatch named none"
    value: ${{ steps.record.outputs.read }}
  command:
    description: >-
      the command the control plane decided this run is for, or empty where it decided none - which is
      every run answering a comment, since a comment names its own
    value: ${{ steps.record.outputs.command }}
  label:
    description: >-
      the label a run nobody typed rests on, or empty. It names a fact for the runner to read back from
      GitHub - that the pull request still carries it, and who applied it - and grants nothing by itself
    value: ${{ steps.record.outputs.label }}
  pr:
    description: the pull request the record was decided for, or empty
    value: ${{ steps.record.outputs.pr }}
  head_sha:
    description: the head commit the record was decided for, or empty; a run finding the head moved stands down
    value: ${{ steps.record.outputs.head_sha }}

runs:
  using: composite
  steps:
    - name: Read the dispatch record
      id: record
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RECORD_ACTION_PATH: ${{ github.action_path }}
        RECORD_ENDPOINT: ${{ inputs.endpoint }}
        RECORD_ID: ${{ inputs.record_id }}
        RECORD_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const { readRecord } = await import(`file://${process.env.RECORD_ACTION_PATH}/record.mjs`);
          let answer;
          try {
            answer = await readRecord({
              endpoint: process.env.RECORD_ENDPOINT,
              recordId: process.env.RECORD_ID,
              audience: process.env.RECORD_AUDIENCE,
              mint: (audience) => core.getIDToken(audience),
              secret: (token) => core.setSecret(token),
              note: (why, wait) => core.info(`ksai could not read the dispatch record yet, trying again in ${Math.round(wait / 1000)}s: ${why}`),
            });
          } catch (refused) {
            core.setFailed(refused.message);
            return;
          }
          if (answer.read) {
            core.notice(`ksai read the dispatch record${answer.command ? `: command ${answer.command}` : ''}`);
          }
          core.setOutput('read', answer.read ? 'true' : 'false');
          core.setOutput('command', answer.command);
          core.setOutput('label', answer.label);
          core.setOutput('pr', answer.pr);
          core.setOutput('head_sha', answer.head_sha);
