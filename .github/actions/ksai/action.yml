name: KSAI
description: >-
  One action for `/ksai` review, implementation, and adversarial pull request testing. `flow: review` reads a
  pull request, `flow: implement` changes a repository, `flow: test` exercises the pull request tree, and
  `flow: test-publish` validates and posts its verdict. Authentication starts with GitHub OIDC, so no
  ANTHROPIC_API_KEY secret is needed. By default Kong AI Gateway validates that token directly; a caller may
  instead use Anthropic federation through a route that serves the token exchange.

  The model never holds a GitHub token. A trusted step fetches what the model reads, the model writes a JSON
  manifest, and a trusted step validates and publishes. See docs/federated-claude.md, and
  docs/decisions/action-consolidation.md for why this is one action rather than two.

inputs:
  flow:
    description: >-
      `review`, `implement`, `test`, `test-publish`, or `run`. It bounds which commands this run may answer and which
      steps may spend or write. `test-publish` is the trusted publisher half of `test`, not a comment command.
      `run` answers no comment: it runs the caller's own prompt under a named `profile`, for a job the caller
      triggers and whose results a trusted step of its own publishes.
    required: true
  profile:
    description: >-
      flow: run only. What the run may touch: `reviewer` holds no write tool, though an allowed read command
      such as `find` can still change the tree; `fixer` writes the tree and runs whatever build, lint and test
      tooling it carries under the sandbox; `isolated` holds no tools and posts one message of at most 4096
      output tokens, failing a longer answer. Every profile denies `gh`, because this flow hands the model no
      GitHub token. The run can write `.git`, so a trusted step reading the tree afterwards runs git with
      `core.hooksPath=/dev/null` and `core.fsmonitor=false`.
    required: false
    default: ""
  prompt_file:
    description: >-
      flow: run only. Path to the assembled prompt. A trusted step in the calling job writes it, outside the
      tree the run can edit.
    required: false
    default: ""
  extra_allowed_tools:
    description: "flow: run only. Comma-separated tool patterns added to the profile's allow list"
    required: false
    default: ""
  extra_disallowed_tools:
    description: "flow: run only. Comma-separated tool patterns added to the profile's deny list; a denial beats a grant"
    required: false
    default: ""
  sandbox_allow_write:
    description: "flow: run only. Newline- or comma-separated paths the sandbox may write outside the working directory, e.g. a scratch directory or a module cache"
    required: false
    default: ""
  sandbox_deny_write:
    description: "flow: run only. Newline- or comma-separated paths the sandbox may not write"
    required: false
    default: ""
  sandbox_deny_env:
    description: "flow: run only. Newline- or comma-separated environment variable names kept out of the sandbox, for a secret a tool subprocess must not read"
    required: false
    default: ""
  source_org_github_token:
    description: >-
      github token for the source repo. A review needs contents:read and pull-requests:write, plus issues:write
      for the reaction. An implement run needs contents:write and pull-requests:write to push the branch and
      open the draft pull request, plus issues:write to comment and react. A test run needs contents:read,
      pull-requests:read and issues:read. Test publication needs pull-requests:write.

      When `ci_evidence_github_token` is empty, pull-request write phases also read CI evidence on this token and
      need three read scopes. Without `checks:read`, the check-run list answers 403 and the reader may see no
      failing checks. `statuses:read` covers the older statuses API. `actions:read` lets KSAI read a failing
      job's log tail.
    required: true
  authorization_github_token:
    description: >-
      read-only token for the CODEOWNERS/team authorization check, for the surface check a dispatched request
      runs, and for reading the conversation an approval is looked for in. Needs source-repo contents:read, org
      Members:read for `@org/team` CODEOWNERS entries, pull-requests:read and issues:read. Defaults to
      source_org_github_token.

      pull-requests:read is easy to miss and two different steps need it. A dispatch carrying a `comment_body`
      asks GitHub whether the number it names is a pull request, on this token, before it knows whether the
      request is even answerable. issues:read is needed by every implement chain, because a plan document is
      approved before it becomes a checklist whatever `require_plan_approval` says: a token minted with
      contents+members only answers 403 on the issue's comment list, and adding issues:read alone still answers
      403 on the pull request's - the issues endpoint serves a pull request's comments but requires the pull
      requests permission to do it.
    required: false
    default: ""
  ci_evidence_github_token:
    description: >-
      read-only token pull-request write phases read their CI evidence on: checks:read, statuses:read and
      actions:read. Empty keeps the evidence on `source_org_github_token`.

      The implement flow's plan claim reads workflow run status on this token for the same reason. On
      `source_org_github_token` every `actions.getWorkflowRun` call answers 403 wherever the push token is an
      App installation token, and an unreadable answer releases the plan - so the guard passed on every
      consumer and two runs could write one plan.

      It exists because those three scopes cannot always be added to the push token. They are App-installation
      configuration, and an installation that does not hold them answers `422 The permissions requested are not
      granted to this installation` to a token request naming them - so a consumer cannot grant them to itself
      at all, and the phase then reports that nothing it can see is failing on a red pull request. A job's own
      GITHUB_TOKEN carries all three straight out of the workflow's `permissions:` block.
    required: false
    default: ""
  kong_org_github_token:
    description: "github token for the Kong org; checks out this action's plugin and trusted scripts from the ksai source repository"
    required: true
  go_module_tokens:
    description: >-
      read tokens for the PRIVATE Go modules a repository imports, one `owner=token` line each. Empty (the
      default) still gets a Go repository its pinned toolchain and every public module; it gets no private
      one, and the phase says which modules are missing rather than pretending the build ran.

      **Spent before the model starts and never handed on.** The sandbox has no network at all, so the
      module cache is the only thing a build inside it can read, and filling it is the last thing that can
      reach github.com. The tokens reach git through this step's `GIT_CONFIG_*` environment rather than a
      config file: `~/.gitconfig` is not one of the paths the sandbox denies reading and the step agent
      holds `Read`, so a token written there would be handed to the one thing this flow keeps credentials
      away from. An environment set on one call is gone when the call returns.

      A line naming an owner that is not a GitHub login is dropped with a warning rather than failing the
      run, because a repository whose private modules are unreachable can still be worked on.
    required: false
    default: ""
  federation_rule_id:
    description: >-
      team federation rule id (fdrl_...). Required for every flow but test-publish, which mints no
      Anthropic token and so needs none of the four federation identifiers - validated below rather
      than left `required: true`, which would force that flow to hold `id-token: write` for a token
      it never exchanges.
    required: false
    default: ""
  organization_id:
    description: "Anthropic organization UUID; see federation_rule_id for which flows need it"
    required: false
    default: ""
  service_account_id:
    description: "team service account id (svac_...); see federation_rule_id for which flows need it"
    required: false
    default: ""
  workspace_id:
    description: "team workspace id (wrkspc_...) - the per-team billing boundary; see federation_rule_id for which flows need it"
    required: false
    default: ""
  anthropic_base_url:
    description: >-
      every model call this action makes goes to this origin, whichever engine runs it. With
      `anthropic_auth: federation`, the origin also serves `/v1/oauth/token`; with the default `oidc-bearer`,
      the gateway validates the GitHub OIDC token directly. Kong's own callers default to Kong AI Gateway, where
      KSAI spend is attributed; the published mirror carries no default, so a caller there sets its own origin.
      Empty is refused rather than falling back to api.anthropic.com. Must start with https:// and
      name an origin rather than an endpoint - the version segment is appended for you, so a value ending in
      /v1 is refused rather than doubled.
    required: false
    default: ""
  anthropic_auth:
    description: >-
      how every model call this action makes authenticates to anthropic_base_url - the opencode run and
      each one-turn classification alike. "oidc-bearer" hands the gateway the job's GitHub OIDC token,
      minted for that origin, in both the Authorization and x-api-key headers, for a gateway that validates
      the JWT itself. "federation" trades that token at the origin's /v1/oauth/token, on the team's
      federation rule, for an Anthropic access token, which needs the origin to serve that exchange. Kong AI
      Gateway does not, so that value is only for a team whose own route proxies it. A bearer lives minutes
      and a review may run for thirty, so a plugin renews the opencode run's bearer ahead of expiry on
      either value. The live status summary asks the model on "oidc-bearer" only.
    required: false
    default: "oidc-bearer"
  trigger_phrase:
    description: >-
      an additional comment phrase that invokes a ksai flow; `/ksai` invokes one either way, and the
      command after the phrase decides which. The phrase must start the text or follow whitespace, and
      must end the text or precede whitespace. Two callers in one repository are told apart by a name
      of their own, never by `/ksai`, which reaches both.
    required: false
    default: ""
  ksai_ref:
    description: "ksai ref to load the plugin and trusted scripts from; defaults to the action's own ref, so pinning the action pins both"
    required: false
    default: ""
  stop_mode:
    description: >-
      how a `stop` or `pause` ends a run. "soft" tells the run and gives it `stop_grace_seconds` to finish what
      it has already started and write its manifest, then refuses every later tool call; "hard" refuses the
      very next one. A repository may narrow this to "hard" in `.ksai/ksai.json` and may not widen it.
    required: false
    default: "soft"
  stop_grace_seconds:
    description: >-
      how long a soft stop gives a run before its tools are refused and the watchdog ends it. A repository may
      lower this in `.ksai/ksai.json` and may not raise it. `stop_mode: hard` and `--now` both take it to zero.
    required: false
    default: "120"
  stop_warn_seconds:
    description: >-
      how long before the deadline a stopped run is told again. Clamped into `stop_grace_seconds`, so it can
      never fall due after the deadline it warns about. A repository may lower it and may not raise it.
    required: false
    default: "60"
  stop_preserve:
    description: >-
      "auto" pushes whatever a stopped run committed, turns any remaining working tree into one `chore(stop):` commit
      through the same verification every other commit gets, and uploads that tree as an artifact. "off" keeps
      only what was already committed. `stop_mode: hard` and `--now` skip it either way.
    required: false
    default: "auto"
  bot_login:
    description: >-
      known bot login (e.g. '<app-slug>[bot]') for identity-gated reads of this flow's own comments and for
      commit attribution. Bare comments on flow-owned pull requests and checkpoint, fix and revise comment-state
      reads fail closed when this is empty. An App installation token cannot resolve /user, so the caller must
      pass the login explicitly when using those paths.
    required: false
    default: ""
  issue_number:
    description: >-
      the issue or pull request to work on when the event carries none. Required on `workflow_dispatch` and
      ignored on a comment, where the event carries it.
    required: false
    default: ""
  actor:
    description: >-
      GitHub username to run the CODEOWNERS authorization check against on a dispatch. **Honoured by the review
      flow only.** The implement flow authorizes `github.triggering_actor`, never an input: an input is free
      text the caller sets, and a caller holding only `actions: write` could name a real code owner's login to
      borrow their authority.
    required: false
    default: ""
  comment_body:
    description: >-
      the comment body to act on, for a `workflow_dispatch` that is a request rather than a continuation. Empty
      keeps a dispatch a continuation. Ignored on a comment, where the event carries the body.
    required: false
    default: ""
  comment_id:
    description: >-
      the comment a dispatched request answers, reacted to and recorded as the request's identity. The `do`
      phase records a request by this id and refuses to push without one; the plan phases need none. Given
      with `comment_kind`, the comment is read back from GitHub and answered as the event it arrived on, so
      the words, the author the CODEOWNERS check runs against and the edit state all come from GitHub.
    required: false
    default: ""
  comment_kind:
    description: >-
      which comment space `comment_id` came from, `issue`, `review` or `submitted_review`. The endpoints answer 404 for each
      other's ids, so it is named rather than guessed. This is the input that asks for the comment to be read
      back: an id without it keeps the older meaning, the identity a run records itself against, with the
      words carried in `comment_body`.
    required: false
    default: ""
  fleet_dials_endpoint:
    description: >-
      Base URL of the control plane that dispatched this run, or empty. The dispatch record is read from it
      with `record_id` over the run's own OIDC token, so the record names only what the control plane
      decided for this run, and this run reports what it cost back to it - a budget can only refuse a
      run against spend the control plane was told about
    required: false
    default: ""
  record_id:
    description: >-
      The dispatch record the control plane named, or empty. A record naming `fix` and a label starts a
      run nobody typed, authorized as whoever applied that label, and only while the pull request still
      carries it at the head the record was decided for
    required: false
    default: ""
  app_slug:
    description: >-
      the App this flow authenticates as, which is what a dispatched comment's starter is measured against.
      Named apart from `bot_login`, which is the login a flow *posts* as and differs between them - the
      tester posts as `github-actions[bot]` whatever App dispatched the run.
    required: false
    default: ""
  additional_prompt:
    description: "additional prompt to be added to the context"
    required: false
    default: ""
  work_guidance:
    description: >-
      what the requester said beyond naming the work, for a run nothing on GitHub started. HTML-escaped,
      because it lands in the same prompt slot a trigger comment's own words land in, and that slot
      refuses a raw `<` or `>`. Used only where there is no comment to take those words from.
    required: false
    default: ""
  ask:
    description: >-
      the Jira ask this run answers, as the control plane minted it, or empty where the run answers none.
      Every implement marker names it, so the control plane reads a marker only for the ask it answers.
    required: false
    default: ""
  work_item:
    description: >-
      the work item this run is about, as the control plane read it for the person who asked.
    required: false
    default: ""
  engine:
    description: >-
      which engine runs the model. `opencode` is the only one, and empty resolves to it on every
      flow that starts a model.

      **`claude` is refused, not ignored.** That engine no longer runs here, and a value this action
      read and discarded would leave a caller believing it had chosen something. The name stays
      declared because removing an input breaks every pinned consumer.

      `opencode` runs the open-source CLI against `anthropic_base_url` on the credential
      `anthropic_auth` names, so the origin, billing boundary and four identifiers below are
      unchanged and no key is added. It receives the prepared diff, review prompt,
      kreview agents and skills, triage routing, repository rules and read-only tool policy, and
      everything downstream of the model - the publisher, suppression store, run report and eval
      record - is the same code it always was. `test-publish` starts no model, so naming an engine there is
      refused rather than ignored.
    required: false
    default: ""
  test_hypotheses:
    description: 'Optional version 1 JSON candidate packet, bound to the tested head and base, at most 16 KiB. Hypotheses add probes and never replace acceptance criteria.'
    required: false
    default: ""
  shadow_model:
    description: 'Explicit bounded model override for unpublished review experiments; takes precedence over comment model flags.'
    required: false
    default: ''
  review_strategy:
    description: 'baseline keeps the existing reviewer; evidence runs independent evidence audits; dual adds an independent contract hunt. OpenCode review only.'
    required: false
    default: "baseline"
  review_experiment:
    description: 'JSON replay controls: immutable revisions, trial, history, result transport and lsp_tool (off or native). Text/structured and native LSP require an unpublished exact-revision replay.'
    required: false
    default: ""
  publish:
    description: >-
      `false` runs the whole review and writes nothing to the pull request: no reaction, no start
      notice, no run report, no review, no notice. The eval record, the artifacts and the stage
      timings are produced exactly as they would be, which is the point - a shadow arm of an engine
      comparison has to be comparable without a second review arriving on a pull request nobody
      asked twice. It is not `dry_run`, which skips the model and so measures nothing. Write flows
      refuse `false`, because paid writing must announce its progress and result.
    required: false
    default: "true"
  opencode_version:
    description: >-
      npm version of `opencode-ai` the `opencode` engine installs, with no `v` prefix. Pinned rather than
      latest, because that CLI cuts releases daily and an unpinned reviewer is a different reviewer every run.
    required: false
    # renovate: datasource=npm depName=opencode-ai
    default: "1.18.31"
  opencode_pty:
    description: >-
      Opt-in pilot for audited background PTY sessions in OpenCode test and active implementation
      phases. `true` loads pinned opencode-pty 0.3.6 through KSAI's bounded adapter. Review,
      planning and isolated runs never load it.
    required: false
    default: "false"
  model:
    description: "model id or catalog alias for the run. Exposed as an input so one value feeds both the CLI and any later record."
    required: false
    default: "flagship"
  model_pinned:
    description: >-
      `true` when the caller's dispatch named the model for this one run, so nothing automatic may move
      it: review triage, write triage and the control plane's own write arm all leave it alone, and the
      run records `pinned` as the arm's provenance rather than `input` or `triage`. Empty, the default,
      leaves the model exactly as movable as it is today. It bounds nothing a comment may ask for - the
      `allowed_models` and effort bounds still answer that question.
    required: false
    default: ""
  effort_pinned:
    description: >-
      `true` when the caller's dispatch named the effort for this one run. The same rule as
      `model_pinned`, on the other axis.
    required: false
    default: ""
  dials_arm:
    description: >-
      experiment arm the control plane assigned this run, as `<experiment>:<control|variant>`, or
      `baseline` where no experiment is running. Empty, the default, means no arm produced this
      run's dials. It steers nothing: it is recorded beside the result so a later reading can group
      by the arm that produced it.
    required: false
    default: ""
  allowed_models:
    description: >-
      models a triggering comment may request with `--model`, comma- or space-separated. Also bounds the model
      review triage may downgrade to and the automatic write profiles. The `model` input above is never checked
      against it. Empty permits no comment override or automatic write move, so a write keeps the configured
      model. List model ids, not the fast/balanced/flagship tier aliases: the alias is resolved before this list
      is checked, so an alias here matches nothing and is rejected as a misconfiguration.
    required: false
    default: "zai-org/GLM-5.3-Flash,zai-org/GLM-5.3,claude-opus-5,claude-sonnet-5,claude-haiku-4-5"
  disabled_commands:
    description: >-
      commands this repository turns off, comma- or space-separated, from `review`, `implement`, `approve`,
      `fix`, `do`, `revise`, `unlock`, `resume`, and `test`. Empty (the default) answers every command the
      selected flow owns, and a command this repository ships later is answered the day it ships. `help`,
      `stop`, and `pause` remain available because they start no flow. Unlike `allowed_models`, `max_effort`,
      and `min_effort`, this bounds the action itself rather than only a triggering comment: a command named
      here is refused out loud wherever somebody writes it, and dropped from the classifier's answer set so a
      comment naming no command is never routed to it. List canonical commands, not this repository's own
      aliases - an alias here is rejected naming the command to write instead, the same way `allowed_models`
      rejects a model alias. A list naming every command a flow owns is legal and means every one of them is
      off.
    required: false
    default: ""
  write_access_commands:
    description: >-
      commands anyone holding write access on the repository may run, comma- or space-separated. Every other
      command needs the commenter to own a path in `CODEOWNERS` as well. `all` is the default and names every
      command a repository can open, one shipped later included, because anyone holding write can already
      push whatever those commands would write. What the stricter bar protects is the team's Anthropic
      budget rather than the code, so an organization that grants write broadly is the one to narrow this -
      to a list of names, or to the empty value that holds every command to ownership. `stop` and `pause`
      are refused here by name. `.ksai/ksai.json` may take names out of this list and may never add one.
    required: false
    default: "all"
  allowed_commands:
    description: >-
      replaced by `disabled_commands`, which names the commands this repository turns off rather than the ones
      it answers. Still declared so a value left behind stops the run naming its replacement: an undeclared
      input is only warned about, and a repository that had narrowed itself to `review` would silently start
      answering every command instead.
    required: false
    default: ""
  classifier_model:
    description: >-
      model for the one-word classifier that reads a comment naming no command, as an id or an alias. Deliberately
      NOT bounded by `allowed_models`, `max_effort` or `min_effort`: those bound what a commenter may request,
      and this arm is this repository's own configuration. It runs with no tools and a one-turn cap, so a wrong
      answer costs a notice rather than a run. Set it to something unusable to switch classification off.
    required: false
    default: "balanced"
  write_triage_model:
    description: >-
      model for the one-word write triager, as an id or alias. On an `implement` request with
      `plan_mode: auto`, it answers small or planned and decides whether the work gets a direct build. On
      other write work it answers routine, uncertain or critical. It runs once with no tools and a one-turn
      cap after the write context is known; a malformed or unavailable sizing answer keeps the plan.
    required: false
    default: "balanced"
  bare_comments:
    description: >-
      `auto` reads a comment that names no command when it sits on a pull request this flow opened, so a
      code owner can steer a run by talking to it. Every other comment still needs the trigger phrase, and
      the author still goes through the same CODEOWNERS check that starts a run. `off` requires the phrase
      everywhere.

      `.ksai/ksai.json` may narrow this to `off` and may never widen it. Those two words and nothing else,
      for the reason `status_updates` gives: a third value would leave a repository believing comments
      without the phrase were ignored while they steered runs, or the reverse.

      The cost is one cheap classifier call per comment on one of this flow's own pull requests, which is
      the same call a phrase-less trigger phrase already pays for.
    required: false
    default: "auto"
  status_updates:
    description: >-
      `auto` to edit the comment a run opens with while it works, so the pull request says what the run is
      doing and how long it has left. `off` leaves that comment as it was posted.
      The reading comes from the CLI's own session transcript, so nothing is asked of the run itself and
      nothing is added to its context.

      Those two words and nothing else, for the reason `triage` gives: a third value would leave a
      repository believing status updates were off while they ran, or the reverse.
    required: false
    default: "auto"
  status_history:
    description: >-
      `auto` keeps up to 24 distinct updates in the comment. `off` disables the history and shows only the
      latest timestamped update. Both modes keep the current stage heading, counters and run link. Those two
      words and nothing else, so a typo cannot silently select the opposite display.
    required: false
    default: "auto"
  status_model:
    description: >-
      model that writes the one sentence a status carries, as an id or an alias. Deliberately NOT bounded by
      `allowed_models`, `max_effort` or `min_effort`, for the same reason as `classifier_model`: those bound
      what a commenter may request, and this arm is this repository's own configuration. It reads the run's
      own narration and tool calls, never a tool result. Leave it empty for counters and no sentence.
    required: false
    default: "balanced"
  effort:
    description: "reasoning effort for the run: low|medium|high|xhigh|max. Empty uses the model's default: max for GLM-5.3-Flash, high otherwise"
    required: false
    default: ""
  max_effort:
    description: >-
      highest effort a comment may request. Empty means the `effort` input is the ceiling, so a comment cannot
      escalate past what this repo already configured. Also caps automatic write profiles, but never changes the
      `effort` input itself. Note this bounds reasoning depth, not spend - the model is the cost lever, and spend
      is not monotonic in effort.
    required: false
    default: ""
  min_effort:
    description: >-
      lowest effort a comment may request. Empty means `medium`, because a shallower run does not reliably
      produce a usable result. Also bounds automatic write profiles, but never changes the `effort` input itself.
    required: false
    default: ""
  extra_claude_args:
    description: >-
      **Refused on every flow.** These were the Claude CLI's own arguments and no flow starts that
      CLI, so they reach nothing. Empty is the only value that runs. The name stays declared because
      removing an input breaks every pinned consumer.
    required: false
    default: ""
  triage:
    description: >-
      `auto` selects a bounded arm after each flow has its context. Reviews use the changed-file policy to
      propose a cheaper model, name kreview skills, or skip a diff with nothing reviewable in it. Writes apply
      deterministic risk rules and then a no-tools semantic triager. `off` restores each flow's exact configured
      arm.

      The rules are tables in `.github/scripts/triage/rules.json` in the ksai source repository, beside the review scripts
      because the action stages that one directory onto the runner; a rules file anywhere else never arrives.
      Review triage only ever proposes a *downgrade*. Write triage is clamped to the configured model and effort
      ceilings. `allowed_models` bounds both.
    required: false
    default: "auto"
  triage_write:
    description: >-
      who decides the model and effort a write run spends. `cp` asks the control plane named by
      `fleet_dials_endpoint`, over this job's own OIDC token, and acts on what it answers. Anything else,
      which is every repository the control plane has not moved, keeps the decision on this runner.

      The control plane serves this dial; a caller does not pin it. Whatever it says, this action still checks
      the answer against `allowed_models`, `min_effort` and `max_effort` before acting on it, and a control
      plane that is down, slow, stale or answering something this action will not act on costs the run nothing
      but the profile it would have chosen on its own.
    required: false
    default: ""
  report_rendering:
    description: >-
      where this run's results are rendered: the review, its run report and notice, the write report, the
      notices and the thread replies. `local` renders them on this runner. `shadow` renders them here too, asks
      the control plane named by `fleet_dials_endpoint` over this job's own OIDC token, and records whether the
      two agreed. `cp` posts what the control plane renders and, when it cannot answer, a minimal comment that
      names why. This runner posts every one of them with its own token whichever it is.

      The control plane serves this dial; a caller does not pin it, and anything else reads as `local`.
    required: false
    default: ""
  review_triage_mode:
    description: >-
      V4 control-plane authority for review triage: `local` keeps the local decision, `shadow` compares
      a bound control-plane decision while keeping the local decision, and `cp` uses a valid control-plane
      decision. `cp` falls back to the configured review arm, never an unvalidated or stale response.
    required: false
    default: "local"
  repo_rules:
    description: >-
      `auto` to read `.ksai/review-rules.md`, `.ksai/review-rules.json` and `.ksai/review-rules/` from the
      reviewed repository's DEFAULT branch and splice what a diff matched into the review prompt, so a team
      states its own review rules once and every review applies them. `off` reviews as this action did before
      they existed. Review flow only.

      The default branch is the whole trust argument, and there is no input for another ref: a pull request
      cannot change the rules its own review reads. The rules may only ADD checks - the prompt says so - because
      a rule that silenced a finding would buy a clean review, which is what `docs/decisions/reviewer-trust-boundary.md`
      exists to refuse. A file that cannot be read, or one over the per-file cap `repo_rules_max_file_bytes`
      sets, stops the run before a model is called.

      Those two words and nothing else. A third value stops the run and says so, rather than falling to either
      side of the switch: `off` misspelled as `false` would review under rules the caller believes are off, and
      `auto` misspelled would silently retire rules a repository committed. Case and surrounding space are
      forgiven; nothing else is.
    required: false
    default: "auto"
  repo_rules_max_bytes:
    description: >-
      bytes of matched rules one review may stage. Empty is 98304, the default every repository
      gets; a number raises it, up to 262144.

      Not larger by default because a model handed more rules applies less of them, not more. Scope
      with `paths` first; this is for a repository that already has and still has a diff touching
      everything. Below the default is refused, because lowering it would retire rules silently.
    required: false
    default: ""
  repo_rules_max_rules:
    description: >-
      packs a directory may hold, and rules a manifest may name. Empty is 16; a number raises it, up
      to 64, and carries the source-file budget to twice the count, capped at 128.

      Both are checked before anything is fetched, so a directory somebody filled costs one API call
      rather than a hundred. Raising them raises that exposure, which is why the ceiling exists.
    required: false
    default: ""
  repo_rules_max_file_bytes:
    description: >-
      bytes any one rules file may hold. Empty is 16384, the default every repository gets; a number
      raises it, up to the bytes `repo_rules_max_bytes` allows a whole review.

      Every file a rule names is measured before the diff is matched, so one oversized file refuses
      every review on the repository rather than the ones its rule claims. A `source` list splits a
      file that grew across several, which costs nothing; this is for the file that is one document.
    required: false
    default: ""
  reviewer_id:
    description: >-
      logical reviewer name the suppression match IDs are derived from - not a model release, so it survives a
      model or effort bump. Changing it invalidates every committed suppression key for this reviewer, which is
      the point: change it when what the reviewer checks changes.
    required: false
    default: "kreview-full"
  suppressions_store:
    description: "owner/repo holding the committed suppression lists (suppressions/<owner>/<repo>/learnings.jsonl)"
    required: false
    default: ""
  suppressions_ref:
    description: "ref in the store to read the list from; a branch means a merged rule takes effect on the next review"
    required: false
    default: "main"
  suppressions_app_id:
    description: >-
      app id of the GitHub App used to read the suppression store. Empty (the default) skips the load entirely,
      so every finding posts.
    required: false
    default: ""
  suppressions_private_key:
    description: "private key of that same App. Empty skips the load, so every finding posts."
    required: false
    default: ""
  artifact_retention_days:
    description: >-
      how long the execution log, the event stream, the suppression record and the eval record are kept. The
      default is the window the eval sweep is scheduled against, and it is the caller's to lower because only
      the caller knows its own cap: a repository or organization that allows fewer days clamps the request and
      annotates every upload with a warning, so an action that asked for more than it can have said the wrong
      number three times a run and kept the artifact for the shorter period anyway. Raising it lengthens how
      long a downloadable copy of the review text exists, which is the reason it is bounded at all.
    required: false
    default: "14"
  job_timeout_minutes:
    description: >-
      the calling job's own `timeout-minutes`. A watchdog stops the CLI one minute before GitHub would cancel
      the job, which is the difference between a run that reports what happened and one that vanishes: a
      cancellation kills the model run before it reduces its event stream to the execution log, and the
      artifact, the cost record, the eval record and the notice are all read off that log, so they are lost
      together. This takes no default, because an action cannot read its caller's `timeout-minutes` and with
      a numeric default a caller that agreed with 35 and a caller that never looked were the same run. Leaving
      it unset still arms the watchdog at an assumed 35, so a consumer that changed nothing keeps its salvage
      path, and the run carries a warning annotation naming the assumption. Set it to 0 to disable the
      watchdog entirely. It cannot help a `cancel-in-progress` cancellation, which GitHub delivers with no
      warning.
    required: false
    default: ""
  max_consecutive_tool_failures:
    description: >-
      how many tool calls may fail in a row before the watchdog stops the run. The number is high
      because `is_error` means the shell exited non-zero rather than that the call failed: a search
      matching nothing exits 1, and a sandbox writing its own denied scratch path marks a command
      that ran and printed its output. Measured over 7600 real sessions, 2.4 percent reach ten
      failures in a row and 20 percent of the sessions that delegate to subagents do, with the
      longest healthy run at 43. A run that is genuinely stuck fails without bound, so it reaches
      any limit; raising this trades a false stop for a couple of minutes of detection, which is the
      cheap direction. Set it to 0 to turn the check off.
    required: false
    default: "50"
  max_repeated_tool_calls:
    description: >-
      how many times the same tool may run with identical input, one call after another, before the
      watchdog stops the run. This is the loop the failure count cannot see: every call succeeds, so
      nothing is failing, and the run reads the same file or runs the same command until the job ceiling.
      Only an unbroken run counts - any other tool call in between resets it - so a command re-run after
      an edit is not a loop. It compares the whole input rather than the summary line, and the key order
      a model wrote it in does not matter. Set it to 0 to turn the check off.
    required: false
    default: "8"
  dry_run:
    description: >-
      global action dry run, which skips the model and implementation publication. To validate test
      environments and publish an explicit no-verdict result, use `test_mode: dry-run` instead.
    required: false
    default: "false"
  environments:
    description: "flow: test only. Comma-separated environments to start; empty selects the contract's default set"
    required: false
    default: ""
  test_mode:
    description: >-
      flow: test only. `test` starts the selected environments and the tester. `dry-run` starts the selected
      environments without a model. `sweep` starts each selected environment, or every declared environment
      when none are selected, in a separate provisioning cycle. A no-model mode publishes
      `insufficient_evidence` after successful setup and `infra_failure` after setup or readiness failure.
    required: false
    default: test
  max_turns:
    description: >-
      **Refused on every flow.** It capped the turns of the Claude CLI, which no flow starts now,
      and opencode has no turn cap - so a value here would bound nothing and the job timeout is the
      only ceiling. Empty is the only value that runs. The name stays declared because removing an
      input breaks every pinned consumer, and the reusable workflow never exposed it.
    required: false
    default: ""
  run_dir:
    description: >-
      flow: test only. Workspace-relative directory where run files are written. `.git`, `.ksai`,
      and `_ksai` are reserved top-level directories.
    required: false
    default: .ksai-run
  run_id:
    description: "flow: test-publish only. Actions run whose artifacts are read; they must belong to issue_number. Empty uses the current run"
    required: false
    default: ""
  run_attempt:
    description: "flow: test-publish only. Producer attempt whose artifacts are read. Required; the reusable workflow supplies it"
    required: false
    default: ""
  classifier_model_used:
    description: >-
      the arm a caller's own classifier ran on, empty when it ran none. Set it and this action classifies
      nothing: a comment naming no command has one answer, and paying a second model to reach it again is a second
      charge for the same question. It is the presence of this value, not of a verdict, that says a
      classification happened - an outage answers no verdict and must not be read as a caller that never asked.
    required: false
    default: ""
  verdict:
    description: "the command a caller's own classifier read the comment as, empty when it reached none. Only ever read alongside classifier_model_used"
    required: false
    default: ""
  classifier_cost:
    description: "what the caller's classification cost, for the run report and the eval record"
    required: false
    default: ""
  classifier_input_tokens:
    description: "input tokens the caller's classification spent, including cache"
    required: false
    default: ""
  classifier_output_tokens:
    description: "output tokens the caller's classification spent"
    required: false
    default: ""
  classifier_turns:
    description: "model turns used by the caller-side classifier, copied into the run report and evaluation record"
    required: false
    default: ""
  classifier_duration:
    description: "elapsed seconds used by the caller-side classifier, copied into the run report and evaluation record"
    required: false
    default: ""
  fetch_depth:
    description: >-
      `fetch-depth` for the checkout of the repository being worked on, for the implement flow. Shallow by
      default, and the reason is the pool rather than the clone: a thirty-step plan is thirty sequential jobs
      for one issue, so a full-history clone of a ~100 MB repository costs 30-90s a run against 3-8s at depth
      1. The push gate spans `remoteSha..HEAD` and `remoteSha` is the checkout's own commit, so its ancestry
      and commit-count checks sit one commit either side of a shallow boundary. Set `0` if a step agent's own
      `git log` needs the history.

      **A pull-surface phase ignores this and always takes full history**: it is one job per request rather
      than thirty, and it is changing existing work in response to a review. A review ignores it too: it clones
      the pull request head at depth 1, then fetches the head and its base only back to their merge base, so a real
      `git diff` has its base, and falls back to full history when that merge base cannot be proven.
    required: false
    default: "1"
  denied_paths:
    description: >-
      newline- or comma-separated paths any implementation write may not commit, added to the push gate's own
      floor rather than replacing it. The default covers the instruction files, and that is a security default
      rather than a style one: later phases read the root `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` for
      the conventions and gate commands they work to, and a coding agent on any later checkout loads them,
      `.claude` and `.mcp.json` as its instructions and configuration, so a write able to commit one would be
      writing the instructions the *next* run starts from. The cost is real and bounded: the flow cannot edit
      its own convention files.
    required: false
    default: |
      CLAUDE.md
      AGENTS.md
      CONTRIBUTING.md
      .claude
      .mcp.json
  plan_file_path:
    description: >-
      directory the plan document is committed to, relative to the repository root. The plan run writes one
      markdown file there, a code owner reviews it, and approving it turns it into the checklist that drives
      the work. Every later phase is refused that path, for the reason `denied_paths` refuses the instruction
      files: a step must not edit the plan it is judged by.
    required: false
    default: "docs/plans"
  keep_plan_file:
    description: >-
      whether the plan document stays in the repository once the pull request is marked ready for review.
      `true` keeps it as a record of what was agreed; `false` removes it in one final commit.
    required: false
    default: "true"
  plan_mode:
    description: >-
      whether an issue is planned before it is built. `auto` asks the write triager to size the work and
      skips the plan for the small end of it, building the change in one run and opening the pull request
      ready for review; `always` plans every change; `never` plans none of them.

      `.ksai/ksai.json` may narrow this to `always` and may never widen it, and a comment may name `--plan`
      or `--no-plan` for one run. `--no-plan` against a repository that plans everything is refused out loud
      rather than honoured quietly. A run that needs a code owner's approval, and a run read from a Jira
      ticket, are planned whatever this says: there is nothing to approve and nobody to hold otherwise.
    required: false
    default: "auto"
  require_plan_approval:
    description: >-
      hold every step behind the same approval that released the plan. Off by default, and off changes
      nothing about the plan document itself: that is always reviewed, because it becomes the checklist every
      later run reads and no configuration publishes it unread. The approval is derived from the conversation
      on every run rather than recorded, so there is no flag to go stale against a plan that has since been
      rewritten.
    required: false
    default: "false"
  continuation_workflow:
    description: >-
      the caller's own workflow filename, e.g. `ksai.yml`. Set it to turn on the continuation chain: one run
      does one plan step. Where `fleet_dials_endpoint` names a control plane the repository is enrolled with,
      that control plane decides whether the chain goes on and starts the next run itself. Otherwise this is
      what the run dispatches to start the next: the
      workflow must declare `workflow_dispatch` with the continuation inputs below and the job needs
      `actions: write`.
    required: false
    default: ""
  continuation_attempt:
    description: "how many runs this chain has already spent. Not derivable from anything, so it rides the dispatch."
    required: false
    default: ""
  continuation_stall:
    description: "consecutive runs that completed no plan step. The other value that is not derivable."
    required: false
    default: ""
  continuation_prev_remaining:
    description: "unchecked boxes the predecessor saw, so this run can tell progress from a stall. Absent is not zero."
    required: false
    default: ""
  team:
    description: >-
      team label for telemetry and for the X-Ksai-Team cost-attribution header. The header is
      sent on every run; the OTEL export it also feeds stays gated on otel_headers.
    required: false
    default: ""
  otel_endpoint:
    description: "OTLP HTTP endpoint for the metrics, and on the opencode engine the traces and log lines, this run exports; defaults to Datadog's direct OTLP intake, org-wide"
    required: false
    default: "https://otlp.datadoghq.com"
  otel_headers:
    description: >-
      OTLP auth header, e.g. dd-api-key=<value of the KSAI_DATADOG_KEY secret>; the actual on/off switch, since
      telemetry is skipped whenever this is empty. Composite actions have no secrets context of their own, so a
      caller must pass this - never write a live Actions expression referencing secrets anywhere in this file,
      since the manifest parser evaluates those in every string field, descriptions included, and fails to load
      the whole action when it does
    required: false
    default: ""
  otel_extra_attributes:
    description: "extra OTEL_RESOURCE_ATTRIBUTES appended after team/repo/workflow; same strict comma-separated key=value format"
    required: false
    default: ""
  jira_site:
    description: >-
      the Jira site hostname, e.g. your-site.atlassian.net. Used only to render links and the criteria marker
      that carries the ticket key to every later run.
    required: false
    default: ""
  jira_projects:
    description: >-
      the Jira project keys this repository may plan from, comma or space separated, e.g. `KAG MESH`. This is
      the boundary: a Jira ticket is the first prompt input from outside the repository the run writes to. An
      empty value rejects every Jira-backed run rather than allowing every project.
    required: false
    default: ""
  jira_allow_public_repo:
    description: >-
      allow a Jira work source on a PUBLIC repository. Off by default, and deliberately: this action uploads
      the model transcript as a workflow artifact, that transcript contains the prompt, and the prompt
      contains the ticket verbatim - so on a public repository the ticket's full text, comments included, is
      downloadable by anyone. Set to "true" only where that is understood and acceptable.
    required: false
    default: "false"
  jira_title_key:
    description: >-
      where the Jira key goes in the pull request title, for repositories that track work by it - `prefix`,
      `suffix` or `none`. It lands inside the description either way, never in front of the type, because the
      title must stay a Conventional Commit subject. `none` by default, because changing where a published
      title carries the key changes every consumer's titles without anybody asking. A repository that wants
      the key there sets `suffix`: GitHub for Atlassian links a pull request to its ticket by the key in the
      branch name, the commit message or the title, and a ticket-addressed run already carries a `Jira:`
      trailer on every commit, so the link holds either way.
    required: false
    default: "none"
  work_ref:
    description: >-
      the work to do when there is no GitHub issue at all, as `jira/<KEY>` - e.g. `jira/KAG-1234`. It names
      a Jira work item a run was started for through the control plane, which hands the run that work item
      in its record. Dispatch-only. A run started this way is refused unless `require_plan_approval` is
      "true", because the CODEOWNERS gate bounds who may trigger a run and a Jira assignment is not a GitHub
      identity - the approval is what puts a code owner back in front of the first commit. Which tickets can
      start one is bounded by `jira_projects`.
    required: false
    default: ""
  work_actor:
    description: >-
      GitHub login of whoever asked, as the control plane's dispatch record names it, for a run nothing on
      GitHub started. The gate hands it over from the record; no dispatch input sets it. It is a claim from
      outside this repository and never a grant: it is shape-checked here and re-derived through
      `codeowners-authz`, and it may only ever add a refusal. A run carrying none is answered exactly as it
      was before, because otherwise every requester who has not mapped a GitHub account loses every ticket.
    required: false
    default: ""

outputs:
  pr_url:
    description: >-
      URL of the pull request this run opened. Planned work returns a draft pull request; direct work returns one
      ready for review. Empty when this run did not open a pull request.
    value: ${{ steps.open_draft.outputs.pr_url || steps.publish.outputs.pr_url || steps.publish_direct.outputs.pr_url }}
  branch:
    description: "the branch this run worked on, including an existing branch when no new commit was needed; empty when no branch was resolved"
    value: ${{ steps.open_draft.outputs.branch || steps.open_branch.outputs.branch || steps.phase.outputs.ref }}
  status:
    description: >-
      'planned' when this run wrote a plan into the draft pull request, 'built' when it implemented a whole
      issue and opened its pull request for review, 'released' when it turned a reviewed plan into the pull
      request checklist, 'stepped' when it completed one plan step, 'fixed' when it answered review threads with
      a commit, 'changed' when it did a requested piece of work with one, 'answered' when review threads needed
      no commit, 'unchanged' when the requested work did not, 'blocked' when it stopped deliberately, empty when
      it never got that far. A caller driving the
      loop reads this together with `remaining`.
    value: >-
      ${{ steps.publish.outputs.status || steps.publish_direct.outputs.status || steps.record.outputs.status ||
      steps.record_fix.outputs.status || steps.record_do.outputs.status || steps.release_plan.outputs.status }}
  remaining:
    description: >-
      work still outstanding after this run, as a string: plan steps still unticked in the plan phases, review
      threads still unanswered in the fix phase. '0' in a plan phase means every box is ticked and the pull
      request is ready to be marked ready for review. Empty when this run completed nothing.
    value: >-
      ${{ steps.record.outputs.remaining || steps.record_fix.outputs.remaining ||
      steps.release_plan.outputs.remaining }}
  verdict_path:
    description: "flow: test only. Path to the tester's verdict, whether the publisher will accept it or not"
    value: ${{ steps.test_paths.outputs.verdict }}
  outcome:
    description: "flow: test-publish only. Published verdict outcome, or 'rejected' when validation fails"
    value: ${{ steps.post_test.outputs.outcome }}
  conclusion:
    description: >-
      `success` or `failure`, from the model run; empty when no model ran. A `flow: run` caller reads it,
      because nothing in that flow publishes the result for it.
    value: ${{ steps.model_run.outputs.conclusion }}
  execution_file:
    description: "path to the model run's execution log, for a `flow: run` caller that reads the result itself; empty when no model ran"
    value: ${{ steps.model_run.outputs.execution_file }}

runs:
  using: composite
  steps:
    - name: Save this action for the post phase
      id: save_self
      shell: bash
      env:
        SELF: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "${SELF}/" in
          "${GITHUB_WORKSPACE}"/*) ;;
          *)
            echo "This action was referenced by ref, so no checkout can overwrite it."
            exit 0
            ;;
        esac
        stash="${RUNNER_TEMP}/ksai-self-action/$(printf '%s' "$SELF" | cksum | cut -d' ' -f1)"
        rm -rf -- "$stash"
        mkdir -p "$stash"
        cp "${SELF}/action.yml" "${stash}/action.yml"
        printf 'at=%s\n' "${SELF#"${GITHUB_WORKSPACE}"/}" >> "$GITHUB_OUTPUT"
        printf 'stash=%s\n' "$stash" >> "$GITHUB_OUTPUT"

    - name: Validate flow
      id: validate_flow
      shell: bash
      env:
        FLOW: ${{ inputs.flow }}
        PROFILE: ${{ inputs.profile }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        EXTRA_ALLOWED_TOOLS: ${{ inputs.extra_allowed_tools }}
        EXTRA_DISALLOWED_TOOLS: ${{ inputs.extra_disallowed_tools }}
        SANDBOX_ALLOW_WRITE: ${{ inputs.sandbox_allow_write }}
        SANDBOX_DENY_WRITE: ${{ inputs.sandbox_deny_write }}
        SANDBOX_DENY_ENV: ${{ inputs.sandbox_deny_env }}
      run: |
        set -euo pipefail
        case "${FLOW}" in
          review|implement|test|test-publish|run) ;;
          *) echo "::error::flow must be one of review, implement, test, test-publish, run, got: ${FLOW}"; exit 1 ;;
        esac
        if [[ "${FLOW}" != "run" ]]; then
          for name in PROFILE PROMPT_FILE EXTRA_ALLOWED_TOOLS EXTRA_DISALLOWED_TOOLS SANDBOX_ALLOW_WRITE SANDBOX_DENY_WRITE SANDBOX_DENY_ENV; do
            if [[ -n "${!name:-}" ]]; then
              echo "::error::${name,,}: only flow: run reads it, so on flow: ${FLOW} it would bound nothing. Drop it"
              exit 1
            fi
          done
        fi

    - name: Say where this run's results are rendered
      id: report_rendering
      if: ${{ inputs.report_rendering != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RENDERING: ${{ inputs.report_rendering }}
        ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
      with:
        script: |
          core.exportVariable('KSAI_REPORT_RENDERING', process.env.RENDERING);
          core.exportVariable('KSAI_REPORT_ENDPOINT', process.env.ENDPOINT);

    - name: Validate pull request test inputs
      id: validate_test_inputs
      if: ${{ inputs.flow == 'test' || inputs.flow == 'test-publish' }}
      shell: bash
      env:
        FLOW: ${{ inputs.flow }}
        TEST_MODE: ${{ inputs.test_mode }}
        RUN_DIR: ${{ inputs.run_dir }}
        SOURCE_RUN: ${{ inputs.run_id }}
        SOURCE_ATTEMPT: ${{ inputs.run_attempt }}
      run: |
        set -euo pipefail
        if [[ "${FLOW}" == "test" ]]; then
          case "${TEST_MODE}" in
            test|dry-run|sweep) ;;
            *) echo "::error::test_mode must be one of test, dry-run, sweep, got: ${TEST_MODE}"; exit 1 ;;
          esac
        fi
        if [[ ! "${RUN_DIR}" =~ ^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]]; then
          echo "::error::run_dir must be a non-empty workspace-relative path using simple path segments, got: ${RUN_DIR}"
          exit 1
        fi
        IFS='/' read -r -a segments <<< "${RUN_DIR}"
        for segment in "${segments[@]}"; do
          if [[ "${segment}" == "." || "${segment}" == ".." ]]; then
            echo "::error::run_dir may not contain . or .. path segments, got: ${RUN_DIR}"
            exit 1
          fi
        done
        case "${segments[0]}" in
          .git|.ksai|_ksai)
            echo "::error::run_dir may not use the reserved top-level directory ${segments[0]}"
            exit 1
            ;;
        esac
        if [[ "${FLOW}" == "test-publish" ]]; then
          if [[ -n "${SOURCE_RUN}" && ! "${SOURCE_RUN}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run_id must be empty or a positive integer"
            exit 1
          fi
          if [[ ! "${SOURCE_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::run_attempt must name the positive producer attempt"
            exit 1
          fi
        fi

    - name: Refuse a call that names no federation
      if: ${{ inputs.flow != 'test-publish' }}
      shell: bash
      env:
        RULE_ID: ${{ inputs.federation_rule_id }}
        ORGANIZATION_ID: ${{ inputs.organization_id }}
        SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        WORKSPACE_ID: ${{ inputs.workspace_id }}
      run: |
        set -euo pipefail
        missing=""
        for name in RULE_ID ORGANIZATION_ID SERVICE_ACCOUNT_ID WORKSPACE_ID; do
          if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
        done
        if [ -n "${missing}" ]; then
          echo "::error::this call names no federation, so no Anthropic token can be minted and nothing would run; pass:${missing}"
          exit 1
        fi


    - name: Say so when there is no conversation to review
      if: >-
        ${{ inputs.flow == 'review' && github.event.issue.pull_request == null &&
        github.event.pull_request == null && inputs.issue_number == '' }}
      shell: bash
      run: |
        echo "::error::flow: review was given no conversation to answer on. The event carries no pull request, so \`issue_number\` has to name one - it is required on workflow_dispatch and on any event that is not a comment on a pull request"
        exit 1

    - name: Resolve the review engine
      id: engine
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ENGINE: ${{ inputs.engine }}
        FLOW: ${{ inputs.flow }}
        PUBLISH: ${{ inputs.publish }}
        DRY_RUN: ${{ inputs.dry_run }}
        MAX_TURNS: ${{ inputs.max_turns }}
        EXTRA_ARGS: ${{ inputs.extra_claude_args }}
        REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        OPENCODE_PTY: ${{ inputs.opencode_pty }}
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        PTY_LOCK: ${{ github.action_path }}/../../scripts/vendor/opencode-pty/package-lock.json
      run: |
        set -euo pipefail
        if [[ -n "${ENGINE}" && "${FLOW}" == "test-publish" ]]; then
          echo "::error::engine: flow: test-publish starts no model, so it names no engine, and ${ENGINE} would bound nothing"
          exit 1
        fi
        # Every flow runs opencode. `claude` is refused rather than resolved away, because a value a
        # caller passed and this action quietly ignored is worse than one it stops on - and the
        # input keeps its published name, type and empty default, which is the only shape a release
        # on this line can carry.
        case "${ENGINE}" in
          '' | opencode)
            ENGINE=opencode
            pattern='opencod[e] run'
            ;;
          claude)
            echo "::error::engine: the Claude engine no longer runs here - every flow runs opencode. Drop the input, or pass engine: opencode"
            exit 1
            ;;
          *)
            echo "::error::engine: ${ENGINE} names no engine - write opencode, or leave it empty"
            exit 1
            ;;
        esac
        # Both bounded the Claude CLI and nothing starts that CLI now, so they reach nothing. Each
        # is refused on every flow rather than dropped, or a caller keeps a `with:` line this action
        # reads and discards.
        if [[ -n "${MAX_TURNS}" ]]; then
          echo "::error::max_turns: opencode has no turn cap, so ${MAX_TURNS} would bound nothing and the job timeout would be the only ceiling. Drop it"
          exit 1
        fi
        if [[ -n "${EXTRA_ARGS}" ]]; then
          echo "::error::extra_claude_args: these were the Claude CLI's own arguments and no flow starts that CLI, so they reach nothing. Drop it"
          exit 1
        fi
        if [[ "${FLOW}" == "implement" && "${DRY_RUN}" == "false" && "${PUBLISH}" != "true" ]]; then
          echo "::error::flow: implement refuses publish: false because paid writing must announce its progress and result"
          exit 1
        fi
        case "${REVIEW_STRATEGY}" in
          baseline) ;;
          evidence|dual)
            if [[ "${FLOW}" != "review" ]]; then
              echo "::error::review_strategy: evidence and dual require flow: review"
              exit 1
            fi
            ;;
          *) echo "::error::unknown review_strategy"; exit 1 ;;
        esac
        case "${OPENCODE_PTY}" in
          false) ;;
          true)
            if [[ "${FLOW}" != "implement" && "${FLOW}" != "test" ]]; then
              echo "::error::opencode_pty: true is limited to implement and test flows"
              exit 1
            fi
            audited="$(node -p 'require(process.env.PTY_LOCK).packages["node_modules/@opencode-ai/plugin"].version')"
            if [[ "${OPENCODE_VERSION}" != "${audited}" ]]; then
              echo "::error::opencode_pty: true requires the audited opencode_version ${audited}"
              exit 1
            fi
            ;;
          *) echo "::error::opencode_pty must be true or false"; exit 1 ;;
        esac
        echo "name=${ENGINE}" >> "$GITHUB_OUTPUT"
        echo "cli_pattern=${pattern}" >> "$GITHUB_OUTPUT"

    - name: Resolve plugin ref
      id: plugin_ref
      if: >-
        ${{ inputs.flow != 'review' || github.event.issue.pull_request != null ||
        github.event.pull_request != null || inputs.issue_number != '' }}
      shell: bash
      env:
        KSAI_REF: ${{ inputs.ksai_ref }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ref=${KSAI_REF:-$ACTION_REF}" >> "$GITHUB_OUTPUT"
        at=$(date +%s%3N)
        echo "started_at_ms=${at}" >> "$GITHUB_OUTPUT"
        # The same instant the stage report measures `setup_ms` from, so both reports share an origin.
        printf '%s\t%s\n' "$at" "resolve" >> "${RUNNER_TEMP}/ksai-phases.tsv" || true

    - name: Mark the bootstrap phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: bootstrap
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout trusted authz action
      id: checkout_authz
      if: ${{ steps.plugin_ref.outcome == 'success' }}
      with:
        token: ${{ inputs.kong_org_github_token }}
        path: _ksai
        repository: Kong/ksai-public
        ref: ${{ steps.plugin_ref.outputs.ref }}
        sparse-checkout: |
          .github/agent-workflows
          .github/actions/codeowners-authz
          .github/actions/dispatch-record
          .github/scripts
        persist-credentials: false

    - name: Stage trusted scripts outside the workspace
      id: staged_scripts
      if: ${{ steps.checkout_authz.outcome == 'success' }}
      shell: bash
      env:
        DEST: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        rm -rf -- "$DEST"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/scripts" "$DEST"
        rm -rf -- "${RUNNER_TEMP}/ksai-workflows"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/agent-workflows" "${RUNNER_TEMP}/ksai-workflows"
        echo "sha=$(git -C "${GITHUB_WORKSPACE}/_ksai" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/actions/codeowners-authz" "${DEST}/codeowners-authz"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/actions/dispatch-record" "${DEST}/dispatch-record"
        find "$DEST" -name '*.test.mjs' -delete

    - name: Keep the trusted checkout out of the caller's commits
      id: exclude_ksai
      if: ${{ inputs.flow == 'run' && steps.checkout_authz.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        git_dir="${GITHUB_WORKSPACE}/.git"
        if [[ ! -d "${git_dir}" || -L "${git_dir}" || -L "${git_dir}/info" ]]; then
          echo "The workspace root is not a repository, so no commit of the caller's can stage _ksai"
          exit 0
        fi
        mkdir -p "${git_dir}/info"
        if ! grep -qxF '_ksai/' "${git_dir}/info/exclude" 2>/dev/null; then
          echo '_ksai/' >> "${git_dir}/info/exclude"
        fi

    - name: Resolve the status arm
      id: status_gate
      if: >-
        ${{ steps.checkout_authz.outcome == 'success' && inputs.flow != 'test-publish' }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        STATUS_UPDATES: ${{ inputs.status_updates }}
        STATUS_HISTORY: ${{ inputs.status_history }}
        STATUS_MODEL: ${{ inputs.status_model }}
      run: node "${SCRIPTS}/ksai/status.mjs"

    - name: Validate anthropic_base_url
      if: ${{ steps.checkout_authz.outcome == 'success' && inputs.flow != 'test-publish' }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
      run: |
        set -euo pipefail
        if [[ ! "${ANTHROPIC_BASE_URL}" =~ ^https:// ]]; then
          echo "::error::anthropic_base_url must start with https:// - every model call this action makes and its OIDC exchange go to it, whichever engine runs, and empty takes the run off Kong AI Gateway rather than falling back to Anthropic, got: ${ANTHROPIC_BASE_URL}"
          exit 1
        fi

        if [[ "${ANTHROPIC_BASE_URL}" =~ /v1/*$ ]]; then
          echo "::error::anthropic_base_url names an endpoint rather than an origin - the version segment is appended by every caller, so this would be called at it again. Drop the /v1, got: ${ANTHROPIC_BASE_URL}"
          exit 1
        fi

        case "${ANTHROPIC_AUTH}" in
          federation|oidc-bearer) ;;
          *) echo "::error::anthropic_auth must be one of federation, oidc-bearer, got: ${ANTHROPIC_AUTH}"; exit 1 ;;
        esac

    # The live status summariser is the only reader now that no step here starts the Claude CLI, so
    # the gate narrows to what that reader needs. Left as it was, a `publish: false` run - a shadow
    # review - asked for an identity token nothing consumed.
    #
    # `continue-on-error` for the same reason. This mint fed the Claude CLI's own `apiKeyHelper`,
    # where failing the job was right: no credential, no run. Its only reader now is a progress
    # sentence, and `status-ask.mjs` answers null for an empty helper - so one 5xx from the token
    # exchange took down step 15 of some 200 and the review never happened, to authenticate a
    # narrator that treats absence as "say nothing". The deletion removed the reason and left the
    # consequence.
    - name: Mark the authorize phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: authorize
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Mint a gateway bearer token from the job's OIDC token
      id: gateway_token
      continue-on-error: true
      if: >-
        ${{ steps.checkout_authz.outcome == 'success' && inputs.anthropic_auth == 'oidc-bearer' &&
        inputs.dry_run == 'false' && inputs.publish == 'true' &&
        inputs.flow != 'test' && inputs.flow != 'test-publish' && inputs.flow != 'run' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_URL: ${{ inputs.anthropic_base_url }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { writeGatewayTokenHelper } = require(`${process.env.SCRIPTS}/ksai/gateway-token.cjs`);
          core.setOutput('helper', writeGatewayTokenHelper({ core, audience: process.env.BASE_URL }));

    - name: Read the dispatch record
      id: dispatch_record
      if: >-
        ${{ steps.checkout_authz.outcome == 'success' && inputs.record_id != '' &&
        inputs.flow != 'test' && inputs.flow != 'test-publish' && inputs.flow != 'run' }}
      uses: ./_ksai/.github/actions/dispatch-record
      with:
        endpoint: ${{ inputs.fleet_dials_endpoint }}
        record_id: ${{ inputs.record_id }}

    - name: Resolve the run context
      id: context
      if: >-
        ${{ steps.checkout_authz.outcome == 'success' && inputs.flow != 'test-publish' &&
        inputs.flow != 'run' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        IN_BOT_LOGIN: ${{ inputs.bot_login }}
        RECORD_COMMAND: ${{ steps.dispatch_record.outputs.command }}
        RECORD_AUTOFIX_CAPABILITY: ${{ steps.dispatch_record.outputs.autofix_capability }}
        RECORD_LABEL: ${{ steps.dispatch_record.outputs.label }}
        RECORD_PR: ${{ steps.dispatch_record.outputs.pr }}
        RECORD_HEAD_SHA: ${{ steps.dispatch_record.outputs.head_sha }}
        RECORD_ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        RECORD_ID: ${{ inputs.record_id }}
        RECORD_AUDIENCE: ksai-cp
        RECORD_ACTION_PATH: ${{ runner.temp }}/ksai-scripts/dispatch-record
        SAW_TRIGGER: ${{ steps.dispatch_record.outputs.trigger }}
        FLOW: ${{ inputs.flow }}
        IN_ISSUE_NUMBER: ${{ inputs.issue_number }}
        IN_WORK_REF: ${{ inputs.work_ref }}
        IN_WORK_ACTOR: ${{ inputs.work_actor }}
        IN_ATTEMPT: ${{ inputs.continuation_attempt }}
        IN_STALL: ${{ inputs.continuation_stall }}
        IN_PREV_REMAINING: ${{ inputs.continuation_prev_remaining }}
        IN_COMMENT_BODY: ${{ inputs.comment_body }}
        IN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        IN_ACTOR: ${{ inputs.actor }}
        IN_COMMENT_ID: ${{ inputs.record_id == '' && inputs.comment_id || steps.dispatch_record.outputs.comment_id }}
        IN_COMMENT_KIND: ${{ inputs.record_id == '' && inputs.comment_kind || steps.dispatch_record.outputs.comment_kind }}
        IN_APP_SLUG: ${{ inputs.app_slug }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        script: |
          const { resolveRunContext } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, failure, securityPolicyRefused } =
            await resolveRunContext({ github, context, env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          if (failure && securityPolicyRefused) {
            try {
              const { reportPolicyRefusal } = await import(`file://${process.env.RECORD_ACTION_PATH}/record.mjs`);
              await reportPolicyRefusal({
                endpoint: process.env.RECORD_ENDPOINT,
                recordId: process.env.RECORD_ID,
                audience: process.env.RECORD_AUDIENCE,
                mint: (audience) => core.getIDToken(audience),
                secret: (token) => core.setSecret(token),
              });
            } catch {
              core.info('ksai could not report the security policy refusal');
            }
          }
          if (failure) core.setFailed(failure);

    - id: check
      uses: ./_ksai/.github/actions/codeowners-authz
      if: >-
        ${{ inputs.flow != 'test-publish' &&
        ((steps.context.outputs.is_continuation == 'false' && steps.context.outputs.commenter != '') ||
        steps.context.outputs.work_actor != '') }}
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        username: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        write_access: ${{ inputs.write_access_commands != '' }}

    - name: Resolve authorization
      id: authz
      if: ${{ steps.context.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        FLOW: ${{ inputs.flow }}
        IS_CONTINUATION: ${{ steps.context.outputs.is_continuation }}
        OWNER_CHECK: ${{ steps.check.outputs.authorized }}
        WRITE_CHECK: ${{ steps.check.outputs.write_access }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        WORK_ACTOR: ${{ steps.context.outputs.work_actor }}
        THREADLESS: ${{ steps.context.outputs.threadless }}
        REQUIRE_APPROVAL: ${{ inputs.require_plan_approval }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { resolveAuth } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices } = resolveAuth(process.env);
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Decide whether a comment naming no command steers this run
      id: bare_gate
      if: ${{ inputs.flow == 'implement' && steps.authz.outputs.ok == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BARE_COMMENTS: ${{ inputs.bare_comments }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMENT_BODY: ${{ steps.context.outputs.comment_body }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        ON_REVIEW: ${{ steps.context.outputs.on_review }}
        IS_CONTINUATION: ${{ steps.context.outputs.is_continuation }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveBareGate } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, failure } = await resolveBareGate({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - id: prompt
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      if: ${{ steps.authz.outputs.ok == 'true' }}
      env:
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMENT_BODY: ${{ steps.context.outputs.comment_body }}
        ADDITIONAL_PROMPT: ${{ inputs.additional_prompt }}
        IS_CONTINUATION: ${{ steps.context.outputs.is_continuation }}
        ON_REVIEW: ${{ steps.context.outputs.on_review }}
        ON_OWN_PULL: ${{ steps.bare_gate.outputs.mine }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { preparePrompt } = require(`${process.env.SCRIPTS}/lib/text.cjs`);
          const out = preparePrompt({
            commentBody: process.env.COMMENT_BODY,
            additionalPrompt: process.env.ADDITIONAL_PROMPT,
            trigger: process.env.TRIGGER,
            isContinuation: process.env.IS_CONTINUATION,
            onReview: process.env.ON_REVIEW,
            onOwnPull: process.env.ON_OWN_PULL,
          });
          core.setOutput('has_trigger', out.hasTrigger ? 'true' : 'false');
          core.setOutput('prompt_content_raw', out.request ?? '');

    - name: Acknowledge the trigger
      id: acknowledge_trigger
      if: >-
        ${{ inputs.publish == 'true' && steps.prompt.outputs.has_trigger == 'true' &&
        steps.context.outputs.comment_id != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { react } = require(`${process.env.SCRIPTS}/lib/react.cjs`);
          await react({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            commentId: process.env.COMMENT_ID,
            threadRootId: process.env.THREAD_ROOT_ID,
            content: 'eyes',
          });

    - name: Compute telemetry tag
      id: telemetry
      if: >-
        ${{ inputs.dry_run == 'false' &&
        (steps.prompt.outputs.has_trigger == 'true' || inputs.flow == 'run') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TEAM: ${{ inputs.team }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { telemetryTag } = require(`${process.env.SCRIPTS}/kreview/prepare.cjs`);
          core.setOutput('workflow', telemetryTag(process.env.GITHUB_WORKFLOW));
          core.setOutput('team', telemetryTag(process.env.TEAM));

    - name: Mark the classify phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: classify
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Decide whether to classify the comment
      id: classify_gate
      if: ${{ steps.prompt.outputs.has_trigger == 'true' && inputs.classifier_model_used == '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        FLOW: ${{ inputs.flow }}
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        IS_CONTINUATION: ${{ steps.context.outputs.is_continuation }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        ON_REVIEW: ${{ steps.context.outputs.on_review }}
        REVIEW_STATE: ${{ steps.context.outputs.review_state }}
        ON_OWN_PULL: ${{ steps.bare_gate.outputs.mine }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CLASSIFIER_MODEL: ${{ inputs.classifier_model }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        LEGACY_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        PROMPT_FILE: ${{ runner.temp }}/ksai-classify-prompt.txt
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        script: |
          const { planClassification } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, warnings } = await planClassification({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Compute classify cost-attribution headers
      id: classify_headers
      if: ${{ inputs.dry_run == 'false' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        MODEL: ${{ steps.classify_gate.outputs.model }}
        ACTION: ksai:classify
        EFFORT: low
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/attribution.mjs"

    - name: Classify the comment
      id: classify_run
      if: ${{ inputs.dry_run == 'false' && steps.classify_gate.outputs.classify == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        MODEL: ${{ steps.classify_gate.outputs.model }}
        EFFORT: low
        PROMPT_FILE: ${{ steps.classify_gate.outputs.file }}
        EXECUTION_FILE: ${{ runner.temp }}/ksai-classify-execution.json
        ATTRIBUTION_HEADERS: ${{ steps.classify_headers.outputs.value }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        echo "execution_file=${EXECUTION_FILE}" >> "$GITHUB_OUTPUT"
        node "${SCRIPTS}/ksai/ask-once.mjs"

    - name: Read the verdict
      id: verdict
      if: >-
        ${{ always() && (steps.classify_gate.outputs.classify == 'true' || inputs.classifier_model_used !=
        '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXECUTION_FILE: ${{ steps.classify_run.outputs.execution_file }}
        MODEL: ${{ steps.classify_gate.outputs.model }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        ON_OWN_PULL: ${{ steps.bare_gate.outputs.mine }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CALLER_MODEL: ${{ inputs.classifier_model_used }}
        CALLER_VERDICT: ${{ inputs.verdict }}
        CALLER_COST: ${{ inputs.classifier_cost }}
        CALLER_INPUT: ${{ inputs.classifier_input_tokens }}
        CALLER_OUTPUT: ${{ inputs.classifier_output_tokens }}
        CALLER_TURNS: ${{ inputs.classifier_turns }}
        CALLER_DURATION: ${{ inputs.classifier_duration }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { readVerdict } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, warnings } = readVerdict({ env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Select command, model and effort
      id: select
      if: ${{ inputs.flow == 'implement' && steps.prompt.outputs.has_trigger == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        CODEOWNER: ${{ steps.check.outputs.authorized }}
        WRITE_ACCESS: ${{ steps.check.outputs.write_access }}
        LEGACY_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        IS_CONTINUATION: ${{ steps.context.outputs.is_continuation }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        ON_REVIEW: ${{ steps.context.outputs.on_review }}
        REVIEW_STATE: ${{ steps.context.outputs.review_state }}
        ON_OWN_PULL: ${{ steps.bare_gate.outputs.mine }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CLASSIFIED_COMMAND: ${{ steps.verdict.outputs.verdict }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        REQUEST_LABEL: ${{ steps.context.outputs.label }}
        REQUEST_REVIEW: ${{ steps.context.outputs.label_review }}
        PLAN_MODE: ${{ inputs.plan_mode }}
        FILE_PLAN_MODE: ${{ steps.bare_gate.outputs.plan_mode }}
        MODEL_PINNED: ${{ inputs.model_pinned }}
        EFFORT_PINNED: ${{ inputs.effort_pinned }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        script: |
          const { selectImplementArm } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, failure } = await selectImplementArm({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Mark the triage phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: triage
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Resolve the review command
      id: review_command
      if: ${{ inputs.flow == 'review' && steps.prompt.outputs.has_trigger == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SHADOW_MODEL: ${{ inputs.shadow_model }}
        PUBLISH: ${{ inputs.publish }}
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        CODEOWNER: ${{ steps.check.outputs.authorized }}
        WRITE_ACCESS: ${{ steps.check.outputs.write_access }}
        LEGACY_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CLASSIFIED_COMMAND: ${{ steps.verdict.outputs.verdict }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || github.token }}
        script: |
          const { reviewCommandStatus } = require(`${process.env.SCRIPTS}/kreview/prepare.cjs`);
          const out = await reviewCommandStatus({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          core.setOutput('error', out.error);
          core.setOutput('skipped', out.skipped);

    - name: Triage the pull request
      id: triage
      continue-on-error: true
      if: >-
        ${{ inputs.flow == 'review' && steps.prompt.outputs.has_trigger == 'true' && inputs.triage == 'auto' &&
        steps.review_command.outcome == 'success' && steps.review_command.outputs.error == '' &&
        steps.review_command.outputs.skipped != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        REVIEW_TRIAGE_MODE: ${{ inputs.review_triage_mode }}
        FLEET_DIALS_ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        RECORD_ID: ${{ inputs.record_id }}
        RUN_HEAD_SHA: ${{ github.sha }}
        TRIAGE_MODE: ${{ inputs.triage }}
        CONFIGURED_MODEL: ${{ inputs.model }}
        CONFIGURED_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        MAX_EFFORT: ${{ inputs.max_effort }}
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { runTriage } = require(`${process.env.SCRIPTS}/kreview/prepare.cjs`);
          const out = await runTriage({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            prNumber: process.env.PR_NUMBER,
          });
          for (const [name, value] of Object.entries(out)) core.setOutput(name, value);

    - name: Select model and effort
      id: select_arm
      if: ${{ inputs.flow == 'review' && steps.prompt.outputs.has_trigger == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SHADOW_MODEL: ${{ inputs.shadow_model }}
        PUBLISH: ${{ inputs.publish }}
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        CODEOWNER: ${{ steps.check.outputs.authorized }}
        WRITE_ACCESS: ${{ steps.check.outputs.write_access }}
        LEGACY_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        TRIAGE_TIER: ${{ steps.triage.outputs.tier }}
        TRIAGE_MODEL: ${{ steps.triage.outputs.model }}
        TRIAGE_EFFORT: ${{ steps.triage.outputs.effort }}
        MODEL_PINNED: ${{ inputs.model_pinned }}
        EFFORT_PINNED: ${{ inputs.effort_pinned }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CLASSIFIED_COMMAND: ${{ steps.verdict.outputs.verdict }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
      with:
        github-token: ${{ inputs.authorization_github_token || github.token }}
        script: |
          const { selectReviewArm } = require(`${process.env.SCRIPTS}/kreview/prepare.cjs`);
          const out = await selectReviewArm({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          const { rejected, note, ...outputs } = out;
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value ?? '');
          if (rejected) return core.setFailed(rejected);
          core.info(note);

    - name: Select the tester's verb
      id: select_test
      if: ${{ inputs.flow == 'test' && steps.prompt.outputs.has_trigger == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        CODEOWNER: ${{ steps.check.outputs.authorized }}
        WRITE_ACCESS: ${{ steps.check.outputs.write_access }}
        LEGACY_ALLOWED_COMMANDS: ${{ inputs.allowed_commands }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        CLASSIFIED_COMMAND: ${{ steps.verdict.outputs.verdict }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        TEST_MODE: ${{ inputs.test_mode }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        script: |
          const { selectTesterArm } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, failure } = await selectTesterArm({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Comment when the tester's request needs no run
      if: >-
        ${{ always() && !cancelled() && inputs.flow == 'test' && inputs.publish == 'true' &&
        steps.select_test.outputs.notice != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        NOTICE: ${{ steps.select_test.outputs.notice }}
        NOTICE_KIND: ${{ steps.select_test.outputs.notice_kind }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.context.outputs.jira_key }}
        COMMAND: test
        TRIGGER: ${{ inputs.trigger_phrase }}
        ROUTE_SOURCE: ${{ steps.select_test.outputs.route_source }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishTesterNotice } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices = [], warnings = [] } = await publishTesterNotice({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Refuse a fork head
      if: ${{ inputs.flow == 'test' && steps.select_test.outputs.mine == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
      run: |
        set -euo pipefail
        head_repo="$(gh pr view "${THREAD_NUM}" --repo "${REPO}" --json headRepositoryOwner,headRepository \
          -q '.headRepositoryOwner.login + "/" + .headRepository.name')"
        if [ "${head_repo}" != "${REPO}" ]; then
          echo "::error::this pull request's head is on ${head_repo}. A fork head is refused: the tree is executed, and the runner is not a boundary"
          exit 1
        fi

    - name: Resolve the tester's base branch
      id: test_base
      if: ${{ steps.select_test.outputs.mine == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
      run: |
        set -euo pipefail
        IFS=$'\t' read -r base_ref base_sha < <(
          gh pr view "${THREAD_NUM}" --repo "${REPO}" --json baseRefName,baseRefOid \
            --jq '[.baseRefName, .baseRefOid] | @tsv'
        )
        if [[ -z "${base_ref}" || ! "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo "::error::GitHub returned no usable pull request base ref and commit"
          exit 1
        fi
        echo "ref=${base_ref}" >> "$GITHUB_OUTPUT"
        echo "sha=${base_sha}" >> "$GITHUB_OUTPUT"

    - name: Install mise without evaluating the pull request
      if: ${{ steps.test_base.outcome == 'success' }}
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: false

    - name: Comment what the tester understood
      if: >-
        ${{ inputs.flow == 'test' && inputs.publish == 'true' && inputs.dry_run == 'false' &&
        steps.select_test.outputs.test_mode == 'test' && steps.test_base.outcome == 'success' &&
        steps.select_test.outputs.receipt != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        NOTICE: ${{ steps.select_test.outputs.receipt }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.context.outputs.jira_key }}
        NOTICE_KIND: receipt
        COMMAND: test
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishTesterNotice } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices = [], warnings = [] } = await publishTesterNotice({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout the pull request the tester runs
      id: checkout_test
      if: ${{ steps.test_base.outcome == 'success' }}
      with:
        ref: refs/pull/${{ steps.context.outputs.issue_number }}/head
        fetch-depth: 0
        token: ${{ inputs.source_org_github_token }}
        repository: ${{ github.repository }}
        persist-credentials: false

    - name: Restore the base-branch test contract
      id: test_contract
      if: ${{ steps.checkout_test.outcome == 'success' }}
      shell: bash
      env:
        BASE_SHA: ${{ steps.test_base.outputs.sha }}
        DEST: ${{ runner.temp }}/ksai-scripts/ksai/pr-test/.ksai-trusted
      run: |
        set -euo pipefail
        rm -rf -- "${DEST}"
        mkdir -p -- "${DEST}"
        git show "${BASE_SHA}:.ksai/pr-test.json" > "${DEST}/pr-test.json" || {
          echo "::error::this repository declares no .ksai/pr-test.json at the resolved base commit"
          exit 1
        }
        find . -path ./.git -prune -o \
          \( -name AGENTS.md -o -name CLAUDE.md -o -name CONTRIBUTING.md \
             -o -name .mcp.json -o -name .claude -o -name .opencode -o -name .agents \
             -o -name bunfig.toml \) \
          -print0 | xargs -0 -r rm -rf --
        rm -rf -- .ksai .npmrc .yarnrc .yarnrc.yml opencode.json opencode.jsonc
        find . -maxdepth 1 -name '.env*' ! -name '.env.example' -exec rm -rf -- {} +
        mkdir -p -- .ksai
        cp -- "${DEST}/pr-test.json" .ksai/pr-test.json
        printf 'encoded=%s\n' "$(base64 < "${DEST}/pr-test.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"

    - name: Take the Go modules the base branch declares
      id: test_gomod
      if: ${{ steps.test_contract.outcome == 'success' }}
      # The whole Go cluster fails open. A tree this cannot read a go.mod out of still has the
      # runner's own tools and a provisioning verdict to report with; failing here would skip
      # `Resolve tester run paths` and end the run red with nothing said.
      continue-on-error: true
      shell: bash
      env:
        BASE_SHA: ${{ steps.test_base.outputs.sha }}
        DEST: ${{ runner.temp }}/ksai-test-gomod
      run: |
        set -euo pipefail
        rm -rf -- "${DEST}"
        if ! git cat-file -e "${BASE_SHA}:go.mod" 2>/dev/null; then
          echo "the base branch declares no go.mod, so there is no module cache to warm"
          exit 0
        fi
        mkdir -p -- "${DEST}"
        git show "${BASE_SHA}:go.mod" > "${DEST}/go.mod"
        git show "${BASE_SHA}:go.sum" > "${DEST}/go.sum" 2>/dev/null || true
        printf '.\n' > "${DEST}/dirs"
        echo "dir=${DEST}" >> "$GITHUB_OUTPUT"
        echo "mod=${DEST}/go.mod" >> "$GITHUB_OUTPUT"
        echo "dirs=${DEST}/dirs" >> "$GITHUB_OUTPUT"
        echo "warming from the go.mod the base branch carries at ${BASE_SHA}"

    - name: Set up the Go the base branch pins
      id: test_go_setup
      if: ${{ steps.test_gomod.outputs.mod != '' }}
      continue-on-error: true
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.test_gomod.outputs.mod }}
        cache: false

    - name: Warm the Go module cache before the tree can read a credential
      if: ${{ steps.test_go_setup.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      # The module set comes from the base branch, not the pull request: a tree that names another
      # owner's private module would otherwise have this token fetch it into a cache the tree then
      # reads. A pull request that adds a dependency gets a cache miss instead, which is the right
      # answer for a tree nobody has reviewed. The credential reaches only `go mod download`, through
      # GIT_CONFIG_* on that child, and no step after this one is given it.
      env:
        WORKSPACE: ${{ steps.test_gomod.outputs.dir }}
        LIST: ${{ steps.test_gomod.outputs.dirs }}
        GO_MODULE_TOKENS: ${{ inputs.go_module_tokens }}
        IS_PRIVATE: ${{ steps.context.outputs.is_private }}
        LOCK_BUILD: 'false'
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/gomod-warm.mjs"

    - name: Look for the tools the tested tree pins
      id: mise_config
      if: ${{ steps.test_contract.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        present=false
        for candidate in mise.toml .mise.toml mise/config.toml .mise/config.toml \
          .config/mise.toml .config/mise/config.toml .tool-versions; do
          if [[ -f "${candidate}" ]]; then
            present=true
            echo "the tested tree pins tools in ${candidate}"
            break
          fi
        done
        if [[ "${present}" == "false" ]]; then
          echo "the tested tree pins no tools, so the contract's targets get whatever the runner carries"
        fi
        echo "present=${present}" >> "$GITHUB_OUTPUT"

    - name: Install the tools the tested tree pins
      if: ${{ steps.mise_config.outputs.present == 'true' }}
      # A pin mise cannot resolve is not worth the run: the targets still have the runner's own
      # tools, and failing here would skip `Resolve tester run paths` and with it the provisioning
      # verdict, ending the run red with nothing said.
      continue-on-error: true
      shell: bash
      # `mise install` reads a config the pull request wrote and can run that config's hooks, so it
      # gets the environment every other execution of this tree gets - no credential to spend, and
      # no runner file to write itself into a later step through. It is deliberately not
      # `mise-action`: that adds shims to PATH for the rest of the job, where a tree pinning `node`
      # would stand in for the interpreter of every github-script step below, and it caches the
      # result under a key this tree controls for later runs to restore.
      env:
        ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        ACTIONS_ID_TOKEN_REQUEST_URL: ''
        ACTIONS_RESULTS_URL: ''
        ACTIONS_RUNTIME_TOKEN: ''
        ANTHROPIC_API_KEY: ''
        ANTHROPIC_AUTH_TOKEN: ''
        GH_TOKEN: ''
        GITHUB_ENV: ''
        GITHUB_WORKSPACE: ''
        GITHUB_OUTPUT: ''
        GITHUB_PATH: ''
        GITHUB_STATE: ''
        GITHUB_STEP_SUMMARY: ''
        GITHUB_TOKEN: ''
        KSAI_OIDC_REQUEST_TOKEN: ''
        KSAI_OIDC_REQUEST_URL: ''
        OTEL_EXPORTER_OTLP_HEADERS: ''
        RUNNER_TEMP: ''
        RUN: ''
        SCRIPTS: ''
      run: |
        set -euo pipefail
        mise install

    - name: Resolve tester run paths
      if: ${{ steps.test_contract.outcome == 'success' }}
      id: test_paths
      shell: bash
      env:
        RUN_DIR: ${{ inputs.run_dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/run-dir.mjs"

    - name: Prepare the manifest-backed test stage
      if: >-
        ${{ steps.test_paths.outcome == 'success' &&
        steps.select_test.outputs.test_mode == 'test' }}
      id: workflow_stage
      shell: bash
      env:
        WORKFLOW_REGISTRY: ${{ runner.temp }}/ksai-workflows
        WORKFLOW_RUNTIME: ${{ runner.temp }}/ksai-workflow-stage
        WORKFLOW_JOB: ${{ format('{0}_{1}_{2}', github.run_id, github.job, strategy.job-index || 0) }}
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        WORKFLOW_REPOSITORY: ${{ github.repository }}
        WORKFLOW_ATTEMPT: ${{ github.run_attempt }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        WORKFLOW_HEAD="$(git rev-parse HEAD)"
        export WORKFLOW_HEAD
        node "${SCRIPTS}/ksai/workflow/prepare.mjs"

    - name: Resolve acceptance criteria
      if: ${{ steps.test_paths.outcome == 'success' }}
      shell: bash
      env:
        TEST_HYPOTHESES: ${{ inputs.test_hypotheses }}
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        REPO: ${{ github.repository }}
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        BASE_REF: ${{ steps.test_base.outputs.ref }}
        BASE_SHA: ${{ steps.test_base.outputs.sha }}
      run: |
        set -euo pipefail
        head_sha="$(git rev-parse HEAD)"
        node "${SCRIPTS}/ksai/pr-test/cli.mjs" criteria --pr "${THREAD_NUM}" --repo "${REPO}" \
          --head-sha "${head_sha}" --base-ref "${BASE_REF}" --base-sha "${BASE_SHA}" --run-dir "${RUN}"

    - name: Stage the acceptance criteria before executing the pull request
      id: test_criteria_artifact
      if: ${{ steps.test_paths.outcome == 'success' }}
      shell: bash
      env:
        RUN: ${{ steps.test_paths.outputs.dir }}
        DEST: ${{ runner.temp }}/pr-test-criteria
        FILE: criteria.json
        PRODUCER: the trusted criteria collector
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/stage-artifact.mjs"

    - name: Upload the acceptance criteria before executing the pull request
      if: ${{ steps.test_criteria_artifact.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-criteria-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.test_criteria_artifact.outputs.dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error
        overwrite: true

    - name: Sweep every declared environment
      id: sweep_test_environments
      if: ${{ steps.test_paths.outcome == 'success' && steps.select_test.outputs.test_mode == 'sweep' }}
      shell: bash
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        ENVS: ${{ inputs.environments }}
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/cli.mjs" sweep --pr "${THREAD_NUM}" \
          ${ENVS:+--env "${ENVS}"} --run-dir "${RUN}"

    - name: Bring the environments up
      id: start_test_environments
      if: >-
        ${{ steps.test_paths.outcome == 'success' &&
        (steps.select_test.outputs.test_mode == 'test' || steps.select_test.outputs.test_mode == 'dry-run') }}
      shell: bash
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        ENVS: ${{ inputs.environments }}
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/cli.mjs" up --pr "${THREAD_NUM}" \
          ${ENVS:+--env "${ENVS}"} --run-dir "${RUN}"

    - name: Preserve the setup tree for trusted teardown
      id: test_teardown_tree
      if: >-
        ${{ always() && steps.test_paths.outcome == 'success' &&
        (steps.start_test_environments.outcome != 'skipped' ||
        steps.sweep_test_environments.outcome != 'skipped') }}
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/pr-test-teardown-source.tar
      run: |
        set -euo pipefail
        rm -f -- "${ARCHIVE}"
        tar_status=0
        tar --exclude='./.git' --exclude='.git' -cf "${ARCHIVE}" . || tar_status=$?
        if [ "${tar_status}" -gt 1 ] || [ ! -s "${ARCHIVE}" ] || ! tar -tf "${ARCHIVE}" > /dev/null; then
          echo "::error::could not preserve a readable setup tree for teardown"
          exit 1
        fi
        printf 'archive=%s\n' "${ARCHIVE}" >> "$GITHUB_OUTPUT"
        printf 'sha256=%s\n' "$(sha256sum "${ARCHIVE}" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - name: Write a dry-run verdict
      if: >-
        ${{ always() && steps.test_paths.outcome == 'success' &&
        steps.select_test.outputs.test_mode == 'dry-run' }}
      shell: bash
      env:
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/pr-test/cli.mjs" dry-verdict --run-dir "${RUN}"

    - name: Write a provisioning failure verdict
      if: >-
        ${{ always() && steps.test_paths.outcome == 'success' &&
        steps.select_test.outputs.test_mode == 'test' &&
        steps.start_test_environments.outcome == 'failure' }}
      shell: bash
      env:
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/pr-test/cli.mjs" infra-verdict --run-dir "${RUN}"

    - name: Stage the environment record before running the tester
      id: test_environment_artifact
      if: >-
        ${{ always() && steps.test_paths.outcome == 'success' &&
        (steps.start_test_environments.outcome != 'skipped' ||
        steps.sweep_test_environments.outcome != 'skipped') }}
      shell: bash
      env:
        RUN: ${{ steps.test_paths.outputs.dir }}
        DEST: ${{ runner.temp }}/pr-test-environments
        FILE: environments.json
        PRODUCER: the trusted provisioner
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/stage-artifact.mjs"

    - name: Upload the environment record before running the tester
      if: ${{ always() && steps.test_environment_artifact.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-environments-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.test_environment_artifact.outputs.dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error
        overwrite: true


    - name: Assemble the tester prompt
      if: >-
        ${{ steps.workflow_stage.outcome == 'success' &&
        steps.start_test_environments.outcome == 'success' }}
      id: build_test
      shell: bash
      env:
        BASE: ${{ steps.test_base.outputs.ref }}
        RUN_DIR: ${{ steps.test_paths.outputs.dir }}
        ENTRYPOINT: ${{ steps.workflow_stage.outputs.entrypoint }}
        STAGE_RESULT: ${{ steps.workflow_stage.outputs.result }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        prompt="${RUNNER_TEMP}/pr-test-prompt.md"
        cat "${ENTRYPOINT}" > "${prompt}"
        {
          echo
          echo "## This run"
          echo
          echo "- Run directory: \`${RUN_DIR}\`."
          echo "- Write the stage candidate to \`${STAGE_RESULT}\`."
          echo "- Read \`${RUN_DIR}/ENVIRONMENT.md\` and \`${RUN_DIR}/CRITERIA.md\` before anything else."
          echo "- The base branch is \`${BASE}\`. See the change with: git diff origin/${BASE}...HEAD"
          echo
          echo "Changed files:"
          git diff --name-status "origin/${BASE}...HEAD" 2>/dev/null || true
        } >> "${prompt}"
        echo "file=${prompt}" >> "$GITHUB_OUTPUT"

    - name: Resolve the tester's tool policy
      if: ${{ steps.build_test.outcome == 'success' }}
      id: test_tools
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PROFILE: ${{ steps.workflow_stage.outputs.profile }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { toolPolicy } = require(`${process.env.SCRIPTS}/lib/claude-args.cjs`);
          if (process.env.PROFILE !== 'product-test') return core.setFailed('the test adapter requires the product-test profile');
          const policy = toolPolicy('test');
          core.setOutput('allowed_tools', policy.allowed);
          core.setOutput('disallowed_tools', policy.disallowed);

    - name: Resolve the issue this run is about
      id: subject
      if: >-
        ${{ inputs.flow == 'implement' && steps.select.outputs.mine == 'true' &&
        steps.context.outputs.threadless != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        THREAD: ${{ steps.context.outputs.issue_number }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveRunSubject } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices } = await resolveRunSubject({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Fetch the conversation this run works from
      id: issue
      if: ${{ inputs.flow == 'implement' && steps.subject.outputs.number != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        HEAD_FILE: ${{ runner.temp }}/ksai-issue-head.json
        COMMAND: ${{ steps.select.outputs.command }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { fetchIssue } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices, failure } = await fetchIssue({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Decide the phase
      id: phase
      if: >-
        ${{ inputs.flow == 'implement' && steps.select.outputs.mine == 'true' &&
        ((steps.issue.outcome == 'success' && steps.issue.outputs.state == 'OPEN') ||
        steps.context.outputs.threadless == 'true') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch || steps.context.outputs.default_branch }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        COMMAND: ${{ steps.select.outputs.command }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        GUIDANCE: ${{ steps.select.outputs.guidance_html || inputs.work_guidance }}
        ROUTE_SOURCE: ${{ steps.select.outputs.route_source }}
        THREADS_FILE: ${{ runner.temp }}/ksai-threads.json
        THREAD_STATE_FILE: ${{ runner.temp }}/ksai-thread-state.json
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        REVIEW_ID: ${{ steps.context.outputs.review_id }}
        WRITE_ACCESS_COMMANDS: ${{ steps.select.outputs.write_access_commands }}
        RECORD_SCOPE: ${{ steps.dispatch_record.outputs.scope }}
        SAW_TRIGGER: ${{ steps.dispatch_record.outputs.trigger }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        AUTHZ_WHY: ${{ steps.authz.outputs.why }}
        CHECKS_FILE: ${{ runner.temp }}/ksai-checks.json
        RETRY_FILE: ${{ runner.temp }}/ksai-retry.json
        EVIDENCE_TOKEN: ${{ inputs.ci_evidence_github_token }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { decidePhase } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const authorize = require(`${process.env.SCRIPTS}/codeowners-authz/authorize.cjs`);
          const { outputs, notices } = await decidePhase({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
            authorize,
            writeAccess: authorize.writeAccess,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Validate extra claude args
      id: validate_args
      if: >-
        ${{ (inputs.flow == 'implement' && steps.select.outputs.mine == 'true') ||
        (inputs.flow == 'review' && steps.select_arm.outcome == 'success' &&
        steps.select_arm.outputs.skipped == 'false') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXTRA_ARGS: ${{ inputs.extra_claude_args }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { validateExtraArgs } = require(`${process.env.SCRIPTS}/lib/claude-args.cjs`);
          const refusal = validateExtraArgs(process.env.EXTRA_ARGS);
          if (refusal) core.setFailed(refusal);

    - name: Read the plan and pick the next step
      id: read_plan
      if: ${{ steps.validate_args.outcome == 'success' && steps.phase.outputs.phase == 'step' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { readPlan } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices = [] } = await readPlan({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Resolve which ticket this run is about
      id: jira_ref
      if: ${{ inputs.flow == 'implement' }}
      shell: bash
      env:
        PLAN_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        STEP_KEY: ${{ steps.read_plan.outputs.jira_key }}
      run: |
        set -euo pipefail
        echo "plan_key=${PLAN_KEY}" >> "$GITHUB_OUTPUT"
        echo "step_key=${STEP_KEY}" >> "$GITHUB_OUTPUT"

    - name: Resolve the phase checkpoint
      id: checkpoint
      if: ${{ steps.read_plan.outputs.at_checkpoint == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        AT_CHECKPOINT: ${{ steps.read_plan.outputs.at_checkpoint }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        COMMAND: ${{ steps.select.outputs.command }}
        AUTHORIZED: ${{ steps.check.outputs.authorized }}
        WRITE_ACCESS: ${{ steps.check.outputs.write_access }}
        WRITE_ACCESS_COMMANDS: ${{ steps.select.outputs.write_access_commands }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        COMMENT_EDITED: ${{ steps.context.outputs.comment_edited }}
        COMMENT_CREATED_AT: ${{ steps.context.outputs.comment_created_at }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        DISPATCHED: ${{ steps.context.outputs.dispatched }}
        REVIEW_ID: ${{ steps.context.outputs.review_id }}
        REVIEW_SUBMITTED_AT: ${{ steps.context.outputs.review_submitted_at }}
        CONTROL_PLANE_APPROVER: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.approver || '' }}
        CONTROL_PLANE_APPROVAL_ID: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.approval_id || '' }}
        CONTROL_PLANE_HEAD_SHA: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.head_sha || '' }}
        CONTROL_PLANE_PR: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.pr || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveCheckpoint } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const authorize = require(`${process.env.SCRIPTS}/codeowners-authz/authorize.cjs`);
          const { outputs, notices } = await resolveCheckpoint({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
            authorize,
            writeAccess: authorize.writeAccess,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Release the phase checkpoint
      id: release_checkpoint
      if: ${{ steps.checkpoint.outputs.release == 'true' && inputs.dry_run == 'false' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        STEP_TITLE: ${{ steps.read_plan.outputs.step_title }}
        APPROVED_BY: >-
          ${{ steps.context.outputs.commenter ||
          (steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.approver) || '' }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        COMMENT_ID: ${{ steps.checkpoint.outputs.release_token }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { releaseCheckpoint } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices, failure } = await releaseCheckpoint({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Comment when a phase is waiting for review
      id: notice_checkpoint
      if: ${{ steps.checkpoint.outputs.waiting == 'true' && inputs.dry_run == 'false' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        REMAINING: ${{ steps.read_plan.outputs.remaining }}
        REASON: ${{ steps.checkpoint.outputs.reason }}
        DETAIL: ${{ steps.checkpoint.outputs.detail }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        WRITE_ACCESS_COMMANDS: ${{ steps.select.outputs.write_access_commands }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishWaiting } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices } = await publishWaiting({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);

    - name: Resolve the approval gate
      id: approval
      if: >-
        ${{ steps.validate_args.outcome == 'success' &&
        (steps.phase.outputs.phase == 'plan' || steps.phase.outputs.phase == 'plan-review' ||
        steps.phase.outputs.phase == 'step') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REQUIRE_APPROVAL: ${{ inputs.require_plan_approval }}
        PHASE: ${{ steps.phase.outputs.phase }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        PLAN_FILE: ${{ steps.phase.outputs.plan_file }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        CHECKED_OWNER: ${{ steps.check.outputs.authorized == 'true' && steps.context.outputs.commenter || '' }}
        REVIEWER: ${{ steps.context.outputs.commenter }}
        REVIEW_ID: ${{ steps.context.outputs.review_id }}
        REVIEW_STATE: ${{ steps.context.outputs.review_state }}
        REVIEW_SUBMITTED_AT: ${{ steps.context.outputs.review_submitted_at }}
        REVIEW_COMMIT_ID: ${{ steps.context.outputs.review_commit_id }}
        REVIEW_URL: ${{ steps.context.outputs.review_url }}
        REVIEW_ASSOCIATION: ${{ steps.context.outputs.review_association }}
        REVIEWER_TYPE: ${{ steps.context.outputs.review_actor_type }}
        DISABLED_COMMANDS: ${{ inputs.disabled_commands }}
        WRITE_ACCESS_COMMANDS: ${{ inputs.write_access_commands }}
        RELEASED_REF: ${{ steps.read_plan.outputs.release_ref }}
        CONTROL_PLANE_APPROVER: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.approver || '' }}
        CONTROL_PLANE_APPROVAL_ID: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.approval_id || '' }}
        CONTROL_PLANE_HEAD_SHA: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.head_sha || '' }}
        CONTROL_PLANE_PR: ${{ steps.context.outputs.threadless == 'true' && steps.dispatch_record.outputs.pr || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveApprovalGate } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const authorize = require(`${process.env.SCRIPTS}/codeowners-authz/authorize.cjs`);
          const { outputs, notices } = await resolveApprovalGate({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
            authorize,
            writeAccess: authorize.writeAccess,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Record the approval before the pull request head moves
      id: acknowledge_native
      if: >-
        ${{ inputs.publish == 'true' && steps.approval.outputs.needs_ack == 'true' &&
        steps.approval.outputs.approval_ref != '' && steps.approval.outputs.approval_thread != '' &&
        inputs.dry_run == 'false' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        APPROVAL_REF: ${{ steps.approval.outputs.approval_ref }}
        APPROVER: ${{ steps.approval.outputs.approval_login }}
        THREAD: ${{ steps.approval.outputs.approval_thread }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        KSAI_ASK: ${{ inputs.ask }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { renderApprovalReceipt } = require(`${process.env.SCRIPTS}/ksai/approval.cjs`);
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: Number(process.env.THREAD),
            body: renderApprovalReceipt({
              triggerPhrase: process.env.TRIGGER,
              issueNumber: process.env.ISSUE_NUM,
              prNumber: process.env.PR_NUMBER,
              runId: process.env.RUN_ID,
              approvalRef: process.env.APPROVAL_REF,
              approver: process.env.APPROVER,
              ask: process.env.KSAI_ASK,
            }),
          });

    - name: Record the release in the plan
      id: record_release
      if: >-
        ${{ steps.approval.outputs.release_ref != '' && inputs.dry_run == 'false' &&
        steps.phase.outputs.phase != 'plan-review' &&
        steps.phase.outputs.pr_number != '' && (steps.approval.outputs.approval_ref == '' ||
        steps.approval.outputs.needs_ack != 'true' || steps.acknowledge_native.outcome == 'success') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        RELEASE_REF: ${{ steps.approval.outputs.released_by }}
        APPROVAL_URL: ${{ steps.approval.outputs.approval_url }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/release-step.mjs"

    - name: Answer and resolve the plan threads an approval overrode
      id: resolve_threads
      if: >-
        ${{ steps.approval.outputs.overrode == 'true' && inputs.dry_run == 'false' &&
        steps.phase.outputs.pr_number != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        PLAN_FILE: ${{ steps.phase.outputs.plan_file }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveOverriddenThreads } = require(`${process.env.SCRIPTS}/ksai/resolve-threads.cjs`);
          const { notices } = await resolveOverriddenThreads({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            prNumber: process.env.PR_NUMBER,
            planFile: process.env.PLAN_FILE,
            botLogin: process.env.BOT_LOGIN,
            triggerPhrase: process.env.TRIGGER,
            command: process.env.COMMAND,
            ask: process.env.KSAI_ASK,
          });
          for (const line of notices) core.warning(line);

    - name: Decide whether this run has work to do
      id: works
      if: ${{ inputs.flow == 'implement' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PHASE: ${{ steps.phase.outputs.phase }}
        HAS_STEP: ${{ steps.read_plan.outputs.has_step }}
        BLOCKED: ${{ steps.approval.outputs.blocked }}
        AT_CHECKPOINT: ${{ steps.read_plan.outputs.at_checkpoint }}
        ON_BRANCH: ${{ steps.phase.outputs.on_branch }}
        PENDING: ${{ steps.phase.outputs.pending }}
        COMMAND: ${{ steps.select.outputs.command }}
        RELEASED_REMAINING: ${{ steps.release_checkpoint.outputs.remaining }}
        RELEASE_REF: ${{ steps.approval.outputs.release_ref }}
        GATE_WAITING: ${{ steps.read_plan.outputs.gate_waiting }}
        RELEASED_HOLD: ${{ steps.read_plan.outputs.released_hold }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { resolveWork } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices } = resolveWork({ env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Mark the checkout phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: checkout
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout the branch an implement run works on
      id: checkout_source
      if: >-
        ${{ steps.works.outputs.works == 'true' ||
        (inputs.keep_plan_file == 'false' && steps.read_plan.outcome == 'success') }}
      with:
        ref: ${{ steps.phase.outputs.ref }}
        fetch-depth: ${{ steps.phase.outputs.on_branch == 'true' && '0' || inputs.fetch_depth }}
        token: ${{ inputs.source_org_github_token }}
        repository: ${{ github.repository }}
        persist-credentials: false

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout the pull request a review reads
      id: checkout_pr
      if: >-
        ${{ inputs.flow == 'review' && steps.validate_args.outcome == 'success' &&
        steps.triage.outputs.skip != 'true' }}
      with:
        ref: refs/pull/${{ steps.context.outputs.issue_number }}/head
        fetch-depth: 1
        token: ${{ inputs.source_org_github_token }}
        repository: ${{ github.repository }}
        persist-credentials: false
        clean: false

    - name: Remove PR-controlled paths
      if: ${{ steps.checkout_pr.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf -- .mcp.json .claude _ksai bunfig.toml .env .npmrc .yarnrc .yarnrc.yml
        rm -rf -- opencode.json opencode.jsonc .opencode .agents
        rm -rf -- CONTRIBUTING.md AGENTS.md CLAUDE.md .ksai
        find . -maxdepth 1 -name '.env.*' -exec rm -rf -- {} +

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout ksai repo
      id: checkout_ksai
      if: >-
        ${{ steps.validate_args.outcome == 'success' &&
        (steps.checkout_source.outcome == 'success' || steps.checkout_pr.outcome == 'success') }}
      with:
        token: ${{ inputs.kong_org_github_token }}
        path: _ksai
        repository: Kong/ksai-public
        ref: ${{ steps.plugin_ref.outputs.ref }}
        sparse-checkout: |
          plugins/kreview
          plugins/ksai-implement
        persist-credentials: false

    - name: Resolve the identities a commit carries
      id: identity
      if: ${{ inputs.flow == 'implement' && steps.checkout_ksai.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BOT_LOGIN: ${{ inputs.bot_login }}
        REQUESTER: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        RECORDED_REQUESTER: ${{ steps.read_plan.outputs.requested_by }}
        RELEASE_REF: ${{ steps.approval.outputs.released_by }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveIdentities } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, warnings } = await resolveIdentities({ github, core, env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of warnings) core.warning(line);

    - name: Configure commit identity
      id: configure_git
      if: ${{ steps.identity.outcome == 'success' }}
      shell: bash
      env:
        AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
      run: |
        set -euo pipefail
        filemode="$(git config --bool core.filemode)"
        case "${filemode}" in
          true|false) ;;
          *) echo "::error::the checkout did not report a usable core.filemode"; exit 1 ;;
        esac
        echo "filemode=${filemode}" >> "$GITHUB_OUTPUT"
        git config user.name "$AUTHOR_NAME"
        git config user.email "$AUTHOR_EMAIL"
        echo '.ksai-manifest.json' >> .git/info/exclude
        echo '.mcp.json' >> .git/info/exclude
        echo '_ksai/' >> .git/info/exclude

    - name: Mark the diff phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: diff
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Fetch the base ref a pull-surface run diffs against
      id: fetch_base
      if: ${{ steps.checkout_source.outcome == 'success' && steps.phase.outputs.base_ref != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        BASE_REF: ${{ steps.phase.outputs.base_ref }}
      run: |
        set -euo pipefail
        if git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
          echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
        elif git fetch --no-tags \
          "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1; then
          echo "::notice::the base ref was not in the clone, so it was fetched"
          echo "ref=origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::could not reach the base ref, so the prompt will not name a diff base"
        fi

    - name: Merge the base branch a conflicting pull request cannot take
      id: merge_base
      if: >-
        ${{ inputs.flow == 'implement' && steps.checkout_source.outcome == 'success' &&
        steps.phase.outputs.phase == 'do' && steps.phase.outputs.conflicting == 'true' &&
        steps.works.outputs.works == 'true' }}
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        BASE_REF: ${{ steps.fetch_base.outputs.ref }}
        BASE_BRANCH: ${{ steps.phase.outputs.base_ref }}
        REMOTE_SHA: ${{ steps.checkout_source.outputs.commit }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/merge-base-ref.mjs"

    - name: Fetch PR base
      id: base
      if: >-
        ${{ inputs.flow == 'review' && (steps.validate_args.outcome == 'success' ||
        steps.select_arm.outputs.stand_down_notice != '') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        ISSUE_NUM: ${{ steps.context.outputs.issue_number }}
        SOURCE_REPO: ${{ github.repository }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/review-base.mjs"

    - name: Detect major dependency bumps
      id: major_bump
      if: >-
        ${{ inputs.flow == 'implement' && steps.validate_args.outcome == 'success' &&
        steps.checkout_source.outcome == 'success' && steps.works.outputs.works == 'true' &&
        steps.phase.outputs.base_ref != '' }}
      env:
        WORKSPACE: ${{ github.workspace }}
        BASE_REF: ${{ steps.fetch_base.outputs.ref }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const { inspectMajorBumps } = require(`${process.env.SCRIPTS}/ksai/write-triage.cjs`);
          const { outputs, warnings } = inspectMajorBumps(process.env);
          core.setOutput('major', outputs.major);
          core.setOutput('summary', outputs.summary);
          core.setOutput('omitted', outputs.omitted);
          core.setOutput('unreadable', outputs.unreadable);
          core.setOutput('ambiguous', outputs.ambiguous);
          for (const line of warnings) core.warning(line);

    - name: Materialise base-ref conventions
      id: conventions
      if: >-
        ${{ inputs.flow == 'review' && steps.validate_args.outcome == 'success' &&
        steps.triage.outputs.skip != 'true' }}
      shell: bash
      env:
        BASE_REF: ${{ steps.base.outputs.ref }}
        DEST: ${{ github.workspace }}/_ksai/base-conventions
      run: |
        set -euo pipefail
        rm -rf -- "$DEST"
        mkdir -p -- "$DEST"
        materialise() {
          local src="$1" name="$2"
          if git cat-file -e "origin/${BASE_REF}:${src}" 2>/dev/null; then
            git show "origin/${BASE_REF}:${src}" > "${DEST}/${name}"
          fi
        }
        materialise CONTRIBUTING.md CONTRIBUTING.md
        materialise AGENTS.md AGENTS.md
        materialise CLAUDE.md CLAUDE.md
        materialise .claude/architecture.md architecture.md
        echo "dir=${DEST}" >> "$GITHUB_OUTPUT"
        echo "Conventions read from origin/${BASE_REF}:"
        ls -A -- "$DEST"

    - name: Write the diff the review reads
      id: diff
      if: >-
        ${{ inputs.flow == 'review' && steps.validate_args.outcome == 'success' &&
        steps.triage.outputs.skip != 'true' }}
      shell: bash
      env:
        BASE_REF: ${{ steps.base.outputs.ref }}
        DEST: ${{ github.workspace }}/_ksai/review
      run: |
        set -euo pipefail
        if ! git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}" >/dev/null; then
          echo "::error::origin/${BASE_REF} is not in this clone, so this review has no base to diff against. The fetch of the base branch above did not succeed"
          exit 1
        fi
        rm -rf -- "$DEST"
        mkdir -p -- "$DEST"
        diff_options=(--no-ext-diff --no-textconv --no-color --no-relative --submodule=short --ignore-submodules=none)
        git diff "${diff_options[@]}" "origin/${BASE_REF}...HEAD" > "${DEST}/diff.patch"
        git diff "${diff_options[@]}" --name-only "origin/${BASE_REF}...HEAD" > "${DEST}/changed-files.txt"
        git diff "${diff_options[@]}" --name-status -z "origin/${BASE_REF}...HEAD" > "${DEST}/changed-files.z"
        git diff "${diff_options[@]}" --name-only -z "origin/${BASE_REF}...HEAD" > "${DEST}/changed-paths.z"
        stat="$(git diff --shortstat "origin/${BASE_REF}...HEAD")"
        {
          printf 'base_sha=%s\n' "$(git rev-parse "origin/${BASE_REF}")"
          printf 'plugin_sha=%s\n' "$(git -C _ksai rev-parse HEAD)"
          printf 'patch=%s\n' "${DEST}/diff.patch"
          printf 'files_file=%s\n' "${DEST}/changed-files.txt"
          printf 'status_file=%s\n' "${DEST}/changed-files.z"
          printf 'paths_file=%s\n' "${DEST}/changed-paths.z"
          printf 'shortstat=%s\n' "${stat# }"
        } >> "$GITHUB_OUTPUT"
        echo "The review reads ${stat# }"

    - name: Mark the context phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: context
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Load the repository's own review rules
      id: repo_rules
      if: >-
        ${{ inputs.flow == 'review' &&
        steps.validate_args.outcome == 'success' && steps.triage.outputs.skip != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        MODE: ${{ inputs.repo_rules }}
        MAX_BYTES: ${{ inputs.repo_rules_max_bytes }}
        MAX_RULES: ${{ inputs.repo_rules_max_rules }}
        MAX_FILE_BYTES: ${{ inputs.repo_rules_max_file_bytes }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        DIFF_PATHS: ${{ steps.diff.outputs.paths_file }}
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { readFileSync } = require('node:fs');
          const loadRepoRules = require(`${process.env.SCRIPTS}/kreview/repo-rules.cjs`);
          let changedFiles = [];
          try {
            changedFiles = readFileSync(process.env.DIFF_PATHS, 'utf-8').split('\0').filter(Boolean);
          } catch (err) {
            core.warning(`the changed-file list could not be read (${err.code ?? err.message})`);
          }
          const { outputs, failure } = await loadRepoRules({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            mode: process.env.MODE,
            maxBytes: process.env.MAX_BYTES,
            maxRules: process.env.MAX_RULES,
            maxFileBytes: process.env.MAX_FILE_BYTES,
            trigger: process.env.TRIGGER,
            changedFiles,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          if (failure) core.setFailed(failure);

    - name: Fetch prior findings
      id: prior
      if: >-
        ${{ inputs.flow == 'review' && steps.validate_args.outcome == 'success' &&
        steps.triage.outputs.skip != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const fetchPrior = require(`${process.env.SCRIPTS}/kreview/fetch-prior.cjs`);
          await fetchPrior({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            prNumber: Number(process.env.PR_NUMBER),
            botLogin: process.env.BOT_LOGIN || null,
          });

    - name: Fetch the Jira ticket
      id: fetch_jira
      if: >-
        ${{ steps.validate_args.outcome == 'success' && steps.works.outputs.reads_source == 'true' }}
      shell: bash
      env:
        PLAN_KEY: ${{ steps.jira_ref.outputs.plan_key }}
        STEP_KEY: ${{ steps.jira_ref.outputs.step_key }}
        JIRA_PROJECTS: ${{ inputs.jira_projects }}
        JIRA_SITE: ${{ inputs.jira_site }}
        JIRA_ALLOW_PUBLIC: ${{ inputs.jira_allow_public_repo }}
        WORK_ITEM: ${{ inputs.work_item }}
        IS_PRIVATE: ${{ steps.context.outputs.is_private }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/jira-step.mjs"

    - name: Read whether another run already holds this plan
      id: holder
      if: >-
        ${{ inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.validate_args.outcome == 'success' && steps.works.outputs.works == 'true' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        REQUEST_LABEL: ${{ steps.context.outputs.label }}
        REQUEST_HEAD: ${{ steps.context.outputs.label_head }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        PHASE: ${{ steps.phase.outputs.phase }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        JOB: ${{ github.job }}
        JOB_INDEX: ${{ strategy.job-index || 0 }}
        EVIDENCE_TOKEN: ${{ inputs.ci_evidence_github_token }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { actionsClient, planHolder } = require(`${process.env.SCRIPTS}/ksai/write-report.cjs`);
          const { outputs, notices = [] } = await planHolder({
            github,
            actionsGithub: actionsClient(github, process.env),
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Comment when nothing ran
      id: notice
      if: ${{ always() && !cancelled() && inputs.flow == 'implement' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        REPORT_NUM: ${{ steps.phase.outputs.pr_number || steps.context.outputs.issue_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        CONTEXT_NOTICE: ${{ steps.context.outputs.refusal }}
        REFUSED_ON: ${{ steps.context.outputs.refused_on }}
        SELECT_NOTICE: ${{ steps.select.outputs.notice }}
        SELECT_NOTICE_KIND: ${{ steps.select.outputs.notice_kind }}
        SUBJECT_NOTICE: ${{ steps.subject.outputs.stop_notice }}
        CLOSED_NOTICE: ${{ steps.issue.outputs.closed_notice }}
        STOP_NOTICE: ${{ steps.phase.outputs.stop_notice }}
        PHASE_NOTICE: ${{ steps.phase.outputs.notice }}
        MERGE_NOTICE: ${{ steps.merge_base.outputs.error }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        JIRA_ERROR: ${{ steps.fetch_jira.outputs.error }}
        HELD_NOTICE: >-
          ${{ steps.holder.outputs.held_by != '' &&
          format('another run is already working this plan ({0}), so this one stopped before writing
          anything. Ask again once that run has finished.', steps.holder.outputs.held_by) || '' }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        PLAN_NOTICE: ${{ steps.read_plan.outputs.error_notice }}
        COMMAND: ${{ steps.select.outputs.command }}
        ROUTE_SOURCE: ${{ steps.select.outputs.route_source }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishNotice } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices = [], warnings = [] } = await publishNotice({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Turn the approved plan into the checklist
      id: release_plan
      if: >-
        ${{ inputs.dry_run == 'false' && steps.phase.outputs.phase == 'plan-review' &&
        steps.holder.outputs.held_by == '' &&
        steps.approval.outputs.blocked != 'true' && (steps.approval.outputs.approval_ref == '' ||
        steps.approval.outputs.needs_ack != 'true' || steps.acknowledge_native.outcome == 'success') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.issue }}
        BRANCH: ${{ steps.phase.outputs.ref }}
        APPROVED_AT: ${{ steps.approval.outputs.approved_at }}
        APPROVED_HEAD: ${{ steps.approval.outputs.approved_head }}
        RELEASE_REF: ${{ steps.approval.outputs.released_by }}
        APPROVAL_URL: ${{ steps.approval.outputs.approval_url }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        JIRA_SITE: ${{ steps.fetch_jira.outputs.site || inputs.jira_site }}
        RUN_ID: ${{ github.run_id }}
        REQUESTER: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/release-plan.mjs"

    - name: Comment when the plan could not be released
      id: notice_release
      if: >-
        ${{ inputs.publish == 'true' && steps.release_plan.outputs.status == 'blocked' &&
        inputs.dry_run == 'false' && steps.phase.outputs.pr_number != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        MESSAGE_FILE: ${{ steps.release_plan.outputs.message_file }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        COMMAND: ${{ steps.select.outputs.command }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishRefusedRelease } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices } = await publishRefusedRelease({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);

    - name: Dispatch the next run
      id: dispatch
      if: >-
        ${{ inputs.continuation_workflow != '' && inputs.dry_run == 'false' &&
        steps.holder.outputs.held_by == '' && steps.works.outputs.released_nothing != 'true' &&
        (steps.phase.outputs.phase == 'step' || steps.phase.outputs.phase == 'plan' ||
        steps.phase.outputs.phase == 'plan-review' || steps.phase.outputs.phase == 'revise') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKFLOW: ${{ inputs.continuation_workflow }}
        CONTINUE_ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        PHASE: ${{ steps.phase.outputs.phase }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        REPORT_NUM: ${{ steps.phase.outputs.pr_number || steps.context.outputs.issue_number }}
        RUN_ID: ${{ github.run_id }}
        HANDS_OFF: ${{ steps.phase.outputs.hands_off }}
        DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch || steps.context.outputs.default_branch }}
        REF: ${{ github.ref_name }}
        ATTEMPT: ${{ steps.context.outputs.attempt }}
        STALL: ${{ steps.context.outputs.stall }}
        PREV_REMAINING: ${{ steps.context.outputs.prev_remaining }}
        REMAINING: ${{ steps.read_plan.outputs.remaining }}
        RELEASED_REMAINING: ${{ steps.release_checkpoint.outcome == 'success' && steps.release_checkpoint.outputs.remaining || '' }}
        TOTAL: ${{ steps.read_plan.outputs.total }}
        APPROVAL_BLOCKED: ${{ steps.approval.outputs.blocked }}
        CHECKPOINT_WAITING: ${{ steps.checkpoint.outputs.waiting }}
        PLAN_HELD: ${{ steps.read_plan.outputs.held }}
        RELEASE_PLAN: ${{ steps.release_plan.outputs.status }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ github.token }}
        script: |
          const { dispatchNext } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices, warnings } = await dispatchNext({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Read the comments a prompt is built from
      id: conversation
      if: >-
        ${{ steps.issue.outcome == 'success' && steps.validate_args.outcome == 'success' &&
        steps.dispatch.outputs.stops_here != 'true' && steps.works.outputs.works == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        HEAD_FILE: ${{ steps.issue.outputs.head_file }}
        ISSUE_FILE: ${{ runner.temp }}/ksai-issue.json
        BOT_LOGIN: ${{ inputs.bot_login }}
        ON_ISSUE: ${{ steps.context.outputs.on_issue }}
        PHASE: ${{ steps.phase.outputs.phase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { fetchConversation } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices } = await fetchConversation({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Prepare write triage
      id: prepare_write_triage
      if: >-
        ${{ inputs.flow == 'implement' && steps.validate_args.outcome == 'success' &&
        steps.works.outputs.works == 'true' && steps.dispatch.outputs.stops_here != 'true' &&
        steps.fetch_jira.outputs.error == '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TRIAGE: ${{ inputs.triage }}
        WRITE_TRIAGE_MODEL: ${{ inputs.write_triage_model }}
        COMMAND: ${{ steps.select.outputs.command }}
        PHASE: ${{ steps.phase.outputs.phase }}
        PLAN_MODE: ${{ steps.select.outputs.plan_mode }}
        REQUIRE_APPROVAL: ${{ inputs.require_plan_approval }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        REQUEST: ${{ steps.prompt.outputs.prompt_content_raw }}
        STEP_TITLE: ${{ steps.read_plan.outputs.step_title }}
        CONVERSATION_FILE: ${{ steps.conversation.outputs.file }}
        THREADS_FILE: ${{ steps.phase.outputs.threads_file }}
        CHECKS_FILE: ${{ steps.phase.outputs.checks_file }}
        MODEL_SOURCE: ${{ steps.select.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.select.outputs.effort_source }}
        MAJOR_BUMP: ${{ steps.major_bump.outputs.major }}
        MAJOR_BUMP_SUMMARY: ${{ steps.major_bump.outputs.summary }}
        MAJOR_BUMP_UNREADABLE: ${{ steps.major_bump.outputs.unreadable }}
        PROMPT_DIR: ${{ runner.temp }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { planWriteTriage } = require(`${process.env.SCRIPTS}/ksai/write-triage.cjs`);
          const { outputs, warnings = [], failure } = planWriteTriage(process.env);
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of warnings) core.warning(line);
          if (failure) core.setFailed(failure);

    - name: Ask the control plane for this write profile
      id: cp_write_triage
      if: >-
        ${{ inputs.flow == 'implement' && inputs.triage_write == 'cp' &&
        inputs.fleet_dials_endpoint != '' && steps.prepare_write_triage.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TRIAGE: ${{ inputs.triage }}
        TRIAGE_WRITE: ${{ inputs.triage_write }}
        ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        RECORD_ID: ${{ inputs.record_id }}
        RUN_HEAD_SHA: ${{ github.sha }}
        HEAD_SHA: ${{ steps.phase.outputs.pr_number != '' && steps.dispatch_record.outputs.head_sha || github.sha }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        EARLY_MODEL: ${{ steps.select.outputs.model }}
        EARLY_EFFORT: ${{ steps.select.outputs.effort }}
        MODEL_SOURCE: ${{ steps.select.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.select.outputs.effort_source }}
        COMMAND: ${{ steps.select.outputs.command }}
        PHASE: ${{ steps.phase.outputs.phase }}
        PLAN_MODE: ${{ steps.select.outputs.plan_mode }}
        REQUIRE_APPROVAL: ${{ inputs.require_plan_approval }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUMBER: ${{ steps.subject.outputs.number }}
        REQUEST: ${{ steps.prompt.outputs.prompt_content_raw }}
        STEP_TITLE: ${{ steps.read_plan.outputs.step_title }}
        CONVERSATION_FILE: ${{ steps.conversation.outputs.file }}
        THREADS_FILE: ${{ steps.phase.outputs.threads_file }}
        CHECKS_FILE: ${{ steps.phase.outputs.checks_file }}
        MAJOR_BUMP: ${{ steps.major_bump.outputs.major }}
        MAJOR_BUMP_SUMMARY: ${{ steps.major_bump.outputs.summary }}
        MAJOR_BUMP_UNREADABLE: ${{ steps.major_bump.outputs.unreadable }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { decideWrite } = require(`${process.env.SCRIPTS}/ksai/cp-write-triage.cjs`);
          const answer = await decideWrite({
            env: process.env,
            mint: (audience) => core.getIDToken(audience),
            secret: (token) => core.setSecret(token),
          });
          core.setOutput('decided', answer.decided ? 'true' : 'false');
          core.setOutput('verdict', answer.verdict ?? '');
          core.setOutput('reason', answer.reason ?? '');
          core.setOutput('model', answer.model ?? '');
          core.setOutput('effort', answer.effort ?? '');
          core.setOutput('model_source', answer.model_source ?? '');
          core.setOutput('effort_source', answer.effort_source ?? '');
          if (answer.decided) {
            core.notice(`the control plane decided this write: ${answer.model}, ${answer.effort}, ${answer.reason}`);
          } else if (answer.why) {
            core.notice(`ksai decided this write on the runner: ${answer.why}`);
          }

    - name: Name what write triage costs
      id: write_triage_headers
      if: >-
        ${{ inputs.flow == 'implement' && steps.prepare_write_triage.outcome == 'success' &&
        steps.cp_write_triage.outputs.decided != 'true' &&
        steps.prepare_write_triage.outputs.call == 'true' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        MODEL: ${{ steps.prepare_write_triage.outputs.model }}
        ACTION: ksai:write-triage
        EFFORT: low
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/attribution.mjs"

    - name: Classify the write risk
      id: write_triage_run
      if: >-
        ${{ inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.prepare_write_triage.outcome == 'success' && steps.cp_write_triage.outputs.decided != 'true' &&
        steps.prepare_write_triage.outputs.call == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        MODEL: ${{ steps.prepare_write_triage.outputs.model }}
        EFFORT: low
        PROMPT_FILE: ${{ steps.prepare_write_triage.outputs.file }}
        EXECUTION_FILE: ${{ runner.temp }}/ksai-write-triage-execution.json
        ATTRIBUTION_HEADERS: ${{ steps.write_triage_headers.outputs.value }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        echo "execution_file=${EXECUTION_FILE}" >> "$GITHUB_OUTPUT"
        node "${SCRIPTS}/ksai/ask-once.mjs"

    - name: Read the write triage verdict
      id: write_triage_verdict
      if: >-
        ${{ always() && inputs.flow == 'implement' && steps.prepare_write_triage.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PLANNED_VERDICT: >-
          ${{ steps.cp_write_triage.outputs.decided == 'true' && steps.cp_write_triage.outputs.verdict ||
          steps.prepare_write_triage.outputs.verdict }}
        PLANNED_REASON: >-
          ${{ steps.cp_write_triage.outputs.decided == 'true' && steps.cp_write_triage.outputs.reason ||
          steps.prepare_write_triage.outputs.reason }}
        SIZING: ${{ steps.prepare_write_triage.outputs.sizing }}
        EXECUTION_FILE: ${{ steps.write_triage_run.outputs.execution_file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { readWriteTriage } = require(`${process.env.SCRIPTS}/ksai/write-triage.cjs`);
          const verdict = readWriteTriage(process.env);
          core.setOutput('verdict', verdict.verdict);
          core.setOutput('reason', verdict.reason);
          const spend = verdict.spend ?? {};
          core.setOutput('cost', String(spend.cost_usd ?? ''));
          core.setOutput('input_tokens', String(spend.input_tokens ?? ''));
          core.setOutput('output_tokens', String(spend.output_tokens ?? ''));
          core.setOutput('turns', String(spend.turns ?? ''));
          core.setOutput('duration', String(spend.duration_s ?? ''));

    - name: Select the write model and effort
      id: write_arm
      if: >-
        ${{ always() && inputs.flow == 'implement' && steps.write_triage_verdict.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EARLY_MODEL: ${{ steps.select.outputs.model }}
        EARLY_EFFORT: ${{ steps.select.outputs.effort }}
        MODEL_SOURCE: ${{ steps.select.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.select.outputs.effort_source }}
        DEFAULT_MODEL: ${{ inputs.model }}
        DEFAULT_EFFORT: ${{ inputs.effort }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        MAX_EFFORT: ${{ inputs.max_effort }}
        MIN_EFFORT: ${{ inputs.min_effort }}
        VERDICT: ${{ steps.write_triage_verdict.outputs.verdict }}
        REASON: ${{ steps.write_triage_verdict.outputs.reason }}
        PRIOR_RED: ${{ steps.prepare_write_triage.outputs.prior_red }}
        CP_MODEL: ${{ steps.cp_write_triage.outputs.decided == 'true' && steps.cp_write_triage.outputs.model || '' }}
        CP_EFFORT: ${{ steps.cp_write_triage.outputs.decided == 'true' && steps.cp_write_triage.outputs.effort || '' }}
        CP_MODEL_SOURCE: ${{ steps.cp_write_triage.outputs.model_source }}
        CP_EFFORT_SOURCE: ${{ steps.cp_write_triage.outputs.effort_source }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { selectWriteArm } = require(`${process.env.SCRIPTS}/ksai/write-triage.cjs`);
          const { outputs, error } = selectWriteArm(process.env);
          for (const name of ['model', 'effort', 'model_source', 'effort_source', 'selection']) {
            core.setOutput(name, outputs[name]);
          }
          if (error) core.setFailed(error);

    - name: Decide whether this run plans first or builds directly
      id: size
      if: ${{ always() && inputs.flow == 'implement' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PHASE: ${{ steps.phase.outputs.phase }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        PLAN_MODE: ${{ steps.select.outputs.plan_mode }}
        VERDICT: ${{ steps.write_triage_verdict.outputs.verdict }}
        REQUIRE_APPROVAL: ${{ inputs.require_plan_approval }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { resolveSize } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, notices } = resolveSize({ env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Name the branch a direct run builds on
      id: open_branch
      if: >-
        ${{ inputs.dry_run == 'false' && steps.validate_args.outcome == 'success' &&
        steps.size.outputs.phase == 'direct' && steps.dispatch.outputs.stops_here != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        ISSUE_FILE: ${{ steps.conversation.outputs.file }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.fetch_jira.outputs.key }}
        JIRA_FILE: ${{ steps.fetch_jira.outputs.file }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/open-branch.mjs"

    - name: Open the draft pull request
      id: open_draft
      if: >-
        ${{ inputs.dry_run == 'false' && steps.validate_args.outcome == 'success' &&
        steps.size.outputs.phase == 'plan' && steps.phase.outputs.pr_number == '' &&
        steps.fetch_jira.outputs.error == '' && steps.dispatch.outputs.stops_here != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        ISSUE_FILE: ${{ steps.conversation.outputs.file }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.fetch_jira.outputs.key }}
        JIRA_SITE: ${{ steps.fetch_jira.outputs.site }}
        JIRA_FILE: ${{ steps.fetch_jira.outputs.file }}
        COMMAND: ${{ steps.select.outputs.command }}
        REQUESTER: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch || steps.context.outputs.default_branch }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/open-draft.mjs"

    - name: Comment what this run opened on the issue
      id: notice_opened
      if: >-
        ${{ (steps.open_draft.outputs.message_file || steps.open_branch.outputs.message_file) != '' &&
        steps.subject.outputs.number != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        MESSAGE_FILE: ${{ steps.open_draft.outputs.message_file || steps.open_branch.outputs.message_file }}
      run: |
        set -euo pipefail
        gh issue comment "$ISSUE_NUM" --repo "$REPO" --body-file "${MESSAGE_FILE}"

    - name: Initialize the durable write report
      id: write_comment
      if: >-
        ${{ inputs.flow == 'implement' && inputs.publish == 'true' && inputs.dry_run == 'false' &&
        steps.holder.outputs.held_by == '' &&
        steps.validate_args.outcome == 'success' && steps.dispatch.outputs.stops_here != 'true' &&
        steps.fetch_jira.outputs.error == '' && steps.open_draft.outputs.status != 'blocked' &&
        steps.open_branch.outputs.status != 'blocked' && steps.works.outputs.works == 'true' &&
        steps.merge_base.outputs.error == '' &&
        (steps.size.outputs.phase != 'plan' ||
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        REQUEST_LABEL: ${{ steps.context.outputs.label }}
        REQUEST_HEAD: ${{ steps.context.outputs.label_head }}
        PLAN_HELD: ${{ steps.phase.outputs.held }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        JOB: ${{ github.job }}
        JOB_INDEX: ${{ strategy.job-index || 0 }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PHASE: ${{ steps.size.outputs.phase }}
        OUTCOME: initializing
        MODEL: ${{ steps.write_arm.outputs.model || steps.select.outputs.model }}
        EFFORT: ${{ steps.write_arm.outputs.effort || steps.select.outputs.effort }}
        MODEL_SOURCE: ${{ steps.write_arm.outputs.model_source || steps.select.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.write_arm.outputs.effort_source || steps.select.outputs.effort_source }}
        DIALS_ARM: ${{ inputs.dials_arm }}
        SELECTION: write context collected; final selection pending
        ROUTE_COMMAND: ${{ steps.select.outputs.command }}
        ROUTE_SURFACE: ${{ steps.select.outputs.route_surface }}
        ROUTE_SOURCE: ${{ steps.select.outputs.route_source }}
        CLASSIFIER_MODEL: ${{ steps.verdict.outputs.model }}
        CLASSIFIER_EFFORT: ${{ steps.verdict.outputs.model && 'low' || '' }}
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        CLASSIFIER_INPUT: ${{ steps.verdict.outputs.input_tokens }}
        CLASSIFIER_OUTPUT: ${{ steps.verdict.outputs.output_tokens }}
        CLASSIFIER_TURNS: ${{ steps.verdict.outputs.turns }}
        CLASSIFIER_DURATION: ${{ steps.verdict.outputs.duration }}
        CURRENT: >-
          ${{ steps.works.outputs.unblocked == 'true' && steps.select.outputs.receipt ||
          'Preparing the write run and selecting its model profile.' }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        EVIDENCE_TOKEN: ${{ inputs.ci_evidence_github_token }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { actionsClient, mutateWriteReport } = require(`${process.env.SCRIPTS}/ksai/write-report.cjs`);
          const { outputs, notices = [], failure, heldBy } = await mutateWriteReport({
            github,
            actionsGithub: actionsClient(github, process.env),
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          core.setOutput('held_by', heldBy);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Resolve how a stop behaves
      id: halt
      if: ${{ inputs.flow == 'implement' && steps.validate_args.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        STOP_MODE: ${{ inputs.stop_mode }}
        STOP_GRACE_SECONDS: ${{ inputs.stop_grace_seconds }}
        STOP_WARN_SECONDS: ${{ inputs.stop_warn_seconds }}
        STOP_PRESERVE: ${{ inputs.stop_preserve }}
        FILE_STOP_MODE: ${{ steps.bare_gate.outputs.stop_mode }}
        FILE_STOP_GRACE_SECONDS: ${{ steps.bare_gate.outputs.stop_grace_seconds }}
        FILE_STOP_WARN_SECONDS: ${{ steps.bare_gate.outputs.stop_warn_seconds }}
        FILE_STOP_PRESERVE: ${{ steps.bare_gate.outputs.stop_preserve }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { stopSettings } = require(`${process.env.SCRIPTS}/ksai/halt.cjs`);
          const outputs = stopSettings({
            mode: process.env.STOP_MODE,
            grace: process.env.STOP_GRACE_SECONDS,
            warn: process.env.STOP_WARN_SECONDS,
            preserve: process.env.STOP_PRESERVE,
            fileMode: process.env.FILE_STOP_MODE,
            fileGrace: process.env.FILE_STOP_GRACE_SECONDS,
            fileWarn: process.env.FILE_STOP_WARN_SECONDS,
            filePreserve: process.env.FILE_STOP_PRESERVE,
          });
          if (outputs.error) {
            core.setFailed(outputs.error);
          } else {
            for (const [name, value] of Object.entries(outputs)) core.setOutput(name, String(value));
            core.info(`A stop is ${outputs.mode}, with ${outputs.grace}s of grace, a warning at ${outputs.warn}s left, and preservation ${outputs.preserve}.`);
          }

    - name: Open the run state directory, and arm the channel where a hook can deliver
      id: channel
      continue-on-error: true
      if: ${{ inputs.dry_run == 'false' && steps.validate_args.outcome == 'success' }}
      shell: bash
      env:
        STATE_DIR: ${{ runner.temp }}/ksai-channel
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/channel-open.mjs"

    - name: Release the thread this run was asked to unlock
      id: release_thread
      if: >-
        ${{ inputs.dry_run == 'false' && steps.validate_args.outcome == 'success' &&
        steps.select.outputs.command == 'unlock' && steps.size.outputs.phase == 'fix' &&
        steps.context.outputs.thread_root_id != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        THREADS_FILE: ${{ steps.phase.outputs.thread_state_file }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMAND: ${{ steps.select.outputs.command }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { releaseThread } = await import(`${process.env.SCRIPTS}/ksai/dispute-step.mjs`);
          const out = await releaseThread({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          if (!out.released) core.warning(`Nothing was released: ${out.why}.`);

    - name: Ask whether a thread was answered back in
      id: build_dispute
      continue-on-error: true
      if: >-
        ${{ inputs.dry_run == 'false' && steps.write_comment.outputs.recorded == 'true' &&
        steps.write_arm.outcome == 'success' && steps.size.outputs.phase == 'fix' &&
        steps.phase.outputs.disputed != '' && steps.phase.outputs.disputed != '0' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        THREADS_FILE: ${{ steps.phase.outputs.thread_state_file }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        CLASSIFIER_MODEL: ${{ inputs.classifier_model }}
        PROMPT_DIR: ${{ runner.temp }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/dispute-step.mjs"

    - name: Name what the dispute read costs
      id: dispute_headers
      if: >-
        ${{ inputs.dry_run == 'false' && steps.write_comment.outputs.recorded == 'true' &&
        steps.write_arm.outcome == 'success' && steps.size.outputs.phase == 'fix' &&
        steps.build_dispute.outputs.model != '' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        MODEL: ${{ steps.build_dispute.outputs.model }}
        ACTION: ksai:dispute
        EFFORT: low
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/attribution.mjs"

    - name: Read whether those threads hold a disagreement
      id: dispute_run
      if: >-
        ${{ inputs.dry_run == 'false' && steps.write_comment.outputs.recorded == 'true' &&
        steps.write_arm.outcome == 'success' && steps.size.outputs.phase == 'fix' &&
        steps.build_dispute.outputs.count != '' && steps.build_dispute.outputs.count != '0' }}
      continue-on-error: true
      shell: bash
      env:
        MODEL: ${{ steps.build_dispute.outputs.model }}
        EFFORT: low
        PROMPT_FILE: ${{ steps.build_dispute.outputs.file }}
        EXECUTION_FILE: ${{ runner.temp }}/ksai-dispute-execution.json
        ATTRIBUTION_HEADERS: ${{ steps.dispute_headers.outputs.value }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        echo "execution_file=${EXECUTION_FILE}" >> "$GITHUB_OUTPUT"
        node "${SCRIPTS}/ksai/ask-once.mjs"

    - name: Hold the threads that were pushed back on
      id: lock_threads
      if: >-
        ${{ always() && steps.size.outputs.phase == 'fix' && steps.dispute_run.outcome != 'skipped' &&
        steps.build_dispute.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DISPUTE_ROOTS: ${{ steps.build_dispute.outputs.roots }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        DISPUTE_LOG: ${{ steps.dispute_run.outputs.execution_file }}
        DISPUTE_CALLED: ${{ steps.dispute_run.outcome }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMAND: ${{ steps.select.outputs.command }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { lockDisputed } = await import(`${process.env.SCRIPTS}/ksai/dispute-step.mjs`);
          const out = await lockDisputed({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          core.setOutput('held', out.held ? 'true' : 'false');
          const spend = out.spend ?? {};
          core.setOutput('cost', String(spend.cost_usd ?? ''));
          core.setOutput('input_tokens', String(spend.input_tokens ?? ''));
          core.setOutput('output_tokens', String(spend.output_tokens ?? ''));
          core.setOutput('turns', String(spend.turns ?? ''));
          core.setOutput('duration', String(spend.duration_s ?? ''));
          for (const notice of out.notices) core.warning(notice);

    - name: Update write progress
      id: write_progress
      continue-on-error: true
      if: >-
        ${{ inputs.flow == 'implement' && steps.write_comment.outputs.recorded == 'true' &&
        steps.write_arm.outcome == 'success' && steps.lock_threads.outputs.held != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        REQUEST_LABEL: ${{ steps.context.outputs.label }}
        REQUEST_HEAD: ${{ steps.context.outputs.label_head }}
        PLAN_HELD: ${{ steps.phase.outputs.held }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        JOB: ${{ github.job }}
        JOB_INDEX: ${{ strategy.job-index || 0 }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PHASE: ${{ steps.size.outputs.phase }}
        OUTCOME: running
        MODEL: ${{ steps.write_arm.outputs.model }}
        EFFORT: ${{ steps.write_arm.outputs.effort }}
        MODEL_SOURCE: ${{ steps.write_arm.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.write_arm.outputs.effort_source }}
        DIALS_ARM: ${{ inputs.dials_arm }}
        SELECTION: ${{ steps.write_arm.outputs.selection }}
        ROUTE_COMMAND: ${{ steps.select.outputs.command }}
        ROUTE_SURFACE: ${{ steps.select.outputs.route_surface }}
        ROUTE_SOURCE: ${{ steps.select.outputs.route_source }}
        CLASSIFIER_MODEL: ${{ steps.verdict.outputs.model }}
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        CLASSIFIER_INPUT: ${{ steps.verdict.outputs.input_tokens }}
        CLASSIFIER_OUTPUT: ${{ steps.verdict.outputs.output_tokens }}
        CLASSIFIER_TURNS: ${{ steps.verdict.outputs.turns }}
        CLASSIFIER_DURATION: ${{ steps.verdict.outputs.duration }}
        WRITE_TRIAGE_MODEL: ${{ steps.prepare_write_triage.outputs.model }}
        WRITE_TRIAGE_EFFORT: ${{ steps.prepare_write_triage.outputs.model && 'low' || '' }}
        WRITE_TRIAGE_CALLED: ${{ steps.write_triage_run.outcome }}
        WRITE_TRIAGE_COST: ${{ steps.write_triage_verdict.outputs.cost }}
        WRITE_TRIAGE_INPUT: ${{ steps.write_triage_verdict.outputs.input_tokens }}
        WRITE_TRIAGE_OUTPUT: ${{ steps.write_triage_verdict.outputs.output_tokens }}
        WRITE_TRIAGE_TURNS: ${{ steps.write_triage_verdict.outputs.turns }}
        WRITE_TRIAGE_DURATION: ${{ steps.write_triage_verdict.outputs.duration }}
        DISPUTE_MODEL: ${{ steps.build_dispute.outputs.model }}
        DISPUTE_EFFORT: ${{ steps.build_dispute.outputs.model && 'low' || '' }}
        DISPUTE_CALLED: ${{ steps.dispute_run.outcome }}
        DISPUTE_COST: ${{ steps.lock_threads.outputs.cost }}
        DISPUTE_INPUT: ${{ steps.lock_threads.outputs.input_tokens }}
        DISPUTE_OUTPUT: ${{ steps.lock_threads.outputs.output_tokens }}
        DISPUTE_TURNS: ${{ steps.lock_threads.outputs.turns }}
        DISPUTE_DURATION: ${{ steps.lock_threads.outputs.duration }}
        CLASSIFIER_EFFORT: ${{ steps.verdict.outputs.model && 'low' || '' }}
        CURRENT: >-
          ${{ steps.size.outputs.phase == 'plan' && 'Planning the implementation.' ||
          steps.size.outputs.phase == 'direct' && 'Building the change.' ||
          format('Working on {0}.', steps.read_plan.outputs.step_title || steps.size.outputs.phase) }}
        FLOW: ${{ inputs.flow }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        STATUS_HISTORY: ${{ steps.status_gate.outputs.history }}
        REQUEST_COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        RECOVER_DIR: ${{ runner.temp }}
        EVIDENCE_TOKEN: ${{ inputs.ci_evidence_github_token }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { actionsClient, mutateWriteReport } = require(`${process.env.SCRIPTS}/ksai/write-report.cjs`);
          const { outputs, notices = [], failure, commentId } = await mutateWriteReport({
            github,
            actionsGithub: actionsClient(github, process.env),
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) {
            core.setFailed(failure);
          } else {
            const { carry } = require(`${process.env.SCRIPTS}/ksai/run-start.cjs`);
            if (!carry(process.env, commentId)) {
              core.setFailed('the verified durable write report could not be carried into live status');
            }
          }

    - name: Look for the planning session this rework continues
      id: plan_session_find
      if: >-
        ${{ steps.size.outputs.phase == 'revise' && steps.phase.outputs.pr_number != '' &&
        inputs.ci_evidence_github_token != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.ci_evidence_github_token }}
        script: |
          const { artifactName, carriedSession } = await import(`${process.env.SCRIPTS}/ksai/plan-session.mjs`);
          const name = artifactName(process.env.PR_NUMBER);
          let found = null;
          try {
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              per_page: 20,
            });
            found = carriedSession(data.artifacts);
          } catch (error) {
            core.info(`no carried planning session could be looked for: ${error.message}`);
          }
          core.setOutput('found', found ? 'true' : 'false');
          core.setOutput('name', found ? name : '');
          core.setOutput('run_id', found ? String(found.workflow_run?.id ?? '') : '');
          core.info(found ? `resuming from ${name} in run ${found.workflow_run?.id}` : `no ${name} to resume from`);

    - name: Download the planning session
      id: plan_session_download
      if: ${{ steps.plan_session_find.outputs.found == 'true' && steps.plan_session_find.outputs.run_id != '' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.plan_session_find.outputs.name }}
        run-id: ${{ steps.plan_session_find.outputs.run_id }}
        github-token: ${{ inputs.ci_evidence_github_token }}
        path: ${{ runner.temp }}/ksai-plan-session

    - name: Resolve what the caller's prompt may touch
      id: build_run
      if: ${{ inputs.flow == 'run' && steps.staged_scripts.outcome == 'success' }}
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        PROMPT_FILE: ${{ inputs.prompt_file }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        EXTRA_ALLOWED: ${{ inputs.extra_allowed_tools }}
        EXTRA_DISALLOWED: ${{ inputs.extra_disallowed_tools }}
        SANDBOX_ALLOW_WRITE: ${{ inputs.sandbox_allow_write }}
        SANDBOX_DENY_WRITE: ${{ inputs.sandbox_deny_write }}
        SANDBOX_DENY_ENV: ${{ inputs.sandbox_deny_env }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/run-flow.mjs"

    - name: Mark the install-cli phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: install-cli
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Install opencode
      id: opencode_install
      if: >-
        ${{ inputs.dry_run == 'false' && steps.engine.outputs.name == 'opencode' &&
        ((inputs.flow == 'implement' && steps.write_comment.outputs.recorded == 'true' &&
        steps.write_arm.outcome == 'success' && steps.write_progress.outputs.recorded == 'true' &&
        steps.lock_threads.outputs.held != 'true' &&
        (steps.select.outputs.plan_given != 'true' || steps.size.outputs.phase != 'plan')) ||
        (inputs.flow == 'test' && steps.test_tools.outcome == 'success') ||
        (inputs.flow == 'review' && steps.validate_args.outcome == 'success' &&
        steps.diff.outcome == 'success' && steps.triage.outputs.skip != 'true') ||
        (inputs.flow == 'run' && steps.build_run.outputs.agent == 'true')) }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        VERSION: ${{ inputs.opencode_version }}
        DIST_DIR: ${{ runner.temp }}/ksai-opencode-dist
        TOOL_DIR: ${{ runner.temp }}/ksai-opencode/bin
        OPENCODE_PTY: ${{ inputs.opencode_pty }}
        OPENCODE_PHASE: ${{ inputs.flow == 'test' && 'test' || steps.size.outputs.phase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        tool_bin="${RUNNER_TEMP}/ksai-opencode/bin"
        cached="/opt/ksai-tools/opencode/${VERSION}/linux-x64/bin/opencode"
        if [[ "${RUNNER_OS}" == 'Linux' && "${RUNNER_ARCH}" == 'X64' && "${VERSION}" == '1.18.30' && -f "${cached}" && -x "${cached}" ]] &&
          echo "87bd160e053af86b5b409daabf71f8dc05bbc3a2a3a5f563f36011cdf706a999  ${cached}" | sha256sum --check --status; then
          selected="${cached}"
          echo "Reusing verified OpenCode ${VERSION}"
        else
          if [[ -f "${cached}" ]]; then
            echo "::warning::Baked OpenCode cache is unusable for this run; installing it"
          fi
          if selected="$(node "${SCRIPTS}/kreview/opencode-install.mjs")" && [[ -n "${selected}" ]]; then
            echo "Installed OpenCode ${VERSION} from its verified registry package"
          else
            npm install --global "opencode-ai@${VERSION}"
            selected="$(npm prefix --global)/bin/opencode"
          fi
        fi
        mkdir -p "${tool_bin}"
        ln -sfn "${selected}" "${tool_bin}/opencode"
        export PATH="${tool_bin}:${PATH}"
        echo '${{ runner.temp }}/ksai-opencode/bin' >> "$GITHUB_PATH"
        actual="$(opencode --version)"
        echo "opencode ${actual}"
        if [[ "${actual}" != "${VERSION}" ]]; then
          echo "::error::opencode reports ${actual}, and this run pinned ${VERSION} - two builds of one reviewer are not one reviewer"
          exit 1
        fi
        echo "version=${actual}" >> "$GITHUB_OUTPUT"
        if [[ "${OPENCODE_PTY:-false}" == "true" && "${OPENCODE_PHASE:-}" =~ ^(test|direct|step|fix|do)$ ]]; then
          npm ci --prefix "${SCRIPTS}/vendor/opencode-pty" --omit=dev --omit=peer --ignore-scripts
        fi

    - name: Put the planning session where the CLI reads it
      id: plan_session
      if: ${{ steps.plan_session_download.outcome == 'success' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        DOWNLOAD_DIR: ${{ runner.temp }}/ksai-plan-session
        ENGINE: ${{ steps.engine.outputs.name }}
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        XDG_DATA_HOME: ${{ runner.temp }}/opencode-home
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/plan-session-restore.mjs"

    - name: Assemble the implement prompt
      id: build_implement
      if: >-
        ${{ steps.validate_args.outcome == 'success' && (inputs.dry_run == 'true' ||
        (steps.write_comment.outputs.recorded == 'true' && steps.write_arm.outcome == 'success' &&
        steps.write_progress.outputs.recorded == 'true')) &&
        steps.dispatch.outputs.stops_here != 'true' &&
        steps.fetch_jira.outputs.error == '' &&
        steps.lock_threads.outputs.held != 'true' &&
        steps.works.outputs.works == 'true' &&
        steps.merge_base.outputs.error == '' &&
        (steps.select.outputs.plan_given != 'true' || steps.size.outputs.phase != 'plan') &&
        (steps.size.outputs.phase != 'plan' ||
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        CHANNEL_NONCE: ${{ steps.channel.outputs.nonce }}
        PHASE: ${{ steps.size.outputs.phase }}
        PROMPT_DIR: ${{ runner.temp }}
        ISSUE_FILE: ${{ steps.conversation.outputs.file }}
        JIRA_FILE: ${{ steps.fetch_jira.outputs.file }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.fetch_jira.outputs.key }}
        JIRA_ERROR: ${{ steps.fetch_jira.outputs.error }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch || steps.context.outputs.default_branch }}
        BRANCH: ${{ steps.open_draft.outputs.branch || steps.open_branch.outputs.branch || steps.phase.outputs.ref }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        PLAN_FILE: ${{ steps.phase.outputs.plan_file }}
        RESUMED_SESSION: ${{ steps.plan_session.outputs.resumed }}
        BASE_SHA: ${{ steps.checkout_source.outputs.commit }}
        STEP_TITLE: ${{ steps.read_plan.outputs.step_title }}
        REMAINING: ${{ steps.read_plan.outputs.remaining }}
        TOTAL: ${{ steps.read_plan.outputs.total }}
        THREADS_FILE: ${{ steps.phase.outputs.threads_file }}
        CHECKS_FILE: ${{ steps.phase.outputs.checks_file }}
        RETRY_FILE: ${{ steps.phase.outputs.retry_file }}
        DEFERRED: ${{ steps.phase.outputs.deferred }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        BASE_DIFF_REF: ${{ steps.fetch_base.outputs.ref }}
        MERGED_SHA: ${{ steps.merge_base.outputs.merged_sha }}
        MERGED_REF: ${{ steps.merge_base.outputs.merged_ref }}
        MERGE_CONFLICTED: ${{ steps.merge_base.outputs.conflicted }}
        GUIDANCE: ${{ steps.phase.outputs.request || inputs.work_guidance }}
        MAJOR_BUMP: ${{ steps.major_bump.outputs.major }}
        MAJOR_BUMP_SUMMARY: ${{ steps.major_bump.outputs.summary }}
        MAJOR_BUMP_OMITTED: ${{ steps.major_bump.outputs.omitted }}
        MAJOR_BUMP_AMBIGUOUS: ${{ steps.major_bump.outputs.ambiguous }}
        SAW_TRIGGER: ${{ steps.dispatch_record.outputs.trigger }}
        SAW_RUN: ${{ steps.dispatch_record.outputs.trigger_run }}
        SAW_ATTEMPT: ${{ steps.dispatch_record.outputs.trigger_attempt }}
        SAW_STATE: ${{ steps.dispatch_record.outputs.trigger_state }}
        SAW_NAME: ${{ steps.dispatch_record.outputs.trigger_name }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { buildPrompt } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs, failure } = buildPrompt({ env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          if (failure) core.setFailed(failure);

    - name: Mark the prompt phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: prompt
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Warm locked Node dependencies while there is still a network
      if: >-
        ${{ inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.build_implement.outcome == 'success' && steps.size.outputs.phase == 'do' &&
        steps.phase.outputs.checks_file != '' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        CHECKS_FILE: ${{ steps.phase.outputs.checks_file }}
        PROMPT_FILE: ${{ steps.build_implement.outputs.file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        GH_TOKEN:
        GITHUB_TOKEN:
        ANTHROPIC_AUTH:
        ANTHROPIC_FEDERATED_TOKEN:
        OTEL_EXPORTER_OTLP_HEADERS:
      run: node "${SCRIPTS}/ksai/package-warm.mjs"

    - name: Look for a Go module in the tree under work
      id: go_detect
      if: >-
        ${{ inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.build_implement.outcome == 'success' && steps.size.outputs.plans != 'true' }}
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/gomod-detect.mjs"

    - name: Set up the Go this repository pins
      id: go_setup
      if: ${{ inputs.flow == 'implement' && steps.go_detect.outputs.mod != '' }}
      continue-on-error: true
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.go_detect.outputs.mod }}
        cache: false

    - name: Warm the Go module cache while there is still a network
      if: ${{ inputs.flow == 'implement' && steps.go_setup.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        LIST: ${{ steps.go_detect.outputs.list }}
        GO_MODULE_TOKENS: ${{ inputs.go_module_tokens }}
        IS_PRIVATE: ${{ steps.context.outputs.is_private }}
        PROMPT_FILE: ${{ steps.build_implement.outputs.file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/gomod-warm.mjs"

    - name: Assemble the review prompt
      id: build_review
      if: >-
        ${{ inputs.flow == 'review' && inputs.dry_run == 'false' &&
        steps.diff.outcome == 'success' && steps.triage.outputs.skip != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHANNEL_NONCE: ${{ steps.channel.outputs.nonce }}
        REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        REVIEW_EXPERIMENT: ${{ inputs.review_experiment }}
        PUBLISH: ${{ inputs.publish }}
        COMMIT_ID: ${{ steps.checkout_pr.outputs.commit }}
        BASE_SHA: ${{ steps.diff.outputs.base_sha }}
        PLUGIN_SHA: ${{ steps.diff.outputs.plugin_sha }}
        RUNTIME_SHA: ${{ steps.staged_scripts.outputs.sha }}
        ENGINE: ${{ steps.engine.outputs.name }}
        PROMPT_FILE: ${{ runner.temp }}/kreview-prompt.md
        BASE_REF: ${{ steps.base.outputs.ref }}
        WORKSPACE: ${{ github.workspace }}
        CONVENTIONS_DIR: ${{ steps.conventions.outputs.dir }}
        REQUEST_HTML: ${{ steps.select_arm.outputs.prompt_content_html }}
        PRIOR_FINDINGS: ${{ steps.prior.outputs.prior_findings }}
        TRIAGE_SKILLS: ${{ steps.triage.outputs.skills }}
        DIFF_PATCH: ${{ steps.diff.outputs.patch }}
        DIFF_FILES: ${{ steps.diff.outputs.files_file }}
        DIFF_STATUS: ${{ steps.diff.outputs.status_file }}
        DIFF_SHORTSTAT: ${{ steps.diff.outputs.shortstat }}
        REPO_RULES: ${{ steps.repo_rules.outputs.rules }}
        JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { buildReviewPrompt } = require(`${process.env.SCRIPTS}/kreview/prepare.cjs`);
          const { outputs, error } = buildReviewPrompt({ env: process.env });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          if (error) core.setFailed(error);

    - name: Mark the sandbox phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: sandbox
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Install the opencode SDK
      id: opencode_sdk_install
      if: >-
        ${{ steps.opencode_install.outcome == 'success' &&
        steps.build_review.outputs.result_transport == 'structured' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        VERSION: ${{ inputs.opencode_version }}
        REVIEW_RESULT_TRANSPORT: ${{ steps.build_review.outputs.result_transport }}
      run: |
        set -euo pipefail
        npm install --prefix "${RUNNER_TEMP}/ksai-opencode-sdk" --no-package-lock --no-save "@opencode-ai/sdk@${VERSION}"

    - name: Say the run has started
      id: notice_started
      if: >-
        ${{ inputs.flow == 'review' && inputs.publish == 'true' && inputs.dry_run == 'false' &&
        steps.build_review.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        FLOW: ${{ inputs.flow }}
        REPORT_NUM: >-
          ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number ||
          steps.context.outputs.issue_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        MODEL: ${{ steps.select_arm.outputs.model }}
        EFFORT: ${{ steps.select_arm.outputs.effort }}
        COMMAND: ${{ steps.select_arm.outputs.command }}
        RECEIPT: ${{ steps.select_arm.outputs.receipt }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        STATUS_HISTORY: ${{ steps.status_gate.outputs.history }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        RECOVER_DIR: ${{ runner.temp }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishRunStart } = require(`${process.env.SCRIPTS}/ksai/run-start.cjs`);
          const { outputs, notices } = await publishRunStart({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Record the surface a lost run would leave behind
      if: >-
        ${{ always() && (steps.notice_started.outcome == 'success' ||
        steps.write_progress.outcome != 'skipped') }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-recover-${{ github.job }}
        path: ${{ runner.temp }}/recover.json
        retention-days: 1
        if-no-files-found: ignore
        overwrite: true

    - name: Install Claude sandbox runtime
      if: >-
        ${{ inputs.dry_run == 'false' &&
        (steps.build_implement.outcome == 'success' || steps.build_review.outcome == 'success' ||
        steps.build_test.outcome == 'success' || steps.build_run.outputs.agent == 'true') }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -x /usr/bin/bwrap || ! -x /usr/bin/socat || ! -x /usr/bin/rg ]]; then
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
        else
          echo "Reusing installed sandbox packages"
        fi
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

        # CLI 2.1.216 onward collects .mcp.json deny paths by walking all the way to / from both
        # the working directory and $HOME, and bwrap creates each one as a placeholder before
        # binding /dev/null over it. /home is root-owned on the runner image, so that create fails
        # with "bwrap: Can't create file at /home/.mcp.json: Permission denied" and the sandbox
        # aborts before any Bash command runs - reproduced on run 30996826056, where all 6 attempts
        # plus a subagent's died identically and no review could be produced
        # (anthropics/claude-code#83129).
        #
        # Both roots are walked because neither covers the other on every runner. A GitHub-hosted
        # runner puts the workspace under /home/runner, so walking it reaches /home by itself; a
        # Kong-hosted one puts the workspace in /work while $HOME stays /home/ubuntu, leaving /home
        # reachable only from $HOME. That is how an earlier move onto Kong-hosted runners brought
        # this failure back on run 31093289559 with the workspace walk already in place.
        #
        # bwrap binds over a path that already exists instead of creating it, so pre-creating the
        # ones the runner cannot write clears the abort without relaxing a sandbox rule. Walking
        # rather than naming /home and / keeps this tracking the CLI's own loop.
        for root in "${GITHUB_WORKSPACE}" "${HOME}"; do
          dir="${root}"
          while :; do
            # ${dir%/} so the root iteration builds /.mcp.json, not //.mcp.json.
            placeholder="${dir%/}/.mcp.json"
            if [[ ! -e "${placeholder}" && ! -w "${dir}" ]]; then
              printf '{"mcpServers":{}}' | sudo tee "${placeholder}" > /dev/null
            fi
            parent="$(dirname "${dir}")"
            if [[ "${parent}" == "${dir}" ]]; then
              break
            fi
            dir="${parent}"
          done
        done

        # failIfUnavailable proves bwrap is installed, not that the kernel will grant it a
        # namespace. Kong's dedicated fleet denied one until August 2026: `docker-default` AppArmor
        # carries no `userns create` rule and Ubuntu 24.04 ships the restriction sysctl on, while
        # moby's default seccomp profile masks `CLONE_NEWUSER` out of `clone` without CAP_SYS_ADMIN.
        # Both layers answer the same EPERM, so every sandboxed command died with "bwrap: No
        # permissions to create new namespace" while the CLI kept taking turns. On run 31789519444
        # that produced a review which had read no diff, and the job still reported success - the
        # empty review that reports a pass is the failure this pipeline must never produce.
        #
        # kong-konnect/tf-konnect-gh-runners#149 lifts both layers on the host, which is the only
        # place they can be lifted: `/proc/sys` is read-only inside the job's container, so the
        # `sysctl -w` calls in this step print the new value, warn, and exit 0 having changed
        # nothing. A job cannot correct either layer itself, and the denial reaches it unexplained.
        #
        # Which label reaches which fleet is measured rather than assumed, because this note had it
        # backwards once. `ubuntu-latest-kong` answers from `self-hosted-runner-*` and
        # `kong-inc-dedicated,size-md,amd64` from `kong-inc-amd-md-ip-*`, on five distinct hosts
        # across two repositories.
        #
        # The probe stays either way. A fleet's kernel is not ours to promise, and this is what makes
        # a change in one loud rather than silent.
        probe_userns() {
          bwrap --ro-bind / / --proc /proc --unshare-user --unshare-pid true
        }
        if ! probe_userns 2>/dev/null; then
          # Two further knobs gate unprivileged userns on some kernels and neither exists
          # everywhere, so failing to set one is not itself fatal - the re-probe decides.
          sudo sysctl -w user.max_user_namespaces=15000 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
        fi
        if ! probe_err="$(probe_userns 2>&1)"; then
          echo "::error::bwrap cannot create a user namespace on runner ${RUNNER_NAME:-unknown}: ${probe_err}"
          exit 1
        fi

    - name: Compute model cost-attribution headers
      id: model_headers
      if: >-
        ${{ inputs.dry_run == 'false' &&
        (steps.build_implement.outcome == 'success' || steps.build_review.outcome == 'success' ||
        steps.build_test.outcome == 'success' || steps.build_run.outcome == 'success') }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        TEAM: ${{ steps.telemetry.outputs.team }}
        FEDERATION_RULE: ${{ inputs.federation_rule_id }}
        SERVICE_ACCOUNT: ${{ inputs.service_account_id }}
        WORKFLOW: ${{ steps.telemetry.outputs.workflow }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ steps.context.outputs.commenter || github.actor }}
        ACTION: >-
          ksai:${{ inputs.flow == 'review' && 'review' || inputs.flow == 'test' && 'test' ||
          inputs.flow == 'run' && format('run-{0}', steps.build_run.outputs.profile) || steps.size.outputs.phase }}
        MODEL: >-
          ${{ steps.write_arm.outputs.model || steps.select_arm.outputs.model ||
          steps.select_test.outputs.model || steps.build_run.outputs.model }}
        EFFORT: >-
          ${{ steps.write_arm.outputs.effort || steps.select_arm.outputs.effort ||
          steps.select_test.outputs.effort || steps.build_run.outputs.effort }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/attribution.mjs"

    - name: Mark the arm phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: arm
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Stage the native LSP canary servers
      id: opencode_lsp
      if: >-
        ${{ steps.opencode_install.outcome == 'success' &&
        steps.build_review.outputs.lsp_tool == 'native' }}
      shell: bash
      env:
        OPENCODE_LSP_ROOT: ${{ runner.temp }}/ksai-lsp
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/opencode-lsp.mjs"

    - name: Verify the native LSP resource boundary
      id: opencode_cgroup
      if: >-
        ${{ steps.opencode_install.outcome == 'success' &&
        steps.build_review.outputs.lsp_tool == 'native' &&
        steps.opencode_lsp.outcome == 'success' }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/opencode-cgroup.mjs" --preflight

    - name: Write the opencode runtime config
      id: opencode_config
      if: >-
        ${{ steps.opencode_install.outcome == 'success' &&
        (steps.build_review.outputs.lsp_tool != 'native' ||
        steps.opencode_cgroup.outcome == 'success') }}
      shell: bash
      env:
        REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        REVIEW_RESULT_TRANSPORT: ${{ steps.build_review.outputs.result_transport || steps.build_run.outputs.result_transport }}
        OPENCODE_LSP_TOOL: ${{ steps.build_review.outputs.lsp_tool }}
        OPENCODE_LSP_ROOT: ${{ steps.opencode_lsp.outputs.root }}
        OPENCODE_CONFIG: ${{ runner.temp }}/opencode-runtime.json
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        OPENCODE_VERSION: ${{ steps.opencode_install.outputs.version }}
        KREVIEW_PLUGIN_ROOT: ${{ inputs.flow != 'run' && format('{0}/_ksai/plugins/kreview', github.workspace) || '' }}
        OPENCODE_MODEL: ${{ steps.write_arm.outputs.model || steps.select_test.outputs.model || steps.select_arm.outputs.model || steps.build_run.outputs.model }}
        OPENCODE_PHASE: ${{ inputs.flow == 'review' && 'review' || inputs.flow == 'test' && 'test' || steps.size.outputs.phase || steps.build_run.outputs.phase }}
        OPENCODE_PTY: ${{ inputs.opencode_pty }}
        OPENCODE_ALLOWED: >-
          ${{ steps.build_implement.outputs.allowed_tools || steps.test_tools.outputs.allowed_tools ||
          steps.build_review.outputs.allowed_tools || steps.build_run.outputs.allowed_tools }}
        OPENCODE_DISALLOWED: >-
          ${{ steps.build_implement.outputs.disallowed_tools || steps.test_tools.outputs.disallowed_tools ||
          steps.build_review.outputs.disallowed_tools || steps.build_run.outputs.disallowed_tools }}
        OPENCODE_SKILLS: ${{ inputs.flow == 'implement' && format('{0}/_ksai/plugins/ksai-implement/skills', github.workspace) || '' }}
        KSAI_CHANNEL_NONCE: ${{ steps.channel.outputs.nonce }}
        ALLOWED_MODELS: ${{ inputs.allowed_models }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ATTRIBUTION_HEADERS: ${{ steps.model_headers.outputs.value }}
        SANDBOX_ALLOW_WRITE: ${{ inputs.sandbox_allow_write }}
        SANDBOX_DENY_WRITE: ${{ inputs.sandbox_deny_write }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        node "${SCRIPTS}/kreview/opencode-config.mjs"
        echo "file=${OPENCODE_CONFIG}" >> "$GITHUB_OUTPUT"

    - name: Mint the bearer this review starts on
      id: mint
      if: >-
        ${{ steps.opencode_config.outcome == 'success' &&
        (steps.build_review.outputs.lsp_tool != 'native' ||
        steps.opencode_cgroup.outcome == 'success') }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/federated-token.mjs"

    - name: Arm the watchdog
      id: watchdog
      if: >-
        ${{ inputs.dry_run == 'false' && inputs.job_timeout_minutes != '0' &&
        (steps.build_implement.outcome == 'success' || steps.build_review.outcome == 'success' ||
        steps.build_test.outcome == 'success' || steps.build_run.outputs.agent == 'true') }}
      shell: bash
      env:
        JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        CLI_PATTERN: ${{ steps.engine.outputs.cli_pattern }}
        ENGINE: ${{ steps.engine.outputs.name }}
        OPENCODE_EVENTS_FILE: ${{ runner.temp }}/opencode-events.jsonl
        PID_FILE: ${{ runner.temp }}/ksai-watchdog.pid
        FIRED_FILE: ${{ runner.temp }}/ksai-watchdog.fired
        REASON_FILE: ${{ runner.temp }}/ksai-watchdog.reason
        CAUSE_FILE: ${{ runner.temp }}/ksai-watchdog.cause
        STOP_FILE: ${{ steps.channel.outputs.state_dir && format('{0}/stop.json', steps.channel.outputs.state_dir) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        MAX_CONSECUTIVE_FAILURES: ${{ inputs.max_consecutive_tool_failures }}
        MAX_REPEATED_CALLS: ${{ inputs.max_repeated_tool_calls }}
        TRIM_PREFIX: ${{ github.workspace }}
        POLL_SECONDS: "20"
        STAMPED_AT_MS: ${{ steps.plugin_ref.outputs.started_at_ms }}
        MISSED_FILE: ${{ runner.temp }}/ksai-watchdog.missed
      run: node "${SCRIPTS}/ksai/watchdog-arm.mjs"


    - name: Run the tester on opencode
      id: opencode_test
      if: >-
        ${{ inputs.dry_run == 'false' && inputs.flow == 'test' &&
        steps.mint.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        PROMPT_FILE: ${{ steps.build_test.outputs.file }}
        MODEL: ${{ steps.select_test.outputs.model }}
        VARIANT: ${{ steps.select_test.outputs.effort }}
        OPENCODE_CONFIG: ${{ steps.opencode_config.outputs.file }}
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        OPENCODE_VERSION: ${{ steps.opencode_install.outputs.version }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATED_TOKEN: ${{ steps.mint.outputs.token }}
        ANTHROPIC_FEDERATED_TOKEN_EXPIRES_AT: ${{ steps.mint.outputs.expires_at }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        EVENTS_FILE: ${{ runner.temp }}/opencode-events.jsonl
        EXECUTION_FILE: ${{ runner.temp }}/opencode-execution.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        KSAI_CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        KSAI_CHANNEL_KILL_AT: ${{ steps.watchdog.outputs.kill_at_ms || '0' }}
        KSAI_CHANNEL_ARMED_AT: ${{ steps.watchdog.outputs.armed_at_ms || '0' }}
        KSAI_CHANNEL_FLOW: ${{ inputs.flow || 'unknown' }}
        FLOW: ${{ inputs.flow }}
        KSAI_CHANNEL_NONCE: ${{ steps.channel.outputs.nonce || 'none' }}
        KSAI_CHANNEL_WARN: ${{ steps.halt.outputs.warn || '0' }}
        KSAI_WORKFLOW_PACKAGE: ${{ steps.workflow_stage.outputs.package }}
        KSAI_STAGE_REQUEST: ${{ steps.workflow_stage.outputs.request }}
        KSAI_STAGE_RESULT: ${{ steps.workflow_stage.outputs.result }}
        KSAI_STAGE_ARTIFACTS: ${{ steps.workflow_stage.outputs.artifacts }}
        KSAI_STAGE_INPUTS: ${{ steps.workflow_stage.outputs.inputs }}
        OPENCODE_PTY: ${{ inputs.opencode_pty }}
        OPENCODE_PHASE: test
        OPENCODE_SKILLS: ""
        OPENCODE_RESUME_SESSION: ${{ steps.plan_session.outputs.session_id }}
        SUBPROCESS_ENV_SCRUB: "1"
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }},intent_command=${{ steps.select_test.outputs.command }},intent_surface=${{
          steps.select_test.outputs.route_surface }},intent_source=${{ steps.select_test.outputs.route_source }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/opencode-run.mjs"

    - name: Accept the manifest-backed test result
      id: accept_test_stage
      if: >-
        ${{ always() && inputs.flow == 'test' &&
        steps.workflow_stage.outcome == 'success' &&
        steps.opencode_test.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        WORKFLOW_DESCRIPTOR: ${{ steps.workflow_stage.outputs.descriptor }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/workflow/accept.mjs"

    - name: Record what the tester spent
      if: >-
        ${{ always() && inputs.flow == 'test' &&
        steps.test_paths.outcome == 'success' &&
        steps.opencode_test.outputs.execution_file != '' }}
      continue-on-error: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXECUTION_FILE: ${{ steps.opencode_test.outputs.execution_file }}
        SPEND_DIR: ${{ runner.temp }}/pr-test-spend
        MODEL: ${{ steps.select_test.outputs.model }}
        EFFORT: ${{ steps.select_test.outputs.effort }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { runSpend } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);
          let raw = '';
          try {
            raw = fs.readFileSync(process.env.EXECUTION_FILE, 'utf8');
          } catch (error) {
            core.warning(`the tester's execution log could not be read (${error.message}); its run is unrecorded.`);
            return;
          }
          const { warning, ...spend } = runSpend(raw);
          if (warning) core.warning(warning);
          fs.rmSync(process.env.SPEND_DIR, { recursive: true, force: true });
          fs.mkdirSync(process.env.SPEND_DIR, { recursive: true });
          fs.writeFileSync(
            path.join(process.env.SPEND_DIR, 'spend.json'),
            JSON.stringify({
              ...spend,
              measured: warning ? 'false' : 'true',
              model: process.env.MODEL,
              effort: process.env.EFFORT,
            }),
          );

    - name: Stage the verdict before repository teardown runs
      id: test_artifact
      if: ${{ always() && steps.test_paths.outcome == 'success' }}
      shell: bash
      env:
        RUN: ${{ steps.test_paths.outputs.dir }}
        VERDICT: ${{ steps.accept_test_stage.outputs.output }}
        ALLOW_RUN_VERDICT: >-
          ${{ steps.select_test.outputs.test_mode != 'test' ||
          steps.start_test_environments.outcome == 'failure' }}
        SPEND: ${{ runner.temp }}/pr-test-spend/spend.json
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        DEST: ${{ runner.temp }}/pr-test-verdict
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/stage-verdict.mjs"
        spent=$(SPEND_FILE="${SPEND}" node -pe '
          const fs = require("node:fs");
          let held = {};
          try { held = JSON.parse(fs.readFileSync(process.env.SPEND_FILE, "utf8")); } catch {}
          const parts = [
            held.measured === "true" ? held.total_cost : null,
            process.env.CLASSIFIER_COST,
          ].filter((one) => one !== null && one !== undefined && one !== "" && Number.isFinite(Number(one)));
          parts.length ? String(Number(parts.reduce((total, one) => total + Number(one), 0).toFixed(6))) : "";
        ')
        echo "spend_usd=${spent}" >> "$GITHUB_OUTPUT"

    - name: Tear the environments down
      if: >-
        ${{ always() && steps.test_paths.outcome == 'success' &&
        steps.test_teardown_tree.outcome == 'success' }}
      shell: bash
      env:
        THREAD_NUM: ${{ steps.context.outputs.issue_number }}
        ENVS: ${{ inputs.environments }}
        RUN: ${{ steps.test_paths.outputs.dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        CONTRACT: ${{ steps.test_contract.outputs.encoded }}
        ARCHIVE: ${{ steps.test_teardown_tree.outputs.archive }}
        ARCHIVE_SHA256: ${{ steps.test_teardown_tree.outputs.sha256 }}
        ROOT: ${{ runner.temp }}/pr-test-teardown
      run: |
        set -euo pipefail
        printf '%s  %s\n' "${ARCHIVE_SHA256}" "${ARCHIVE}" | sha256sum --check --status
        rm -rf -- "${ROOT}"
        mkdir -p -- "${ROOT}"
        tar -xf "${ARCHIVE}" -C "${ROOT}"
        node "${SCRIPTS}/ksai/pr-test/cli.mjs" down --pr "${THREAD_NUM}" \
          ${ENVS:+--env "${ENVS}"} --contract-base64 "${CONTRACT}" \
          --repo-root "${ROOT}" --run-dir "${RUN}" || true

    - name: Verify the staged verdict after repository teardown
      id: verify_test_artifact
      if: ${{ always() && inputs.flow == 'test' && steps.test_artifact.outputs.present == 'true' }}
      shell: bash
      env:
        VERDICT: ${{ steps.test_artifact.outputs.dir }}/.pr-test-verdict.json
        SHA256: ${{ steps.test_artifact.outputs.sha256 }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/verify-verdict.mjs"

    - name: Upload the tester's execution log
      if: >-
        ${{ always() && inputs.flow == 'test' &&
        steps.opencode_test.outputs.execution_file != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-execution-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.opencode_test.outputs.execution_file }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

    - name: Upload the verdict
      if: >-
        ${{ always() && inputs.flow == 'test' &&
        steps.test_artifact.outputs.staged == 'true' &&
        steps.verify_test_artifact.outcome != 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-verdict-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.test_artifact.outputs.dir }}
        include-hidden-files: true
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error
        overwrite: true

    - name: Download the verdict
      if: ${{ inputs.flow == 'test-publish' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: pr-test-verdict-${{ inputs.run_id || github.run_id }}-${{ inputs.run_attempt }}
        path: ${{ runner.temp }}/pr-test-download
        run-id: ${{ inputs.run_id || github.run_id }}
        github-token: ${{ inputs.run_id != '' && github.token || '' }}

    - name: Download the acceptance criteria captured before execution
      if: ${{ inputs.flow == 'test-publish' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: pr-test-criteria-${{ inputs.run_id || github.run_id }}-${{ inputs.run_attempt }}
        path: ${{ runner.temp }}/pr-test-download
        run-id: ${{ inputs.run_id || github.run_id }}
        github-token: ${{ inputs.run_id != '' && github.token || '' }}

    - name: Download the environment record captured before the tester
      if: ${{ inputs.flow == 'test-publish' }}
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: pr-test-environments-${{ inputs.run_id || github.run_id }}-${{ inputs.run_attempt }}
        path: ${{ runner.temp }}/pr-test-download
        run-id: ${{ inputs.run_id || github.run_id }}
        github-token: ${{ inputs.run_id != '' && github.token || '' }}

    - name: Render the review
      if: ${{ inputs.flow == 'test-publish' }}
      id: render_test
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        RUN_DIR: ${{ runner.temp }}/pr-test-download
        PR: ${{ inputs.issue_number }}
        PHRASE: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/review-post.mjs" render

    - name: Upload validated hypothesis results
      if: ${{ always() && inputs.flow == 'test-publish' && steps.render_test.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pr-test-verification-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ runner.temp }}/pr-test-download/verification.json
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error

    - name: Post the review
      id: post_test
      if: ${{ inputs.flow == 'test-publish' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.issue_number }}
        RUN_DIR: ${{ runner.temp }}/pr-test-download
        SOURCE_RUN: ${{ inputs.run_id || github.run_id }}
        RENDERED_OUTCOME: ${{ steps.render_test.outputs.outcome }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/pr-test/review-post.mjs" post

    - name: Decide whether the courier carries comments naming no command
      id: courier_pull
      continue-on-error: true
      if: >-
        ${{ inputs.flow == 'implement' && steps.bare_gate.outputs.mode == 'auto' &&
        inputs.dry_run == 'false' && inputs.publish == 'true' && steps.channel.outcome == 'success' &&
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BARE_MODE: ${{ steps.bare_gate.outputs.mode }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        retries: 3
        script: |
          const { resolveCourierPull } = require(`${process.env.SCRIPTS}/ksai/prepare.cjs`);
          const { outputs } = await resolveCourierPull({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);

    - name: Seal Git objects before writable model work
      id: seal_git_objects
      if: >-
        ${{ inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.build_implement.outcome == 'success' }}
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/seal-objects.mjs"

    - name: Carry what people write into the run
      id: courier
      continue-on-error: true
      if: >-
        ${{ inputs.dry_run == 'false' && inputs.publish == 'true' && steps.channel.outcome == 'success' &&
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number ||
        steps.context.outputs.issue_number) != '' &&
        (steps.build_implement.outcome == 'success' || steps.build_review.outcome == 'success') }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        ENGINE: ${{ steps.engine.outputs.name }}
        OPENCODE_EVENTS_FILE: ${{ runner.temp }}/opencode-events.jsonl
        REPO: ${{ github.repository }}
        THREAD_NUM: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number || steps.context.outputs.issue_number }}
        COURIER_SOURCE_TOKEN: ${{ inputs.source_org_github_token }}
        COURIER_AUTH_TOKEN: ${{ inputs.authorization_github_token || inputs.source_org_github_token }}
        GITHUB_API_URL: ${{ github.api_url }}
        ARMED_AT_MS: ${{ steps.watchdog.outputs.armed_at_ms }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        OWN_PULL: ${{ steps.courier_pull.outputs.mine }}
        WRITE_ACCESS_COMMANDS: ${{ steps.select.outputs.write_access_commands || steps.select_arm.outputs.write_access_commands }}
        STOP_MODE: ${{ steps.halt.outputs.mode }}
        STOP_GRACE_SECONDS: ${{ steps.halt.outputs.grace }}
        PID_FILE: ${{ runner.temp }}/ksai-courier.pid
        STATUS_UPDATES: ${{ steps.status_gate.outputs.mode }}
        STATUS_HISTORY: ${{ steps.status_gate.outputs.history }}
        STATUS_MODEL: ${{ steps.status_gate.outputs.model }}
        STATUS_KILL_AT_MS: ${{ steps.watchdog.outputs.kill_at_ms }}
        STATUS_HELPER: ${{ steps.gateway_token.outputs.helper }}
        STATUS_BASE_URL: ${{ inputs.anthropic_base_url }}
        TRIM_PREFIX: ${{ github.workspace }}
        TRANSCRIPT_SINCE: ${{ steps.watchdog.outputs.armed_at_ms || steps.plugin_ref.outputs.started_at_ms }}
      run: |
        set -euo pipefail
        nohup node "${SCRIPTS}/ksai/courier-run.mjs" >/dev/null 2>&1 &
        echo "$!" > "$PID_FILE"
        echo "Courier watching ${REPO}#${THREAD_NUM} for what is written while this run works"


    - name: Ask once, for a run that holds no tools
      id: run_once
      if: >-
        ${{ inputs.flow == 'run' && steps.build_run.outputs.agent == 'false' &&
        steps.model_headers.outcome == 'success' }}
      shell: bash
      env:
        MODEL: ${{ steps.build_run.outputs.model }}
        EFFORT: ${{ steps.build_run.outputs.effort }}
        PROMPT_FILE: ${{ steps.build_run.outputs.file }}
        EXECUTION_FILE: ${{ runner.temp }}/ksai-run-execution.json
        ATTRIBUTION_HEADERS: ${{ steps.model_headers.outputs.value }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -uo pipefail
        echo "execution_file=${EXECUTION_FILE}" >> "$GITHUB_OUTPUT"
        if node "${SCRIPTS}/ksai/ask-once.mjs"; then
          echo "conclusion=success" >> "$GITHUB_OUTPUT"
        else
          echo "conclusion=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Mark the model phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: model
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Run opencode
      id: opencode
      if: >-
        ${{ steps.mint.outcome == 'success' &&
        ((inputs.flow == 'implement' && steps.build_implement.outcome == 'success') ||
        (inputs.flow == 'review' && steps.build_review.outcome == 'success') ||
        (inputs.flow == 'run' && steps.build_run.outputs.agent == 'true')) }}
      shell: bash
      env:
        REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        REVIEW_RESULT_TRANSPORT: ${{ steps.build_review.outputs.result_transport || steps.build_run.outputs.result_transport }}
        PROMPT_FILE: ${{ steps.build_implement.outputs.file || steps.build_test.outputs.file || steps.build_review.outputs.file || steps.build_run.outputs.file }}
        MODEL: ${{ steps.write_arm.outputs.model || steps.select_test.outputs.model || steps.select_arm.outputs.model || steps.build_run.outputs.model }}
        VARIANT: ${{ steps.write_arm.outputs.effort || steps.select_test.outputs.effort || steps.select_arm.outputs.effort || steps.build_run.outputs.effort }}
        OPENCODE_CONFIG: ${{ steps.opencode_config.outputs.file }}
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        OPENCODE_VERSION: ${{ steps.opencode_install.outputs.version }}
        OPENCODE_SDK_ROOT: ${{ runner.temp }}/ksai-opencode-sdk
        KSAI_KILLED_FILE: ${{ runner.temp }}/ksai-engine-killed
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        ANTHROPIC_AUTH: ${{ inputs.anthropic_auth }}
        ANTHROPIC_FEDERATED_TOKEN: ${{ steps.mint.outputs.token }}
        ANTHROPIC_FEDERATED_TOKEN_EXPIRES_AT: ${{ steps.mint.outputs.expires_at }}
        ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.federation_rule_id }}
        ANTHROPIC_ORGANIZATION_ID: ${{ inputs.organization_id }}
        ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.service_account_id }}
        ANTHROPIC_WORKSPACE_ID: ${{ inputs.workspace_id }}
        EVENTS_FILE: ${{ runner.temp }}/opencode-events.jsonl
        EXECUTION_FILE: ${{ runner.temp }}/opencode-execution.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        KSAI_CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        KSAI_CHANNEL_KILL_AT: ${{ steps.watchdog.outputs.kill_at_ms || '0' }}
        KSAI_CHANNEL_ARMED_AT: ${{ steps.watchdog.outputs.armed_at_ms || '0' }}
        KSAI_CHANNEL_FLOW: ${{ inputs.flow || 'unknown' }}
        FLOW: ${{ inputs.flow }}
        KSAI_CHANNEL_NONCE: ${{ steps.channel.outputs.nonce || 'none' }}
        KSAI_CHANNEL_WARN: ${{ steps.halt.outputs.warn || '0' }}
        OPENCODE_PTY: ${{ inputs.opencode_pty }}
        OPENCODE_PHASE: ${{ inputs.flow == 'review' && 'review' || steps.size.outputs.phase || steps.build_run.outputs.phase }}
        OPENCODE_SKILLS: ${{ inputs.flow == 'implement' && format('{0}/_ksai/plugins/ksai-implement/skills', github.workspace) || '' }}
        OPENCODE_RESUME_SESSION: ${{ steps.plan_session.outputs.session_id }}
        SUBPROCESS_ENV_SCRUB: "1"
        SANDBOX_ALLOW_WRITE: ${{ inputs.sandbox_allow_write }}
        SANDBOX_DENY_WRITE: ${{ inputs.sandbox_deny_write }}
        SANDBOX_DENY_ENV: ${{ inputs.sandbox_deny_env }}
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }},intent_command=${{ steps.select.outputs.command || steps.select_arm.outputs.command }},intent_surface=${{
          steps.select.outputs.route_surface || steps.select_arm.outputs.route_surface }},intent_source=${{ steps.select.outputs.route_source || steps.select_arm.outputs.route_source }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        OPENCODE_LSP_TOOL: ${{ steps.build_review.outputs.lsp_tool }}
        OPENCODE_LSP_MEASURE: ${{ steps.build_review.outputs.lsp_measure }}
        OPENCODE_LSP_ROOT: ${{ steps.opencode_lsp.outputs.root }}
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/opencode-run.mjs"

    - name: Mark the publish phase
      if: ${{ always() }}
      shell: bash
      env:
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
        PHASE: publish
      run: |
        # Measurement only: a mark this step cannot append costs the run nothing.
        printf '%s\t%s\n' "$(date +%s%3N)" "$PHASE" >> "$PHASES_FILE" || true

    - name: Say how the model run ended, whichever engine ran it
      id: model_run
      if: >-
        ${{ always() && (steps.opencode.outcome != 'skipped' ||
        steps.opencode_test.outcome != 'skipped' || steps.run_once.outcome != 'skipped') }}
      shell: bash
      env:
        CONCLUSION: >-
          ${{ steps.opencode.outputs.conclusion || steps.opencode_test.outputs.conclusion ||
          steps.run_once.outputs.conclusion }}
        OUTCOME: >-
          ${{ steps.opencode.outcome != 'skipped' && steps.opencode.outcome ||
          steps.opencode_test.outcome != 'skipped' && steps.opencode_test.outcome ||
          steps.run_once.outcome != 'skipped' && steps.run_once.outcome || '' }}
        EXECUTION: >-
          ${{ steps.opencode.outputs.execution_file || steps.opencode_test.outputs.execution_file ||
          steps.run_once.outputs.execution_file }}
      run: |
        set -euo pipefail
        echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
        echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
        echo "execution_file=${EXECUTION}" >> "$GITHUB_OUTPUT"

    - name: Upload the opencode event stream
      if: >-
        ${{ always() && (steps.opencode.outputs.events_file != '' ||
        (inputs.flow == 'test' && steps.opencode_test.outputs.events_file != '')) }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-opencode-events-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: |
          ${{ steps.opencode.outputs.events_file || steps.opencode_test.outputs.events_file }}
          ${{ steps.opencode.outputs.pipeline_file || steps.opencode_test.outputs.pipeline_file }}
          ${{ steps.opencode.outputs.children_file || steps.opencode_test.outputs.children_file }}
          ${{ steps.opencode.outputs.hypotheses_file || steps.opencode_test.outputs.hypotheses_file }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

    - name: Stop the courier
      id: stop_courier
      if: >-
        ${{ always() && steps.courier.outcome == 'success' &&
        (inputs.flow == 'implement' || steps.validate_args.outcome == 'success') }}
      shell: bash
      env:
        PID_FILE: ${{ runner.temp }}/ksai-courier.pid
        CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/courier-stop.mjs"

    - name: Disarm the watchdog
      id: disarm_watchdog
      if: ${{ always() && steps.watchdog.outcome == 'success' }}
      shell: bash
      env:
        PID_FILE: ${{ runner.temp }}/ksai-watchdog.pid
        FIRED_FILE: ${{ steps.watchdog.outputs.fired_file }}
        REASON_FILE: ${{ steps.watchdog.outputs.reason_file }}
        CAUSE_FILE: ${{ steps.watchdog.outputs.cause_file }}
        MISSED_FILE: ${{ steps.watchdog.outputs.missed_file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/watchdog-disarm.mjs"

    - name: Report the tool call timeline
      id: timeline
      if: ${{ always() && steps.opencode.outcome != 'skipped' }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        OPENCODE_EVENTS_FILE: ${{ steps.opencode.outputs.events_file }}
        STARTED_AT_MS: ${{ steps.plugin_ref.outputs.started_at_ms }}
        STOPPED_BECAUSE: ${{ steps.disarm_watchdog.outputs.reason }}
        TRANSCRIPT_SINCE: ${{ steps.watchdog.outputs.armed_at_ms }}
        TRIM_PREFIX: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # One arm, so no branch. The `else` arms called `ksai/progress.mjs` and `ksai/stages.mjs`,
        # which read a transcript by `SESSION_ID` - a value this step stopped carrying when the
        # Claude run that published it went, so they were broken rather than merely unreachable.
        # Both modules stay in the tree as libraries: every status, channel and price module
        # imports `progress.mjs`, and `kreview/opencode-progress.mjs --stages` calls `stages.mjs`.
        echo "::group::What the run did"
        node "${SCRIPTS}/kreview/opencode-progress.mjs" || echo "The timeline could not be rendered"
        echo "::endgroup::"
        echo "::group::Where the run spent its time"
        node "${SCRIPTS}/kreview/opencode-progress.mjs" --stages || echo "The stage timings could not be measured"
        echo "::endgroup::"

    - name: Report the run channel and status updates
      id: status_report
      if: ${{ always() && steps.channel.outcome == 'success' }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        CHANNEL_DIR: ${{ steps.channel.outputs.state_dir }}
        STARTED_AT_MS: ${{ steps.plugin_ref.outputs.started_at_ms }}
        STATUS_UPDATES: ${{ steps.status_gate.outputs.mode }}
        STATUS_HISTORY: ${{ steps.status_gate.outputs.history }}
      run: |
        set -euo pipefail
        echo "::group::What the run channel delivered"
        node "${SCRIPTS}/ksai/channel-report.mjs" || echo "The run channel could not be reported"
        echo "::endgroup::"
        echo "::group::What the run said while it worked"
        node "${SCRIPTS}/ksai/status-report.mjs" || echo "The status updates could not be reported"
        echo "::endgroup::"

    - name: Keep what a stopped run had already done
      id: preserve
      if: >-
        ${{ always() && inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.channel.outcome == 'success' && steps.checkout_source.outcome == 'success' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        STOP_PRESERVE: ${{ steps.halt.outputs.preserve }}
        STOP_MODE: ${{ steps.halt.outputs.mode }}
        STOP_FILE: ${{ steps.channel.outputs.state_dir }}/stop.json
        KSAI_KILLED_FILE: ${{ runner.temp }}/ksai-engine-killed
        WORKSPACE: ${{ github.workspace }}
        BRANCH: ${{ steps.open_draft.outputs.branch || steps.open_branch.outputs.branch || steps.phase.outputs.ref }}
        BASE_SHA: ${{ steps.checkout_source.outputs.commit }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        CHANGE_SCOPE_FILE: ${{ steps.build_implement.outputs.change_scope_file }}
        REPO: ${{ github.repository }}
        PUSH_URL: https://x-access-token:${{ inputs.source_org_github_token }}@github.com/${{ github.repository }}.git
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        PLAN_FILE: ${{ steps.phase.outputs.plan_file }}
        PHASE: ${{ steps.size.outputs.phase }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.jira_ref.outputs.step_key || steps.jira_ref.outputs.plan_key }}
        COMMIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        COMMIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/preserve.mjs"

    - name: Upload what a stopped run left behind
      if: ${{ always() && inputs.flow == 'implement' && steps.preserve.outputs.tree != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-stopped-${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number || 'none' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.preserve.outputs.tree }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

    - name: Upload the model execution log
      if: >-
        ${{ always() && inputs.flow != 'test' && steps.model_run.outputs.execution_file != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-execution-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.model_run.outputs.execution_file }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

    - name: Stage the planning session for the run that reworks it
      id: plan_session_save
      if: >-
        ${{ always() && inputs.dry_run == 'false' &&
        steps.size.outputs.plans == 'true' &&
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        ENGINE: ${{ steps.engine.outputs.name }}
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        XDG_DATA_HOME: ${{ runner.temp }}/opencode-home
        TRANSCRIPT_SINCE: ${{ steps.watchdog.outputs.armed_at_ms || steps.plugin_ref.outputs.started_at_ms }}
        ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact_retention_days }}
        STAGING_DIR: ${{ runner.temp }}/ksai-plan-session-out
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/plan-session-save.mjs"

    - name: Upload the planning session
      if: ${{ always() && steps.plan_session_save.outputs.saved == 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.plan_session_save.outputs.name }}
        path: ${{ steps.plan_session_save.outputs.file }}
        retention-days: ${{ steps.plan_session_save.outputs.retention_days }}
        overwrite: true
        if-no-files-found: ignore

    # Takes the place of the planning model run: the requester wrote the document in the comment that
    # asked for the work, and this puts it where the publisher below already reads it from. Nothing
    # downstream learns who wrote it - `parsePlanDocument` refuses a document this flow cannot run,
    # `subjectFrom` refuses a title outside the subject shape, and a code owner still releases the
    # plan before any code is written. See docs/decisions/handed-in-plan.md.
    - name: Write the handed-in plan into the workspace
      id: hand_plan
      if: >-
        ${{ inputs.dry_run == 'false' && steps.size.outputs.phase == 'plan' &&
        steps.select.outputs.plan_given == 'true' &&
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '' }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PROMPT: ${{ steps.prompt.outputs.prompt_content_raw }}
        BRANCH: ${{ steps.open_draft.outputs.branch || steps.open_branch.outputs.branch || steps.phase.outputs.ref }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/hand-plan.mjs"

    - name: Write the plan into the draft pull request
      id: publish
      if: >-
        ${{ inputs.dry_run == 'false' && steps.size.outputs.phase == 'plan' &&
        (steps.model_run.outputs.conclusion == 'success' ||
        steps.hand_plan.outputs.written == 'true') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.issue }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        JIRA_SITE: ${{ steps.fetch_jira.outputs.site || inputs.jira_site }}
        JIRA_TITLE_KEY: ${{ inputs.jira_title_key }}
        RUN_ID: ${{ github.run_id }}
        REQUESTER: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        BRANCH: ${{ steps.open_draft.outputs.branch || steps.open_branch.outputs.branch || steps.phase.outputs.ref }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        PLAN_GIVEN: ${{ steps.select.outputs.plan_given }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/publish.mjs"

    - name: Push the work and open its pull request for review
      id: publish_direct
      if: >-
        ${{ inputs.dry_run == 'false' && steps.size.outputs.phase == 'direct' &&
        steps.model_run.outputs.conclusion == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        ISSUE_NUM: ${{ steps.subject.outputs.issue }}
        RUN_ID: ${{ github.run_id }}
        REQUESTER: ${{ steps.context.outputs.commenter || steps.context.outputs.work_actor }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        BRANCH: ${{ steps.open_branch.outputs.branch }}
        BASE_SHA: ${{ steps.checkout_source.outputs.commit }}
        DEFAULT_BRANCH: ${{ steps.issue.outputs.default_branch || steps.context.outputs.default_branch }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.jira_ref.outputs.step_key || steps.jira_ref.outputs.plan_key }}
        COMMIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        COMMIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/publish-direct.mjs"

    - name: Comment when the plan is waiting for approval
      id: notice_waiting
      if: >-
        ${{ steps.approval.outputs.blocked == 'true' && inputs.dry_run == 'false' &&
        (steps.size.outputs.phase == 'step' || steps.size.outputs.phase == 'plan-review' ||
        steps.publish.outputs.status == 'planned') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        REASON: ${{ steps.approval.outputs.reason }}
        OPEN_THREADS: ${{ steps.approval.outputs.open_threads }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        WRITE_ACCESS_COMMANDS: ${{ steps.select.outputs.write_access_commands }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishAwaiting } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices } = await publishAwaiting({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);

    - name: Verify, push and record the step
      id: record
      if: >-
        ${{ inputs.dry_run == 'false' && steps.size.outputs.phase == 'step' &&
        steps.model_run.outputs.conclusion == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ steps.phase.outputs.ref }}
        REMOTE_SHA: ${{ steps.checkout_source.outputs.commit }}
        STEP_TITLE: ${{ steps.read_plan.outputs.step_title }}
        REMAINING: ${{ steps.read_plan.outputs.remaining }}
        REMAINING_STEPS: ${{ steps.read_plan.outputs.remaining_steps }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.jira_ref.outputs.step_key || steps.jira_ref.outputs.plan_key }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/record.mjs"

    - name: Verify, push and answer the threads
      id: record_fix
      if: >-
        ${{ inputs.dry_run == 'false' && steps.model_run.outputs.conclusion == 'success' &&
        (steps.size.outputs.phase == 'fix' || steps.size.outputs.phase == 'revise') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        PHASE: ${{ steps.size.outputs.phase }}
        BRANCH: ${{ steps.phase.outputs.ref }}
        REMOTE_SHA: ${{ steps.checkout_source.outputs.commit }}
        PENDING_FILE: ${{ steps.phase.outputs.threads_file }}
        DEFERRED: ${{ steps.phase.outputs.deferred }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        PLAN_FILE: ${{ steps.phase.outputs.plan_file }}
        RESUMED_SESSION: ${{ steps.plan_session.outputs.resumed }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        CHANGE_SCOPE_FILE: ${{ steps.build_implement.outputs.change_scope_file }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.jira_ref.outputs.step_key || steps.jira_ref.outputs.plan_key }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/fix.mjs"

    - name: Verify and push the requested work
      id: record_do
      if: >-
        ${{ inputs.dry_run == 'false' && steps.size.outputs.phase == 'do' &&
        steps.model_run.outputs.conclusion == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ steps.phase.outputs.ref }}
        REMOTE_SHA: ${{ steps.checkout_source.outputs.commit }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        SAW_TRIGGER: ${{ steps.dispatch_record.outputs.trigger }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        MERGED_SHA: ${{ steps.merge_base.outputs.merged_sha }}
        CHANGE_SCOPE_FILE: ${{ steps.build_implement.outputs.change_scope_file }}
        MERGED_REF: ${{ steps.merge_base.outputs.merged_ref }}
        MERGE_CONFLICTED: ${{ steps.merge_base.outputs.conflicted }}
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.jira_ref.outputs.step_key || steps.jira_ref.outputs.plan_key }}
        CHECKS_FILE: ${{ steps.phase.outputs.checks_file }}
        RETRY_FILE: ${{ steps.phase.outputs.retry_file }}
        OPENCODE_EVENTS_FILE: ${{ steps.opencode.outputs.events_file }}
        VERIFICATION_FILE: ${{ runner.temp }}/ksai-fix-verification.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/do-record.mjs"

    - name: Record the pushed head immutably
      id: pushed_receipt
      if: >-
        ${{ always() && inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        (steps.publish.outputs.pushed_sha != '' || steps.publish_direct.outputs.pushed_sha != '' ||
        steps.record.outputs.pushed_sha != '' || steps.record_fix.outputs.pushed_sha != '' ||
        steps.record_do.outputs.pushed_sha != '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: >-
          ${{ steps.publish.outputs.pr_number || steps.publish_direct.outputs.pr_number ||
          steps.record.outputs.pr_number || steps.record_fix.outputs.pr_number ||
          steps.record_do.outputs.pr_number }}
        PUSHED_SHA: >-
          ${{ steps.publish.outputs.pushed_sha || steps.publish_direct.outputs.pushed_sha ||
          steps.record.outputs.pushed_sha || steps.record_fix.outputs.pushed_sha ||
          steps.record_do.outputs.pushed_sha }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { createPushedReceipt } = require(`${process.env.SCRIPTS}/ksai/do.cjs`);
          await createPushedReceipt({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            prNumber: process.env.PR_NUMBER,
            sha: process.env.PUSHED_SHA,
          });

    - name: Keep the work a push gate refused
      id: preserve_refused
      if: >-
        ${{ always() && inputs.flow == 'implement' && steps.checkout_source.outcome == 'success' &&
        (steps.publish.outputs.status == 'blocked' || steps.publish_direct.outputs.status == 'blocked' ||
        steps.record.outputs.status == 'blocked' || steps.record_fix.outputs.status == 'blocked' ||
        steps.record_do.outputs.status == 'blocked') }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        WORKSPACE: ${{ github.workspace }}
        REMOTE_SHA: ${{ steps.checkout_source.outputs.commit }}
        OUT_DIR: ${{ runner.temp }}/ksai-refused
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        MERGED_SHA: ${{ steps.merge_base.outputs.merged_sha }}
        CHANGE_SCOPE_FILE: ${{ steps.build_implement.outputs.change_scope_file }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        MESSAGE_FILE: >-
          ${{ steps.publish.outputs.message_file || steps.publish_direct.outputs.message_file ||
          steps.record.outputs.message_file || steps.record_fix.outputs.message_file ||
          steps.record_do.outputs.message_file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/preserve-refused.mjs"

    - name: Tell the control plane this step stopped for a human
      id: stop_successor
      if: >-
        ${{ always() && steps.dispatch.outputs.successor == 'asked' &&
        (steps.publish.outputs.status == 'blocked' || steps.publish_direct.outputs.status == 'blocked' ||
        steps.record.outputs.status == 'blocked' || steps.record_fix.outputs.status == 'blocked' ||
        steps.record_do.outputs.status == 'blocked') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CONTINUE_ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        PHASE: ${{ steps.size.outputs.phase }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        HANDS_OFF: ${{ steps.phase.outputs.hands_off }}
        REMAINING: ${{ steps.read_plan.outputs.remaining }}
        RELEASED_REMAINING: ${{ steps.release_checkpoint.outcome == 'success' && steps.release_checkpoint.outputs.remaining || '' }}
        TOTAL: ${{ steps.read_plan.outputs.total }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { stopSuccessor } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices, warnings } = await stopSuccessor({ core, env: process.env });
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Upload the work a push gate refused
      if: ${{ always() && inputs.flow == 'implement' && steps.preserve_refused.outputs.tree != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-refused-${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number || 'none' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.preserve_refused.outputs.tree }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore

    - name: Upload the autofix change record
      if: >-
        ${{ always() && inputs.flow == 'implement' &&
        steps.build_implement.outputs.change_scope_file != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ksai-change-scope-${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number || 'none' }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ runner.temp }}/ksai-change-scope
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: error

    - name: Decide whether the plan is finished
      id: finished
      if: ${{ steps.size.outputs.phase == 'step' && steps.read_plan.outputs.error == '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TOTAL: ${{ steps.read_plan.outputs.total }}
        REMAINING_AFTER: ${{ steps.record.outputs.remaining || steps.release_checkpoint.outputs.remaining }}
        HAS_STEP: ${{ steps.read_plan.outputs.has_step }}
        IS_DRAFT: ${{ steps.phase.outputs.is_draft }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { decideFinished } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices } = decideFinished(process.env);
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Hold the plan where a pause stopped it
      id: hold_plan
      if: >-
        ${{ always() && inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.channel.outcome == 'success' && steps.finished.outputs.finish != 'true' &&
        (steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number) != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        STOP_FILE: ${{ steps.channel.outputs.state_dir }}/stop.json
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        retries: 3
        script: |
          const { heldPlan } = require(`${process.env.SCRIPTS}/ksai/stop-due.mjs`);
          const { withHold } = require(`${process.env.SCRIPTS}/ksai/plan.cjs`);
          const fs = require('node:fs');
          let held = false;
          try {
            held = heldPlan(fs.readFileSync(process.env.STOP_FILE, 'utf-8'));
          } catch {
            held = false;
          }
          if (!held) return;
          const number = Number(process.env.PR_NUMBER);
          const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
          const next = withHold(data.body ?? '', process.env.RUN_ID);
          if (next === null) {
            core.warning('this run could not name itself, so the plan was not held');
            return;
          }
          if (next.changed) {
            await github.rest.pulls.update({ ...context.repo, pull_number: number, body: next.body });
          }
          core.setOutput('held', 'true');
          core.info(`The plan on #${number} is held until somebody resumes it.`);

    - name: Remove the plan document
      id: retire_plan
      if: >-
        ${{ steps.finished.outputs.finish == 'true' && inputs.keep_plan_file == 'false' &&
        inputs.dry_run == 'false' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ steps.phase.outputs.ref }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        PLAN_DIR: ${{ inputs.plan_file_path }}
        MANIFEST: ${{ github.workspace }}/.ksai-manifest.json
        KSAI_GIT_AUTHOR_NAME: ${{ steps.identity.outputs.author_name }}
        KSAI_GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.author_email }}
        KSAI_GIT_FILEMODE: ${{ steps.configure_git.outputs.filemode }}
        CO_AUTHOR: ${{ steps.identity.outputs.coauthor }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        PUSH_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
          node "${SCRIPTS}/ksai/retire-plan.mjs"

    - name: Mark ready for review and notify
      id: finish
      if: ${{ steps.finished.outputs.finish == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.phase.outputs.pr_number }}
        ISSUE_NUM: ${{ steps.subject.outputs.issue }}
        RUN_ID: ${{ github.run_id }}
        DRY_RUN: ${{ inputs.dry_run }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { markReady } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices, failure } = await markReady({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Finalize the durable write report
      id: write_report
      if: ${{ always() && inputs.flow == 'implement' && steps.write_comment.outputs.recorded == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMAND: ${{ steps.select.outputs.command }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.fetch_jira.outputs.key }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        REQUEST_LABEL: ${{ steps.context.outputs.label }}
        REQUEST_HEAD: ${{ steps.context.outputs.label_head }}
        HELD: ${{ steps.hold_plan.outputs.held }}
        PLAN_HELD: ${{ steps.phase.outputs.held }}
        BOT_LOGIN: ${{ inputs.bot_login }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        ATTEMPT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        JOB: ${{ github.job }}
        JOB_INDEX: ${{ strategy.job-index || 0 }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        PHASE: ${{ steps.size.outputs.phase }}
        OUTCOME: >-
          ${{ steps.publish.outputs.status || steps.publish_direct.outputs.status || steps.record.outputs.status ||
          steps.record_fix.outputs.status || steps.record_do.outputs.status ||
          steps.release_plan.outputs.status || 'failed' }}
        REASON: >-
          ${{ steps.disarm_watchdog.outputs.cause || steps.approval.outputs.reason ||
          (steps.checkpoint.outputs.waiting == 'true' && steps.checkpoint.outputs.reason) || '' }}
        MODEL: ${{ steps.write_arm.outputs.model || steps.select.outputs.model }}
        EFFORT: ${{ steps.write_arm.outputs.effort || steps.select.outputs.effort }}
        MODEL_SOURCE: ${{ steps.write_arm.outputs.model_source || steps.select.outputs.model_source }}
        EFFORT_SOURCE: ${{ steps.write_arm.outputs.effort_source || steps.select.outputs.effort_source }}
        DIALS_ARM: ${{ inputs.dials_arm }}
        SELECTION: >-
          ${{ steps.write_arm.outputs.selection || 'write selection did not complete' }}
        ROUTE_COMMAND: ${{ steps.select.outputs.command }}
        ROUTE_SURFACE: ${{ steps.select.outputs.route_surface }}
        ROUTE_SOURCE: ${{ steps.select.outputs.route_source }}
        CLASSIFIER_MODEL: ${{ steps.verdict.outputs.model }}
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        CLASSIFIER_INPUT: ${{ steps.verdict.outputs.input_tokens }}
        CLASSIFIER_OUTPUT: ${{ steps.verdict.outputs.output_tokens }}
        CLASSIFIER_TURNS: ${{ steps.verdict.outputs.turns }}
        CLASSIFIER_DURATION: ${{ steps.verdict.outputs.duration }}
        WRITE_TRIAGE_MODEL: ${{ steps.prepare_write_triage.outputs.model }}
        WRITE_TRIAGE_EFFORT: ${{ steps.prepare_write_triage.outputs.model && 'low' || '' }}
        WRITE_TRIAGE_CALLED: ${{ steps.write_triage_run.outcome }}
        WRITE_TRIAGE_COST: ${{ steps.write_triage_verdict.outputs.cost }}
        WRITE_TRIAGE_INPUT: ${{ steps.write_triage_verdict.outputs.input_tokens }}
        WRITE_TRIAGE_OUTPUT: ${{ steps.write_triage_verdict.outputs.output_tokens }}
        WRITE_TRIAGE_TURNS: ${{ steps.write_triage_verdict.outputs.turns }}
        WRITE_TRIAGE_DURATION: ${{ steps.write_triage_verdict.outputs.duration }}
        DISPUTE_MODEL: ${{ steps.build_dispute.outputs.model }}
        DISPUTE_EFFORT: ${{ steps.build_dispute.outputs.model && 'low' || '' }}
        DISPUTE_CALLED: ${{ steps.dispute_run.outcome }}
        DISPUTE_COST: ${{ steps.lock_threads.outputs.cost }}
        DISPUTE_INPUT: ${{ steps.lock_threads.outputs.input_tokens }}
        DISPUTE_OUTPUT: ${{ steps.lock_threads.outputs.output_tokens }}
        DISPUTE_TURNS: ${{ steps.lock_threads.outputs.turns }}
        DISPUTE_DURATION: ${{ steps.lock_threads.outputs.duration }}
        CLASSIFIER_EFFORT: ${{ steps.verdict.outputs.model && 'low' || '' }}
        MAIN_EXECUTION: ${{ steps.model_run.outputs.execution_file }}
        MAIN_CALLED: ${{ steps.model_run.outputs.outcome }}
        VERIFICATION_FILE: ${{ steps.record_do.outputs.verification_file }}
        COMMIT_SHA: ${{ steps.record_do.outputs.commit_sha }}
        STATUS_MODEL: ${{ steps.status_gate.outputs.model }}
        STATUS_EFFORT: ${{ steps.status_gate.outputs.model && 'low' || '' }}
        STATUS: ${{ steps.status_report.outputs.record }}
        CURRENT_FILE: >-
          ${{ steps.publish.outputs.message_file || steps.publish_direct.outputs.message_file ||
          steps.record.outputs.message_file || steps.record_fix.outputs.message_file ||
          steps.record_do.outputs.message_file || steps.release_plan.outputs.message_file }}
        CURRENT: >-
          ${{ (steps.publish.outputs.status || steps.publish_direct.outputs.status || steps.record.outputs.status ||
          steps.record_fix.outputs.status || steps.record_do.outputs.status || steps.release_plan.outputs.status) == '' &&
          'This write run did not complete. See the linked workflow run for the failure or cancellation details.' || '' }}
        DO_REQUEST: >-
          ${{ steps.record_do.outcome == 'success' &&
          (steps.record_do.outputs.status == 'changed' || steps.record_do.outputs.status == 'unchanged') &&
          steps.context.outputs.comment_id || '' }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { mutateWriteReport } = require(`${process.env.SCRIPTS}/ksai/write-report.cjs`);
          const { outputs, notices = [], failure } = await mutateWriteReport({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          core.setOutput('spend_usd', outputs.spend_usd ?? '');
          for (const line of notices) core.info(line);
          if (failure) core.setFailed(failure);

    - name: Report the result and react
      id: result
      if: >-
        ${{ always() && !cancelled() && inputs.flow == 'implement' &&
        steps.write_report.outputs.recorded == 'true' &&
        (steps.publish.outputs.message_file != '' || steps.publish_direct.outputs.message_file != '' ||
        steps.record.outputs.message_file != '' ||
        steps.record.outputs.status == 'stepped' || steps.record_fix.outputs.message_file != '' ||
        steps.record_do.outputs.message_file != '' || steps.release_plan.outputs.message_file != '' ||
        steps.context.outputs.comment_id != '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_NUM: >-
          ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number ||
          steps.context.outputs.issue_number }}
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        REPORTED: "true"
        ALREADY_SAID: "success"
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        PHASE: ${{ steps.size.outputs.phase }}
        RUN_ID: ${{ github.run_id }}
        MESSAGE_FILE: >-
          ${{ steps.publish.outputs.message_file || steps.publish_direct.outputs.message_file ||
          steps.record.outputs.message_file || steps.record_fix.outputs.message_file ||
          steps.record_do.outputs.message_file || steps.release_plan.outputs.message_file }}
        STATUS: >-
          ${{ steps.publish.outputs.status || steps.publish_direct.outputs.status || steps.record.outputs.status ||
          steps.record_fix.outputs.status || steps.record_do.outputs.status ||
          steps.release_plan.outputs.status }}
        START_COMMENT_ID: ""
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishResult } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { outputs, notices } = await publishResult({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Comment when the run failed
      if: >-
        ${{ always() && !cancelled() && inputs.flow == 'implement' && inputs.dry_run == 'false' &&
        steps.prompt.outputs.has_trigger == 'true' &&
        (steps.select.outcome != 'success' || steps.select.outputs.mine == 'true' ||
        steps.select.outputs.notice != '') &&
        steps.read_plan.outputs.has_step != 'false' &&
        steps.notice.outputs.posted != 'true' &&
        steps.phase.outputs.quiet != 'true' &&
        steps.write_comment.outputs.held_by == '' &&
        (steps.write_report.outcome == 'failure' ||
        (steps.write_comment.outputs.recorded != 'true' &&
        steps.size.outputs.phase != 'replayed' &&
        steps.dispatch.outputs.stops_here != 'true' &&
        steps.works.outputs.released_nothing != 'true' &&
        steps.lock_threads.outputs.held != 'true' &&
        steps.checkpoint.outputs.waiting != 'true' &&
        steps.open_draft.outputs.status != 'blocked' &&
        steps.notice_waiting.outcome != 'success' &&
        steps.finish.outcome != 'success' &&
        steps.release_plan.outcome != 'success' &&
        steps.record.outputs.status != 'stepped')) &&
        steps.result.outputs.posted != 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_NUM: >-
          ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number ||
          steps.context.outputs.issue_number }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ISSUE_NUM: ${{ steps.subject.outputs.number }}
        PR_NUMBER: ${{ steps.phase.outputs.pr_number || steps.open_draft.outputs.pr_number }}
        RUN_ID: ${{ github.run_id }}
        WATCHDOG_FIRED: ${{ steps.disarm_watchdog.outputs.fired }}
        WATCHDOG_CAUSE: ${{ steps.disarm_watchdog.outputs.cause }}
        WATCHDOG_REASON: ${{ steps.disarm_watchdog.outputs.reason }}
        PRESERVED: ${{ steps.preserve.outputs.preserved }}
        PRESERVE_REASON: ${{ steps.preserve.outputs.reason }}
        HELD: ${{ steps.hold_plan.outputs.held }}
        CEILING: ${{ steps.watchdog.outputs.ceiling }}
        KSAI_ASK: ${{ inputs.ask }}
        JIRA_KEY: ${{ steps.subject.outputs.jira_key || steps.context.outputs.jira_key }}
        PHASE: ${{ steps.size.outputs.phase }}
        COMMAND: ${{ steps.select.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishRunFailed } = require(`${process.env.SCRIPTS}/ksai/publish.cjs`);
          const { notices, warnings = [] } = await publishRunFailed({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);
          for (const line of warnings) core.warning(line);

    - name: Generate report
      id: report
      if: >-
        ${{ always() && (inputs.flow == 'review' || inputs.flow == 'run') &&
        steps.model_run.outputs.execution_file != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXECUTION_FILE: ${{ steps.model_run.outputs.execution_file }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const fs = require('node:fs');
          const { runSpend } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);
          let raw = '';
          try {
            raw = process.env.EXECUTION_FILE ? fs.readFileSync(process.env.EXECUTION_FILE, 'utf8') : '';
          } catch (error) {
            core.warning(`the execution log could not be read (${error.message}); the run report will say so.`);
          }
          const { warning, ...outputs } = runSpend(raw);
          if (warning) core.warning(warning);
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);

    - name: Load suppression rules
      id: suppressions
      if: >-
        ${{ always() && inputs.flow == 'review' && steps.report.outputs.has_output == 'true' &&
        inputs.suppressions_app_id != '' && inputs.suppressions_private_key != '' }}
      continue-on-error: true
      shell: bash
      env:
        KREVIEW_SUPPRESSIONS_APP_ID: ${{ inputs.suppressions_app_id }}
        KREVIEW_SUPPRESSIONS_PRIVATE_KEY: ${{ inputs.suppressions_private_key }}
        KREVIEW_SUPPRESSIONS_STORE: ${{ inputs.suppressions_store }}
        KREVIEW_SUPPRESSIONS_REF: ${{ inputs.suppressions_ref }}
        KREVIEW_REVIEWED_REPO: ${{ github.repository }}
        KREVIEW_SUPPRESSIONS_BUNDLE: ${{ runner.temp }}/kreview-suppressions.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/kreview/load-suppressions.mjs"
        echo "bundle=${KREVIEW_SUPPRESSIONS_BUNDLE}" >> "$GITHUB_OUTPUT"

    - name: Post review (Claude result)
      id: comment_result
      if: ${{ always() && inputs.flow == 'review' && steps.report.outputs.has_output == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RUN_RESULT: ${{ steps.report.outputs.run_result }}
        RUN_CONCLUSION: ${{ steps.report.outputs.conclusion }}
        REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        REVIEW_PROTOCOL: ${{ steps.report.outputs.review_protocol }}
        PUBLISH: ${{ inputs.publish }}
        COMMIT_ID: ${{ steps.checkout_pr.outputs.commit }}
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        SUPPRESSION_BUNDLE: ${{ steps.suppressions.outputs.bundle }}
        REVIEWER_ID: ${{ inputs.reviewer_id }}
        RUN_ID: gh:${{ github.repository }}:actions:${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}:${{ strategy.job-index || 0 }}
        RECORD_DIR: ${{ runner.temp }}/kreview-suppression
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const postReview = require(`${process.env.SCRIPTS}/kreview/post-review.cjs`);
          const { loadSuppressionRules, asJsonl, splitPublished } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);

          const published = await postReview({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            prNumber: Number(process.env.PR_NUMBER),
            commitId: process.env.COMMIT_ID,
            runResult: process.env.RUN_RESULT ?? '',
            conclusion: process.env.RUN_CONCLUSION ?? '',
            reviewStrategy: process.env.REVIEW_STRATEGY,
            protocol: JSON.parse(process.env.REVIEW_PROTOCOL || 'null'),
            publish: process.env.PUBLISH !== 'false',
            suppression: {
              rules: loadSuppressionRules({ bundlePath: process.env.SUPPRESSION_BUNDLE, core, fs }),
              reviewerId: process.env.REVIEWER_ID,
              runId: process.env.RUN_ID,
            },
          });

          const { fires, records, summary } = splitPublished(published);
          const dir = process.env.RECORD_DIR;
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'fires.jsonl'), asJsonl(fires));
          fs.writeFileSync(path.join(dir, 'findings.jsonl'), asJsonl(records));
          core.setOutput('record_dir', dir);
          core.setOutput('published', JSON.stringify(summary));

    - name: Upload suppression record
      if: ${{ always() && steps.comment_result.outputs.record_dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: kreview-suppression-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.comment_result.outputs.record_dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: warn

    - name: Record where the action spent its time
      id: phases
      if: ${{ always() }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/phases.mjs" --record || echo "The phase record could not be measured"

    - name: Write eval run record
      id: eval_record
      if: >-
        ${{ always() && ((inputs.flow == 'run' && steps.report.outcome == 'success') ||
        (inputs.flow == 'review' && (steps.report.outcome == 'success' ||
        steps.repo_rules.outcome == 'failure' ||
        steps.select_arm.outputs.stand_down_notice != '' ||
        (steps.triage.outputs.skip == 'true' && inputs.dry_run == 'false' &&
        steps.validate_args.outcome == 'success' &&
        steps.select_arm.outputs.error == '')))) }}
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PUBLISHED: ${{ steps.comment_result.outputs.published }}
        FLOW: ${{ inputs.flow }}
        PROFILE: ${{ steps.build_run.outputs.profile }}
        MODEL: ${{ steps.select_arm.outputs.model }}
        EFFORT: ${{ steps.select_arm.outputs.effort }}
        RUN_MODEL: ${{ steps.build_run.outputs.model }}
        RUN_EFFORT: ${{ steps.build_run.outputs.effort }}
        ENGINE: ${{ steps.engine.outputs.name }}
        SELECTED_BY: ${{ steps.select_arm.outputs.selected_by }}
        DIALS_ARM: ${{ inputs.dials_arm }}
        SHADOW: ${{ inputs.publish == 'false' && 'true' || 'false' }}
        TRIAGE_MODE: ${{ inputs.triage }}
        TRIAGE_TIER: ${{ steps.triage.outputs.tier }}
        TRIAGE_SKIP_BY: ${{ steps.triage.outputs.skip_by }}
        TRIAGE_SKILLS: ${{ steps.triage.outputs.skills }}
        TRIAGE_FILES: ${{ steps.triage.outputs.files }}
        TRIAGE_LINES: ${{ steps.triage.outputs.lines }}
        TRIAGE_RISK: ${{ steps.triage.outputs.risk }}
        TRIAGE_API_SURFACE: ${{ steps.triage.outputs.api_surface }}
        TRIAGE_SOURCE: ${{ steps.triage.outputs.source }}
        TRIAGE_POLICY_VERSION: ${{ steps.triage.outputs.policy_version }}
        TRIAGE_LOCAL_POLICY_VERSION: ${{ steps.triage.outputs.local_policy_version }}
        TRIAGE_CP_POLICY_VERSION: ${{ steps.triage.outputs.cp_policy_version }}
        TRIAGE_MISMATCH: ${{ steps.triage.outputs.mismatch }}
        REPO_RULES_ENABLED: ${{ steps.repo_rules.outputs.enabled }}
        REPO_RULES_MODE: ${{ steps.repo_rules.outputs.mode }}
        PLUGIN_REF: ${{ steps.plugin_ref.outputs.ref }}
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        COMMIT_ID: ${{ steps.checkout_pr.outputs.commit || (inputs.flow == 'run' && github.sha || '') }}
        BASE_REF: ${{ steps.base.outputs.ref }}
        CONCLUSION: >-
          ${{ steps.repo_rules.outcome == 'failure' && 'rules_rejected' ||
          steps.select_arm.outputs.stand_down_notice != '' && 'stood_down' ||
          steps.triage.outputs.skip == 'true' && 'triage_skipped' ||
          steps.report.outputs.conclusion }}
        COST: ${{ steps.report.outputs.total_cost }}
        REVIEW_PROTOCOL: ${{ steps.report.outputs.review_protocol }}
        HAS_RESULT: ${{ steps.report.outputs.has_result }}
        STOPPED_BY: ${{ steps.disarm_watchdog.outputs.cause }}
        ENDED_ON: ${{ steps.report.outputs.ended_on }}
        INPUT_TOKENS: ${{ steps.report.outputs.input_tokens }}
        OUTPUT_TOKENS: ${{ steps.report.outputs.output_tokens }}
        NUM_TURNS: ${{ steps.report.outputs.num_turns }}
        DURATION: ${{ steps.report.outputs.duration }}
        DENIALS: ${{ steps.report.outputs.permission_denials }}
        UNCACHED_INPUT_TOKENS: ${{ steps.report.outputs.uncached_input_tokens }}
        CACHE_READ_TOKENS: ${{ steps.report.outputs.cache_read_tokens }}
        CACHE_WRITE_TOKENS: ${{ steps.report.outputs.cache_write_tokens }}
        CACHE_WRITE_5M_TOKENS: ${{ steps.report.outputs.cache_write_5m_tokens }}
        CACHE_WRITE_1H_TOKENS: ${{ steps.report.outputs.cache_write_1h_tokens }}
        BILLED: ${{ steps.report.outputs.billed }}
        DENIED: ${{ steps.report.outputs.denied }}
        STAGES: ${{ steps.timeline.outputs.stages }}
        PHASES: ${{ steps.phases.outputs.phases }}
        CHANNEL_NOTES: ${{ steps.status_report.outputs.notes }}
        STATUS: ${{ steps.status_report.outputs.record }}
        RUN_RESULT: ${{ steps.report.outputs.run_result }}
        CLASSIFIER_MODEL: ${{ steps.verdict.outputs.model }}
        VERDICT: ${{ steps.verdict.outputs.verdict }}
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        CLASSIFIER_INPUT: ${{ steps.verdict.outputs.input_tokens }}
        CLASSIFIER_OUTPUT: ${{ steps.verdict.outputs.output_tokens }}
        CLASSIFIER_TURNS: ${{ steps.verdict.outputs.turns }}
        CLASSIFIER_DURATION: ${{ steps.verdict.outputs.duration }}
        ROUTE_COMMAND: ${{ steps.select_arm.outputs.command }}
        ROUTE_SURFACE: ${{ steps.select_arm.outputs.route_surface }}
        ROUTE_SOURCE: ${{ steps.select_arm.outputs.route_source }}
        JOB_INDEX: ${{ strategy.job-index || 0 }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP:-/tmp}/eval-run"
        mkdir -p "$dir"
        printf '%s' "${RUN_RESULT:-}" > "$dir/raw-output.txt"
        RECORD_OUT="$dir/run.json" node -e '
          const fs = require("node:fs");
          const { evalRunRecord } = require(process.env.SCRIPTS + "/kreview/publish.cjs");
          const record = evalRunRecord(process.env);
          fs.writeFileSync(process.env.RECORD_OUT, JSON.stringify(record) + "\n");
          console.log(JSON.stringify(record, null, 2));
        '
        spent=$(node -pe '
          const held = require(process.argv[1]);
          const parts = [
            held.usage?.measured === true ? held.usage.cost_usd : null,
            held.classifier?.cost_usd,
            held.arm?.status_cost_usd,
          ].filter((one) => one !== null && one !== undefined && Number.isFinite(Number(one)));
          parts.length ? String(Number(parts.reduce((total, one) => total + Number(one), 0).toFixed(6))) : "";
        ' "$dir/run.json")
        echo "spend_usd=${spent}" >> "$GITHUB_OUTPUT"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"

    - name: Upload eval run record
      if: ${{ always() && steps.eval_record.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: eval-run-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.eval_record.outputs.dir }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: warn

    - name: React on a posted review
      id: react_review
      if: >-
        ${{ always() && inputs.publish == 'true' && inputs.flow == 'review' &&
        steps.comment_result.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_ID: ${{ steps.context.outputs.comment_id }}
        THREAD_ROOT_ID: ${{ steps.context.outputs.thread_root_id }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { reactOnResult } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);
          await reactOnResult({ github, core, owner: context.repo.owner, repo: context.repo.repo, env: process.env });

    - name: Note that this run was cancelled
      id: cancellation
      if: ${{ cancelled() }}
      shell: bash
      run: echo 'cancelled=true' >> "$GITHUB_OUTPUT"

    - name: Comment PR (run report)
      id: comment_report
      if: >-
        ${{ inputs.publish == 'true' && always() && inputs.flow == 'review' &&
        steps.report.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        RUN_ID: ${{ github.run_id }}
        COMMAND: ${{ steps.select_arm.outputs.command }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        CANCELLED: ${{ steps.cancellation.outputs.cancelled }}
        SELECT_ERROR: ${{ steps.select_arm.outputs.error }}
        BUILD_ERROR: ${{ steps.build_review.outputs.error }}
        STAND_DOWN: ${{ steps.select_arm.outputs.stand_down_notice }}
        DRY_RUN: ${{ inputs.dry_run }}
        VALIDATE_OUTCOME: ${{ steps.validate_args.outcome }}
        PARSE_OUTCOME: ${{ steps.prompt.outcome }}
        AUTHORIZED: ${{ steps.authz.outputs.ok }}
        TRIAGE_SKIP: ${{ steps.triage.outputs.skip }}
        TRIAGE_SKIP_REASON: ${{ steps.triage.outputs.skip_reason }}
        SELECT_OUTCOME: ${{ steps.select_arm.outcome }}
        SELECT_SKIPPED: ${{ steps.select_arm.outputs.skipped }}
        RESULT_OUTCOME: ${{ steps.comment_result.outcome }}
        WATCHDOG_FIRED: ${{ steps.disarm_watchdog.outputs.fired }}
        WATCHDOG_CAUSE: ${{ steps.disarm_watchdog.outputs.cause }}
        WATCHDOG_REASON: ${{ steps.disarm_watchdog.outputs.reason }}
        CEILING: ${{ steps.watchdog.outputs.ceiling }}
        STOP_REASON: ${{ steps.report.outputs.stop_reason }}
        ENDED_ON: ${{ steps.report.outputs.ended_on }}
        RULES_NOTICE: ${{ steps.repo_rules.outputs.rejection }}
        CONCLUSION: ${{ steps.report.outputs.conclusion }}
        COMMIT_ID: ${{ steps.checkout_pr.outputs.commit }}
        MODEL: ${{ steps.select_arm.outputs.model }}
        EFFORT: ${{ steps.select_arm.outputs.effort }}
        ENGINE: ${{ steps.engine.outputs.name }}
        SELECTED_BY: ${{ steps.select_arm.outputs.selected_by }}
        DIALS_ARM: ${{ inputs.dials_arm }}
        REQUESTER: ${{ steps.context.outputs.commenter }}
        TRIAGE_MODE: ${{ inputs.triage }}
        TRIAGE_FILES: ${{ steps.triage.outputs.files }}
        TRIAGE_LINES: ${{ steps.triage.outputs.lines }}
        TRIAGE_RISK: ${{ steps.triage.outputs.risk }}
        TRIAGE_API_SURFACE: ${{ steps.triage.outputs.api_surface }}
        TRIAGE_SKILLS: ${{ steps.triage.outputs.skills }}
        TRIAGE_TIER: ${{ steps.triage.outputs.tier }}
        TRIAGE_WHY: ${{ steps.triage.outputs.why }}
        TRIAGE_SOURCE: ${{ steps.triage.outputs.source }}
        TRIAGE_POLICY_VERSION: ${{ steps.triage.outputs.policy_version }}
        TRIAGE_LOCAL_POLICY_VERSION: ${{ steps.triage.outputs.local_policy_version }}
        TRIAGE_CP_POLICY_VERSION: ${{ steps.triage.outputs.cp_policy_version }}
        TRIAGE_MISMATCH: ${{ steps.triage.outputs.mismatch }}
        REPO_RULES_MODE: ${{ steps.repo_rules.outputs.mode }}
        REPO_RULES_ENABLED: ${{ steps.repo_rules.outputs.enabled }}
        REPO_RULES_PATH: ${{ steps.repo_rules.outputs.path }}
        REPO_RULES_SHA: ${{ steps.repo_rules.outputs.sha }}
        REPO_RULES_BYTES: ${{ steps.repo_rules.outputs.bytes }}
        REPO_RULES_PACKS: ${{ steps.repo_rules.outputs.packs }}
        PLUGIN_REF: ${{ steps.plugin_ref.outputs.ref }}
        PROMPT_REPORT: ${{ steps.select_arm.outputs.prompt_content_report }}
        REVIEW_PROTOCOL: ${{ steps.report.outputs.review_protocol }}
        HAS_RESULT: ${{ steps.report.outputs.has_result }}
        DURATION: ${{ steps.report.outputs.duration }}
        NUM_TURNS: ${{ steps.report.outputs.num_turns }}
        INPUT_TOKENS: ${{ steps.report.outputs.input_tokens }}
        OUTPUT_TOKENS: ${{ steps.report.outputs.output_tokens }}
        UNCACHED_INPUT_TOKENS: ${{ steps.report.outputs.uncached_input_tokens }}
        CACHE_READ_TOKENS: ${{ steps.report.outputs.cache_read_tokens }}
        CACHE_WRITE_TOKENS: ${{ steps.report.outputs.cache_write_tokens }}
        DENIALS: ${{ steps.report.outputs.permission_denials }}
        COST: ${{ steps.report.outputs.total_cost }}
        CLASSIFIER_MODEL: ${{ steps.verdict.outputs.model }}
        VERDICT: ${{ steps.verdict.outputs.verdict }}
        CLASSIFIER_COST: ${{ steps.verdict.outputs.cost }}
        CLASSIFIER_INPUT: ${{ steps.verdict.outputs.input_tokens }}
        CLASSIFIER_OUTPUT: ${{ steps.verdict.outputs.output_tokens }}
        CLASSIFIER_TURNS: ${{ steps.verdict.outputs.turns }}
        CLASSIFIER_DURATION: ${{ steps.verdict.outputs.duration }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        START_COMMENT_ID: ${{ steps.notice_started.outputs.comment_id }}
        CHANNEL_NOTES: ${{ steps.status_report.outputs.notes }}
        STATUS: ${{ steps.status_report.outputs.record }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishRunReport } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);
          const { outputs, notices } = await publishRunReport({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const [name, value] of Object.entries(outputs)) core.setOutput(name, value);
          for (const line of notices) core.info(line);

    - name: Comment PR (nothing was reviewed)
      id: review_notice
      if: ${{ inputs.publish == 'true' && always() && !cancelled() && inputs.flow == 'review' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        PR_NUMBER: ${{ steps.context.outputs.issue_number }}
        SELECT_ERROR: ${{ steps.select_arm.outputs.error }}
        SELECT_ERROR_NOTICE: ${{ steps.select_arm.outputs.rejection }}
        BUILD_ERROR: ${{ steps.build_review.outputs.error }}
        STAND_DOWN: ${{ steps.select_arm.outputs.stand_down_notice }}
        DRY_RUN: ${{ inputs.dry_run }}
        VALIDATE_OUTCOME: ${{ steps.validate_args.outcome }}
        PARSE_OUTCOME: ${{ steps.prompt.outcome }}
        AUTHORIZED: ${{ steps.authz.outputs.ok }}
        TRIAGE_SKIP: ${{ steps.triage.outputs.skip }}
        TRIAGE_SKIP_REASON: ${{ steps.triage.outputs.skip_reason }}
        SELECT_OUTCOME: ${{ steps.select_arm.outcome }}
        SELECT_SKIPPED: ${{ steps.select_arm.outputs.skipped }}
        RESULT_OUTCOME: ${{ steps.comment_result.outcome }}
        WATCHDOG_FIRED: ${{ steps.disarm_watchdog.outputs.fired }}
        WATCHDOG_CAUSE: ${{ steps.disarm_watchdog.outputs.cause }}
        WATCHDOG_REASON: ${{ steps.disarm_watchdog.outputs.reason }}
        TRIGGER: ${{ inputs.trigger_phrase }}
        CEILING: ${{ steps.watchdog.outputs.ceiling }}
        STOP_REASON: ${{ steps.report.outputs.stop_reason }}
        RULES_NOTICE: ${{ steps.repo_rules.outputs.rejection }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        COMMAND: ${{ steps.select_arm.outputs.command }}
        ROUTE_SOURCE: ${{ steps.select_arm.outputs.route_source }}
        REPORT_PUBLISHED: ${{ steps.comment_report.outputs.published }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { publishReviewNotice } = require(`${process.env.SCRIPTS}/kreview/publish.cjs`);
          const { notices } = await publishReviewNotice({
            github,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);

    - name: Remove the comment the run opened with
      if: >-
        ${{ inputs.flow == 'review' && inputs.publish == 'true' && always() &&
        steps.notice_started.outputs.comment_id != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_ID: ${{ steps.notice_started.outputs.comment_id }}
        REVIEW_REPLACED: ${{ steps.comment_report.outputs.replaced }}
        RESULT_REPLACED: ${{ steps.result.outputs.replaced }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        github-token: ${{ inputs.source_org_github_token }}
        script: |
          const { dropRunStart } = require(`${process.env.SCRIPTS}/ksai/run-start.cjs`);
          const { notices } = await dropRunStart({
            github,
            core,
            owner: context.repo.owner,
            repo: context.repo.repo,
            env: process.env,
          });
          for (const line of notices) core.info(line);

    - name: Replay the tool calls as spans
      if: >-
        ${{ always() && steps.engine.outputs.name == 'opencode' && inputs.otel_headers != '' &&
        (steps.opencode.outputs.events_file != '' || steps.opencode_test.outputs.events_file != '') }}
      continue-on-error: true
      shell: bash
      env:
        EVENTS_FILE: ${{ steps.opencode.outputs.events_file || steps.opencode_test.outputs.events_file }}
        OPENCODE_CHILDREN_FILE: ${{ steps.opencode.outputs.children_file }}
        RUN_OUTCOME: ${{ steps.opencode.outcome == 'failure' && 'failure' || steps.opencode_test.outcome == 'failure' && 'failure' || '' }}
        ENGINE: ${{ steps.engine.outputs.name }}
        FLOW: ${{ inputs.flow }}
        MODEL: ${{ steps.write_arm.outputs.model || steps.select_test.outputs.model || steps.select_arm.outputs.model || steps.build_run.outputs.model }}
        VARIANT: ${{ steps.write_arm.outputs.effort || steps.select_test.outputs.effort || steps.select_arm.outputs.effort || steps.build_run.outputs.effort }}
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/tool-spans.mjs"

    - name: Report what this run spent as metrics
      if: >-
        ${{ always() && inputs.otel_headers != '' && steps.model_run.outputs.execution_file != '' }}
      continue-on-error: true
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.model_run.outputs.execution_file }}
        ENGINE: ${{ steps.engine.outputs.name }}
        FLOW: ${{ inputs.flow }}
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        MODEL: ${{ steps.write_arm.outputs.model || steps.select_test.outputs.model || steps.select_arm.outputs.model || steps.build_run.outputs.model }}
        VARIANT: ${{ steps.write_arm.outputs.effort || steps.select_test.outputs.effort || steps.select_arm.outputs.effort || steps.build_run.outputs.effort }}
        SPEND_COST: >-
          ${{ steps.write_report.outputs.spend_usd || steps.write_progress.outputs.spend_usd ||
          steps.write_comment.outputs.spend_usd || steps.eval_record.outputs.spend_usd ||
          steps.test_artifact.outputs.spend_usd }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/ksai/run-metrics.mjs"

    - name: Report what the watchdog did
      if: >-
        ${{ always() && inputs.otel_headers != '' && steps.watchdog.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        WATCHDOG_ARMED_AT_MS: ${{ steps.watchdog.outputs.armed_at_ms }}
        WATCHDOG_KILL_AT_MS: ${{ steps.watchdog.outputs.kill_at_ms }}
        WATCHDOG_FIRED: ${{ steps.disarm_watchdog.outputs.fired }}
        WATCHDOG_CAUSE: ${{ steps.disarm_watchdog.outputs.cause }}
        WATCHDOG_MISSED: ${{ steps.disarm_watchdog.outputs.missed }}
        WATCHDOG_UNWATCHED: ${{ steps.disarm_watchdog.outputs.unwatched }}
        WATCHDOG_OVERRUN: ${{ steps.disarm_watchdog.outputs.overrun }}
        ENGINE: ${{ steps.engine.outputs.name }}
        FLOW: ${{ inputs.flow }}
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        MODEL: ${{ steps.write_arm.outputs.model || steps.select_test.outputs.model || steps.select_arm.outputs.model || steps.build_run.outputs.model }}
        VARIANT: ${{ steps.write_arm.outputs.effort || steps.select_test.outputs.effort || steps.select_arm.outputs.effort || steps.build_run.outputs.effort }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: >-
          team=${{ steps.telemetry.outputs.team }},repo=${{ github.repository }},workflow=${{
          steps.telemetry.outputs.workflow }}${{ inputs.otel_extra_attributes != '' &&
          format(',{0}', inputs.otel_extra_attributes) || '' }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/ksai/watchdog-report.mjs"

    - name: Report what this run cost
      if: >-
        ${{ always() && inputs.fleet_dials_endpoint != '' &&
        (steps.write_report.outputs.spend_usd != '' || steps.write_progress.outputs.spend_usd != '' ||
        steps.write_comment.outputs.spend_usd != '' || steps.eval_record.outputs.spend_usd != '' ||
        steps.test_artifact.outputs.spend_usd != '') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SPEND_ENDPOINT: ${{ inputs.fleet_dials_endpoint }}
        SPEND_ATTEMPT: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}:${{ strategy.job-index || 0 }}
        SPEND_COST: >-
          ${{ steps.write_report.outputs.spend_usd || steps.write_progress.outputs.spend_usd ||
          steps.write_comment.outputs.spend_usd || steps.eval_record.outputs.spend_usd ||
          steps.test_artifact.outputs.spend_usd }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      with:
        script: |
          const { reportSpend } = await import(`file://${process.env.SCRIPTS}/ksai/report-spend.mjs`);
          const answer = await reportSpend({
            endpoint: process.env.SPEND_ENDPOINT,
            attempt: process.env.SPEND_ATTEMPT,
            cost: process.env.SPEND_COST,
            mint: (audience) => core.getIDToken(audience),
            secret: (token) => core.setSecret(token),
          });
          if (answer.reported) {
            core.notice(`ksai reported $${process.env.SPEND_COST} against this repository's budget`);
          } else if (answer.why) {
            core.notice(`ksai did not report what this run cost: ${answer.why}`);
          }

    - name: Report where the action spent its time
      if: ${{ always() }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        PHASES_FILE: ${{ runner.temp }}/ksai-phases.tsv
      run: |
        set -euo pipefail
        echo "::group::Where the action spent its time"
        node "${SCRIPTS}/ksai/phases.mjs" || echo "The phase timings could not be measured"
        echo "::endgroup::"

    - name: Put this action back for the post phase
      if: ${{ always() && steps.save_self.outputs.at != '' }}
      shell: bash
      env:
        AT: ${{ steps.save_self.outputs.at }}
        STASH: ${{ steps.save_self.outputs.stash }}
      run: |
        set -euo pipefail
        root=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        target="${GITHUB_WORKSPACE}/${AT}"
        ancestor="$target"
        while [ ! -d "$ancestor" ]; do
          ancestor=$(dirname -- "$ancestor")
        done
        real_ancestor=$(cd "$ancestor" && pwd -P)
        case "$real_ancestor" in
          "$root" | "$root"/*) ;;
          *)
            echo "::error::${AT} resolves to ${real_ancestor}, outside the workspace, so this action was not put back"
            exit 1
            ;;
        esac
        mkdir -p -- "$target"
        real=$(cd "$target" && pwd -P)
        case "$real" in
          "$root" | "$root"/*) ;;
          *)
            echo "::error::${AT} resolves to ${real}, outside the workspace, so this action was not put back"
            exit 1
            ;;
        esac
        rm -f -- "${real}/action.yml"
        cp "${STASH}/action.yml" "${real}/action.yml"
