name: KSAI
description: Run one control-plane admitted KSAI v5 package stage.
inputs:
  control_plane_endpoint:
    description: Base URL of the control plane that serves this repository's run settings and dispatch records, with no
      trailing path
    required: true
  opencode_version:
    description: npm version of the OpenCode 2 engine this run installs, with no `v` prefix. The action accepts only
      `@opencode/cli` 2.x releases. Pinned rather than latest, because that CLI cuts releases daily and an unpinned
      reviewer is a different reviewer every run.
    required: true
  kong_org_github_token:
    description: github token for the Kong org; checks out this action's trusted scripts from the ksai source repository
    required: true
  anthropic_base_url:
    description: Every model call goes to this Kong gateway origin. The gateway validates a GitHub OIDC token that the
      runtime renews before expiry. Empty is refused rather than falling back to api.anthropic.com. The value must start
      with https:// and name an origin rather than an endpoint. A value that ends in /v1 is refused.
    required: true
  record_id:
    description: The dispatch record the control plane named, or empty. A record naming `fix` and a label starts a run
      nobody typed, authorized as whoever applied that label, and only while the pull request still carries it at the
      head the record was decided for
    required: true
  source_org_github_token:
    description: read-only github token for the source repository and pull request base
    required: true
  otel_endpoint:
    description: OTLP HTTP endpoint for the metrics, and on the opencode engine the traces and log lines, this run exports;
      defaults to Datadog's direct OTLP intake, org-wide
    required: false
    default: https://otlp.datadoghq.com
  otel_headers:
    description: OTLP auth header, e.g. dd-api-key=<value of the KSAI_DATADOG_KEY secret>; the actual on/off switch, since
      telemetry is skipped whenever this is empty. Composite actions have no secrets context of their own, so a caller
      must pass this - never write a live Actions expression referencing secrets anywhere in this file, since the
      manifest parser evaluates those in every string field, descriptions included, and fails to load the whole action
      when it does
    required: false
    default: ""
  denied_paths:
    description: newline- or comma-separated paths that the control plane forbids the stage to change
    required: true
  job_timeout_minutes:
    description: "the calling job's own `timeout-minutes`. A watchdog stops the CLI one minute before GitHub would cancel
      the job, which is the difference between a run that reports what happened and one that vanishes: a cancellation
      kills the model run before it reduces its event stream to the execution log, and the artifact, the cost record and
      the notice are all read off that log, so they are lost together. This takes no default, because an action cannot
      read its caller's `timeout-minutes` and with a numeric default a caller that agreed with 35 and a caller that
      never looked were the same run. Leaving it unset still arms the watchdog at an assumed 35, so a consumer that
      changed nothing keeps its salvage path, and the run carries a warning annotation naming the assumption. Set it to
      0 to disable the watchdog entirely. It cannot help a `cancel-in-progress` cancellation, which GitHub delivers with
      no warning."
    required: true
  max_consecutive_tool_failures:
    description: "how many tool calls may fail in a row before the watchdog stops the run. The number is high because
      `is_error` means the shell exited non-zero rather than that the call failed: a search matching nothing exits 1,
      and a sandbox writing its own denied scratch path marks a command that ran and printed its output. Measured over
      7600 real sessions, 2.4 percent reach ten failures in a row and 20 percent of the sessions that delegate to
      subagents do, with the longest healthy run at 43. A run that is genuinely stuck fails without bound, so it reaches
      any limit; raising this trades a false stop for a couple of minutes of detection, which is the cheap direction.
      Set it to 0 to turn the check off."
    required: true
  max_repeated_tool_calls:
    description: "how many times the same tool may run with identical input, one call after another, before the watchdog
      stops the run. This is the loop the failure count cannot see: every call succeeds, so nothing is failing, and the
      run reads the same file or runs the same command until the job ceiling. Only an unbroken run counts - any other
      tool call in between resets it - so a command re-run after an edit is not a loop. It compares the whole input
      rather than the summary line, and the key order a model wrote it in does not matter. Set it to 0 to turn the check
      off."
    required: true
  artifact_retention_days:
    description: "how long the execution log and the event stream are kept. The default is the
      runtime evidence window, and it is the caller's to lower because only the caller knows its own cap: a repository
      or organization that allows fewer days clamps the request and annotates every upload with a warning, so an action
      that asked for more than it can have said the wrong number three times a run and kept the artifact for the shorter
      period anyway. Raising it lengthens how long a downloadable copy of the review text exists, which is the reason it
      is bounded at all."
    required: false
    default: "14"
outputs:
  conclusion:
    description: "`success` or `failure`, from the model run; empty when no model ran. The package stage reads it, because
      the action does not publish the stage result. A refused governed request reads `failure`."
    value: ${{ steps.concluded.outputs.conclusion }}
  execution_file:
    description: path to the package stage model log; empty when no model ran
    value: ${{ steps.model_run.outputs.execution_file }}
runs:
  using: composite
  steps:
    - name: Save this action for the post phase
      id: save_self
      shell: bash
      env:
        SELF: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "${SELF}/" in
          "${GITHUB_WORKSPACE}"/*) ;;
          *)
            echo "This action was referenced by ref, so no checkout can overwrite it."
            exit 0
            ;;
        esac
        stash="${RUNNER_TEMP}/ksai-self-action/$(printf '%s' "$SELF" | cksum | cut -d' ' -f1)"
        rm -rf -- "$stash"
        mkdir -p "$stash"
        cp "${SELF}/action.yml" "${stash}/action.yml"
        printf 'at=%s\n' "${SELF#"${GITHUB_WORKSPACE}"/}" >> "$GITHUB_OUTPUT"
        printf 'stash=%s\n' "$stash" >> "$GITHUB_OUTPUT"
    - name: Set the control-plane routes
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ENDPOINT: ${{ inputs.control_plane_endpoint }}
      with:
        script: |
          core.exportVariable('KSAI_CP_ENDPOINT', process.env.ENDPOINT);
    - name: Validate the OpenCode runtime
      id: runtime
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
      run: >
        set -euo pipefail

        case "${OPENCODE_VERSION}" in
          2.*) ;;
          *)
            echo "::error::opencode_version: ${OPENCODE_VERSION} names no OpenCode line this action runs - pin a 2.x release"
            exit 1
            ;;
        esac
    - name: Resolve runtime ref
      id: runtime_ref
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        echo "ref=${ACTION_REF}" >> "$GITHUB_OUTPUT"
        at=$(date +%s%3N)
        echo "started_at_ms=${at}" >> "$GITHUB_OUTPUT"
        # The same instant the stage report measures `setup_ms` from, so both reports share an origin.
        printf '%s\t%s\n' "$at" "resolve" >> "${RUNNER_TEMP}/ksai-phases.tsv" || true
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      name: checkout trusted authz action
      id: checkout_authz
      if: ${{ steps.runtime_ref.outcome == 'success' }}
      with:
        token: ${{ inputs.kong_org_github_token }}
        path: _ksai
        repository: Kong/ksai-public
        ref: ${{ steps.runtime_ref.outputs.ref }}
        sparse-checkout: |
          .github/actions/dispatch-record
          .github/actions/run-token
          .github/scripts
        persist-credentials: false
    - name: Stage trusted scripts outside the workspace
      id: staged_scripts
      if: ${{ steps.checkout_authz.outcome == 'success' }}
      shell: bash
      env:
        DEST: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        rm -rf -- "$DEST"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/scripts" "$DEST"
        echo "sha=$(git -C "${GITHUB_WORKSPACE}/_ksai" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/actions/dispatch-record" "${DEST}/dispatch-record"
        cp -R -- "${GITHUB_WORKSPACE}/_ksai/.github/actions/run-token" "${DEST}/run-token"
        find "$DEST" -name '*.test.mjs' -delete
    - name: Keep the trusted checkout out of the caller's commits
      id: exclude_ksai
      if: ${{ steps.checkout_authz.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        git_dir="${GITHUB_WORKSPACE}/.git"
        if [[ ! -d "${git_dir}" || -L "${git_dir}" || -L "${git_dir}/info" ]]; then
          echo "The workspace root is not a repository, so no commit of the caller's can stage _ksai"
          exit 0
        fi
        mkdir -p "${git_dir}/info"
        if ! grep -qxF '_ksai/' "${git_dir}/info/exclude" 2>/dev/null; then
          echo '_ksai/' >> "${git_dir}/info/exclude"
        fi
    - name: Start installing the stage tools
      id: stage_tools
      if: ${{ steps.staged_scripts.outcome == 'success' }}
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/kreview/stage-tools.mjs" start
    - name: Validate anthropic_base_url
      if: ${{ steps.checkout_authz.outcome == 'success' }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
      run: >
        set -euo pipefail

        if [[ ! "${ANTHROPIC_BASE_URL}" =~ ^https:// ]]; then
          echo "::error::anthropic_base_url must start with https:// - every model call this action makes and its OIDC exchange go to it, whichever engine runs, and empty takes the run off Kong AI Gateway rather than falling back to Anthropic, got: ${ANTHROPIC_BASE_URL}"
          exit 1
        fi


        if [[ "${ANTHROPIC_BASE_URL}" =~ /v1/*$ ]]; then
          echo "::error::anthropic_base_url names an endpoint rather than an origin - the version segment is appended by every caller, so this would be called at it again. Drop the /v1, got: ${ANTHROPIC_BASE_URL}"
          exit 1
        fi
    - name: Read the dispatch record
      id: dispatch_record
      if: ${{ steps.checkout_authz.outcome == 'success' && inputs.record_id != '' }}
      uses: ./_ksai/.github/actions/dispatch-record # zizmor: ignore[self-repository]
      with:
        endpoint: ${{ inputs.control_plane_endpoint }}
        record_id: ${{ inputs.record_id }}
    - name: Fetch the base of the pull request a package stage reads
      id: review_base
      if: ${{ steps.dispatch_record.outcome == 'success' && steps.dispatch_record.outputs.stage_pull != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        ISSUE_NUM: ${{ steps.dispatch_record.outputs.stage_pull }}
        SOURCE_REPO: ${{ github.repository }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/review-base.mjs"
    - name: Collect facts for the control-plane run plan
      id: steering
      if: ${{ steps.dispatch_record.outputs.workflow_job != '' }}
      shell: bash
      env:
        CONTROL_PLANE_ENDPOINT: ${{ inputs.control_plane_endpoint }}
        RECORD_ID: ${{ steps.dispatch_record.outputs.record_id }}
        SOURCE_REVISION: ${{ steps.dispatch_record.outputs.source_revision }}
        WORKFLOW_JOB: ${{ steps.dispatch_record.outputs.workflow_job }}
        WORKFLOW_INSTANCE: ${{ steps.dispatch_record.outputs.workflow_instance }}
        WORKFLOW_ATTEMPT: ${{ steps.dispatch_record.outputs.workflow_attempt }}
        WORKFLOW_LEASE: ${{ steps.dispatch_record.outputs.workflow_lease }}
        STEERING_FILE: ${{ steps.dispatch_record.outputs.workflow_steering_file }}
        STEERING_DIGEST: ${{ steps.dispatch_record.outputs.workflow_steering_sha256 }}
        STAGE_PULL: ${{ steps.dispatch_record.outputs.stage_pull }}
        STAGE_ISSUE: ${{ steps.dispatch_record.outputs.stage_issue }}
        STAGE_WORK_REF: ${{ steps.dispatch_record.outputs.stage_work_ref }}
        PLAN_PATH: ${{ steps.dispatch_record.outputs.plan_path }}
        REVIEW_BASE_REF: ${{ steps.review_base.outputs.ref }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/steering.mjs"
    - name: Resolve what the caller's prompt may touch
      id: build_run
      if: ${{ steps.steering.outputs.run == 'true' }}
      shell: bash
      env:
        MODEL: ${{ steps.steering.outputs.model }}
        EFFORT: ${{ steps.steering.outputs.effort }}
        PROMPT_ID: ${{ steps.steering.outputs.prompt_id }}
        PROMPT_SINK: ${{ steps.steering.outputs.prompt_sink }}
        STAGE_PROFILE: ${{ steps.steering.outputs.profile }}
        STAGE_PHASE: ${{ steps.steering.outputs.phase }}
        OPENCODE_ALLOWED: ${{ steps.steering.outputs.allowed_tools }}
        OPENCODE_DISALLOWED: ${{ steps.steering.outputs.disallowed_tools }}
        WORKFLOW_JOB: ${{ steps.dispatch_record.outputs.workflow_job }}
        WORKFLOW_INSTANCE: ${{ steps.dispatch_record.outputs.workflow_instance }}
        WORKFLOW_ATTEMPT: ${{ steps.dispatch_record.outputs.workflow_attempt }}
        WORKFLOW_LEASE: ${{ steps.dispatch_record.outputs.workflow_lease }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/run-flow.mjs"
    - name: Keep the trusted checkout out of the tree a package stage reads
      if: ${{ steps.steering.outcome == 'success' }}
      shell: bash
      run: rm -rf -- "${GITHUB_WORKSPACE}/_ksai"
    - name: Merge the base the control plane named, uncommitted, for the stage to resolve
      id: merge_base
      if: ${{ steps.build_run.outcome == 'success' && steps.dispatch_record.outputs.merge_base != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.source_org_github_token }}
        SOURCE_REPO: ${{ github.repository }}
        BOUND_HEAD_SHA: ${{ steps.dispatch_record.outputs.source_revision }}
        MERGE_BASE: ${{ steps.dispatch_record.outputs.merge_base }}
        KSAI_GIT_FILEMODE: "true"
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/workflow/merge.mjs"
    - name: Render the package stage prompt through the control plane
      id: governed_run
      if: ${{ steps.build_run.outcome == 'success' }}
      shell: bash
      env:
        REQUEST_FILE: ${{ steps.build_run.outputs.request_file }}
        GOVERNED_NAME: run
        OPENCODE_ALLOWED: ${{ steps.build_run.outputs.allowed_tools }}
        OPENCODE_DISALLOWED: ${{ steps.build_run.outputs.disallowed_tools }}
        PROMPT_FILE: ${{ steps.build_run.outputs.file }}
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/kreview/governed-request.mjs" flow
    - name: Wait for the stage tools
      id: opencode_install
      if: ${{ steps.build_run.outcome == 'success' }}
      shell: bash
      env:
        OPENCODE_VERSION: ${{ inputs.opencode_version }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/kreview/stage-tools.mjs" wait
    - name: Compute model cost-attribution headers
      id: model_headers
      if: ${{ steps.build_run.outcome == 'success' }}
      shell: bash
      env:
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        ACTOR: ${{ github.actor }}
        ACTION: ksai:run-${{ steps.build_run.outputs.profile }}
        MODEL: ${{ steps.build_run.outputs.model }}
        EFFORT: ${{ steps.build_run.outputs.effort }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: |
        set -euo pipefail
        node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/attribution.mjs"
    - name: Prepare what a governed prompt is verified with
      id: governance_prepare
      if: ${{ steps.governed_run.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/governance/prepare.mjs"
    - name: Warm the locked Node dependencies while there is still a network
      id: package_warm
      if: ${{ steps.opencode_install.outcome == 'success' && steps.governed_run.outcome == 'success' &&
        steps.dispatch_record.outputs.prepare_dependencies == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        OTEL_EXPORTER_OTLP_HEADERS: ""
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/package-warm.mjs"
    - name: Look for the Go modules the tree under work holds
      id: go_detect
      if: ${{ steps.opencode_install.outcome == 'success' && steps.governed_run.outcome == 'success' &&
        steps.dispatch_record.outputs.prepare_dependencies == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/gomod-warm.mjs" detect
    - name: Set up the Go the tree under work pins
      id: go_setup
      if: ${{ steps.go_detect.outputs.mod != '' }}
      continue-on-error: true
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.go_detect.outputs.mod }}
        cache: false
    - name: Warm the Go module cache while there is still a network
      id: go_warm
      if: ${{ steps.go_setup.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        LIST: ${{ steps.go_detect.outputs.list }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        GH_TOKEN: ""
        GITHUB_TOKEN: ""
        OTEL_EXPORTER_OTLP_HEADERS: ""
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/gomod-warm.mjs"
    - name: Set up mise for the tools the tree under work pins
      id: mise_setup
      if: ${{ steps.opencode_install.outcome == 'success' && steps.governed_run.outcome == 'success' &&
        steps.dispatch_record.outputs.prepare_tools == 'true' }}
      continue-on-error: true
      uses: Kong/jdx-mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        install: false
        cache: false
        env: false
        add_shims_to_path: false
        working_directory: ${{ runner.temp }}
    - name: Install the tools the tree under work pins, fenced off the runner
      id: mise_tools
      if: ${{ steps.mise_setup.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      env:
        WORKSPACE: ${{ github.workspace }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/ksai/mise-tools.mjs"
    - name: Mint the bearer this review starts on
      id: mint
      if: ${{ steps.opencode_install.outcome == 'success' }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/ksai/deadline-command.mjs" -- node "${SCRIPTS}/kreview/gateway-token.mjs"
    - name: Run opencode
      id: opencode
      if: ${{ steps.mint.outcome == 'success' && steps.governed_run.outcome == 'success' }}
      shell: bash
      env:
        PROMPT_FILE: ${{ steps.build_run.outputs.file }}
        KSAI_OUTCOME_EXPECTED: "true"
        MODEL: ${{ steps.build_run.outputs.model }}
        VARIANT: ${{ steps.build_run.outputs.effort }}
        OPENCODE_HOME: ${{ runner.temp }}/opencode-home
        OPENCODE_VERSION: ${{ steps.opencode_install.outputs.version }}
        KSAI_GOVERNED_DIR: ${{ steps.governance_prepare.outputs.dir }}
        ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
        KSAI_MODEL_TOKEN: ${{ steps.mint.outputs.token }}
        KSAI_MODEL_TOKEN_EXPIRES_AT: ${{ steps.mint.outputs.expires_at }}
        EVENTS_FILE: ${{ runner.temp }}/opencode-events.jsonl
        EXECUTION_FILE: ${{ runner.temp }}/opencode-execution.json
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        KSAI_CHANNEL_FLOW: run
        FLOW: run
        OPENCODE_PHASE: ${{ steps.build_run.outputs.phase }}
        KSAI_JOB_INDEX: ${{ strategy.job-index || 0 }}
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otel_endpoint }}
        OTEL_EXPORTER_OTLP_HEADERS: ${{ inputs.otel_headers }}
        OTEL_RESOURCE_ATTRIBUTES: repo=${{ github.repository }},workflow=${{ github.workflow }},intent_command=workflow-stage
        REQUEST_FILE: ${{ steps.governed_run.outputs.request_file }}
        DENIED_PATHS: ${{ inputs.denied_paths }}
        OPENCODE_ALLOWED: ${{ steps.build_run.outputs.allowed_tools }}
        OPENCODE_DISALLOWED: ${{ steps.build_run.outputs.disallowed_tools }}
        REPO: ${{ github.repository }}
        JOB_TIMEOUT_MINUTES: ${{ steps.dispatch_record.outputs.stage_minutes || inputs.job_timeout_minutes }}
        KSAI_JOB_STARTED_AT_MS: ${{ steps.runtime_ref.outputs.started_at_ms }}
        ATTRIBUTION_HEADERS: ${{ steps.model_headers.outputs.value }}
        MAX_CONSECUTIVE_FAILURES: ${{ inputs.max_consecutive_tool_failures }}
        MAX_REPEATED_CALLS: ${{ inputs.max_repeated_tool_calls }}
      working-directory: ${{ runner.temp }}
      run: node "${SCRIPTS}/kreview/link-host.mjs"
    - name: Say how the model run ended, whichever engine ran it
      id: model_run
      if: ${{ always() && steps.opencode.outcome != 'skipped' }}
      shell: bash
      env:
        CONCLUSION: ${{ steps.opencode.outputs.conclusion }}
        OUTCOME: ${{ steps.opencode.outcome }}
        EXECUTION: ${{ steps.opencode.outputs.execution_file }}
        STOPPED: ${{ steps.opencode.outputs.stopped }}
        STOPPED_BY: ${{ steps.opencode.outputs.stopped_by }}
        STOPPED_BECAUSE: ${{ steps.opencode.outputs.stopped_because }}
        FAILED_BECAUSE: ${{ steps.opencode.outputs.stopped_by == '' && steps.opencode.outputs.error || '' }}
        CEILING: ${{ steps.opencode.outputs.ceiling }}
        MODEL_NEVER_ASKED: ${{ steps.opencode.outputs.model_never_asked }}
      run: |
        set -euo pipefail
        echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
        echo "outcome=${OUTCOME}" >> "$GITHUB_OUTPUT"
        echo "execution_file=${EXECUTION}" >> "$GITHUB_OUTPUT"
        echo "stopped=${STOPPED}" >> "$GITHUB_OUTPUT"
        echo "stopped_by=${STOPPED_BY}" >> "$GITHUB_OUTPUT"
        echo "stopped_because=${STOPPED_BECAUSE}" >> "$GITHUB_OUTPUT"
        echo "failed_because=${FAILED_BECAUSE}" >> "$GITHUB_OUTPUT"
        echo "ceiling=${CEILING}" >> "$GITHUB_OUTPUT"
        echo "model_never_asked=${MODEL_NEVER_ASKED}" >> "$GITHUB_OUTPUT"
    - name: Hold a governed run to having been governed
      id: governed_held
      if: ${{ steps.model_run.outputs.conclusion == 'success' && steps.governed_run.outputs.request_file != '' }}
      shell: bash
      env:
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
        STOPPED: ${{ steps.model_run.outputs.stopped }}
        MODEL_NEVER_ASKED: ${{ steps.model_run.outputs.model_never_asked }}
      run: node "${SCRIPTS}/kreview/governed-check.mjs" governed
    - name: Say how the model run ended, governance included
      id: concluded
      if: ${{ always() && steps.model_run.outcome != 'skipped' }}
      shell: bash
      env:
        CONCLUSION: ${{ (steps.governed_held.outcome == 'failure' || steps.governed_held.outcome == 'cancelled') && 'failure' ||
          steps.model_run.outputs.conclusion }}
      run: echo "conclusion=${CONCLUSION}" >> "$GITHUB_OUTPUT"
    - name: Upload the opencode event stream
      if: ${{ always() && steps.opencode.outputs.events_file != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ksai-opencode-events-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0
          }}
        path: ${{ steps.opencode.outputs.events_file }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
    - name: Upload the model execution log
      if: ${{ always() && steps.model_run.outputs.execution_file != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ksai-execution-log-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
        path: ${{ steps.model_run.outputs.execution_file }}
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
    - name: Note that this run was cancelled
      id: cancellation
      if: ${{ cancelled() }}
      shell: bash
      run: echo 'cancelled=true' >> "$GITHUB_OUTPUT"
    - name: Complete the package stage this run executed
      id: stage_complete
      if: ${{ always() && steps.dispatch_record.outputs.workflow_job != '' &&
        steps.staged_scripts.outcome == 'success' }}
      shell: bash
      env:
        WORKFLOW_JOB: ${{ steps.dispatch_record.outputs.workflow_job }}
        WORKFLOW_INSTANCE: ${{ steps.dispatch_record.outputs.workflow_instance }}
        WORKFLOW_ATTEMPT: ${{ steps.dispatch_record.outputs.workflow_attempt }}
        WORKFLOW_LEASE: ${{ steps.dispatch_record.outputs.workflow_lease }}
        CONCLUSION: ${{ steps.cancellation.outputs.cancelled == 'true' && 'cancelled' || steps.governed_held.outcome ==
          'success' && steps.concluded.outputs.conclusion || steps.steering.outputs.complete == 'true' && 'success' ||
          'failure' }}
        CONTROL_PLANE_NOTICE: ${{ steps.steering.outputs.complete == 'true' && steps.steering.outputs.notice || '' }}
        EXECUTION_FILE: ${{ steps.model_run.outputs.execution_file }}
        MODEL_STEP: ${{ steps.opencode.outcome }}
        TOOLS_STEP: ${{ steps.opencode_install.outcome }}
        STAGE_PROFILE: ${{ steps.steering.outputs.profile }}
        BOUND_HEAD_SHA: ${{ steps.dispatch_record.outputs.source_revision }}
        MERGE_BASE: ${{ steps.dispatch_record.outputs.merge_base }}
        MERGE_FAILURE: ${{ steps.merge_base.outputs.error }}
        CHANGESET_MAX_BYTES: ${{ steps.dispatch_record.outputs.changeset_max_bytes }}
        CHANGESET_MAX_FILES: ${{ steps.dispatch_record.outputs.changeset_max_files }}
        EVENTS_FILE: ${{ steps.opencode.outputs.events_file }}
        KSAI_GIT_FILEMODE: "true"
        KSAI_CP_ENDPOINT: ${{ inputs.control_plane_endpoint }}
        SCRIPTS: ${{ runner.temp }}/ksai-scripts
      run: node "${SCRIPTS}/ksai/workflow/stage.mjs"
    - name: Put this action back for the post phase
      if: ${{ always() && steps.save_self.outputs.at != '' }}
      shell: bash
      env:
        AT: ${{ steps.save_self.outputs.at }}
        STASH: ${{ steps.save_self.outputs.stash }}
      run: |
        set -euo pipefail
        root=$(cd "$GITHUB_WORKSPACE" && pwd -P)
        target="${GITHUB_WORKSPACE}/${AT}"
        ancestor="$target"
        while [ ! -d "$ancestor" ]; do
          ancestor=$(dirname -- "$ancestor")
        done
        real_ancestor=$(cd "$ancestor" && pwd -P)
        case "$real_ancestor" in
          "$root" | "$root"/*) ;;
          *)
            echo "::error::${AT} resolves to ${real_ancestor}, outside the workspace, so this action was not put back"
            exit 1
            ;;
        esac
        mkdir -p -- "$target"
        real=$(cd "$target" && pwd -P)
        case "$real" in
          "$root" | "$root"/*) ;;
          *)
            echo "::error::${AT} resolves to ${real}, outside the workspace, so this action was not put back"
            exit 1
            ;;
        esac
        rm -f -- "${real}/action.yml"
        cp "${STASH}/action.yml" "${real}/action.yml"

