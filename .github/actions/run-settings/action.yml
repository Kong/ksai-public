name: Run settings
description: >-
  Read the runtime limits from the control plane. Authenticate the repository with
  GitHub OIDC. Refuse an unavailable or incomplete answer without a local fallback.

inputs:
  endpoint:
    description: The bare HTTPS control-plane URL.
    required: true
  audience:
    description: The audience for the GitHub OIDC token.
    required: false
    default: ksai-cp

outputs:
  runs_on:
    description: The runner labels that the control plane selected.
    value: ${{ steps.run_settings.outputs.runs_on }}
  egress_endpoints:
    description: The public HTTPS endpoints that the control plane selected.
    value: ${{ steps.run_settings.outputs.egress_endpoints }}
  denied_paths:
    description: The paths that the control plane forbids the stage to change.
    value: ${{ steps.run_settings.outputs.denied_paths }}
  job_timeout_minutes:
    description: The maximum job time that the control plane selected.
    value: ${{ steps.run_settings.outputs.job_timeout_minutes }}
  max_consecutive_tool_failures:
    description: The consecutive tool failure limit that the control plane selected.
    value: ${{ steps.run_settings.outputs.max_consecutive_tool_failures }}
  max_repeated_tool_calls:
    description: The repeated tool call limit that the control plane selected.
    value: ${{ steps.run_settings.outputs.max_repeated_tool_calls }}

runs:
  using: composite
  steps:
    - name: Read the run settings
      id: run_settings
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RUN_SETTINGS_ACTION_PATH: ${{ github.action_path }}
        CONTROL_PLANE_ENDPOINT: ${{ inputs.endpoint }}
        RUN_SETTINGS_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const { readRunSettings } = await import(`file://${process.env.RUN_SETTINGS_ACTION_PATH}/run-settings.mjs`);
          const answer = await readRunSettings({
            endpoint: process.env.CONTROL_PLANE_ENDPOINT,
            audience: process.env.RUN_SETTINGS_AUDIENCE,
            mint: (audience) => core.getIDToken(audience),
            secret: (token) => core.setSecret(token),
          });
          for (const [name, value] of Object.entries(answer.settings)) core.setOutput(name, value);
