name: Run token
description: >-
  Hand a `ksai.yml` step the GitHub token it needs from the control plane. The control plane holds
  the App key, admits a run it dispatched from a released `ksai.yml`, and mints one narrow token per
  ask, so a repository that asks it holds no key a workflow on any of its branches could read.

  The run names a grant and never a permission. `source` reads the ksai source repository, `read` reads this repository,
  `write` writes to it within what the gate decided, and `modules` reads one owner's repositories for
  private Go modules. The control plane answers with the token and the App it was minted as, or refuses with the
  reason, which this step fails with. A refusal that would answer the same again fails at once, and so
  does a 502 the control plane wrote itself, which says GitHub would not mint the token. A failure that
  can pass - the OIDC mint, the network, a 408 or any other 5xx - is tried again for about a minute,
  and each ask waits longer than the control plane takes to mint. Once a step in a job gives up on a
  control plane it could not reach, the steps after it in that job ask once, so a job holding several
  tokens does not wait the same outage out per token. The token is revoked when the job ends.

inputs:
  grant:
    description: the grant this step asks for - source, read, write or modules
    required: true
  owner:
    description: the owner whose repositories a modules token reads, and empty for every other grant
    required: false
    default: ""
  job:
    description: the job asking, which the control plane keeps beside the token and never decides on
    required: false
    default: ${{ github.job }}
  endpoint:
    description: >-
      Base URL of the control plane, with no trailing path.
    required: true
  audience:
    description: >-
      Audience the OIDC token is minted for. Both ends have to name the same string, and the control
      plane refuses a token minted for anything else.
    required: false
    default: ksai-cp
outputs:
  token:
    description: the token this step hands on
  app-slug:
    description: the App the token was minted as, which is the login a run posts and reads its own comments under

runs:
  using: node24
  main: main.mjs
  post: post.mjs
