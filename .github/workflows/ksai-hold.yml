name: KSAI independent approval

on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          one runner label, or several as a JSON array. `workflow_call` inputs are only ever
          boolean, number or string, so a pool needing more than one label is written
          '["self-hosted", "linux"]' and read back with fromJSON.
        required: false
        type: string
        default: ubuntu-latest
      app_login:
        description: >-
          login of the App this repository runs KSAI as, with or without the `[bot]` suffix. Only a
          commit that App or `github-actions[bot]` published holds a pull request; every other one
          is reported green. The default names the shared App, and the public snapshot carries no
          default - an empty value holds any App-published trailer instead, which is the safe
          reading where nothing says which App is this repository's.
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  update:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 5
    concurrency:
      group: independent-approval-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Hold the pull request for an independent approval
        uses: $/.github/actions/require-independent-approval
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          bot-login: ${{ inputs.app_login }}
