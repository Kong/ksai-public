name: KSAI review request

on:
  workflow_call:
    inputs:
      client_id:
        description: >-
          the client ID of the GitHub App this call mints its tokens with. Empty (the default) reads
          the `KSAI_CLIENT_ID` repository variable, which is what a repository holding the shared
          KSAI App wants. A repository with an App of its own passes its own variable here rather
          than copying that App's client ID into a second variable under a name this workflow chose.
        required: false
        type: string
        default: ""
      runs_on:
        description: >-
          one runner label, or several as a JSON array. `workflow_call` inputs are only ever
          boolean, number or string, so a pool needing more than one label is written
          '["self-hosted", "linux"]' and read back with fromJSON.
        required: false
        type: string
        default: ubuntu-latest
      skip_label:
        description: >-
          a pull request carrying this label is not reviewed automatically. Empty reviews every pull
          request the other filters admit.
        required: false
        type: string
        default: no-ksai
      require_label:
        description: >-
          when set, only a pull request carrying this label is reviewed automatically, which makes
          the automatic review opt-in rather than opt-out. Empty (the default) reviews every pull
          request the other filters admit.
        required: false
        type: string
        default: ""
      review_drafts:
        description: >-
          true asks for a review when a draft pull request is opened. Off by default because
          `ready_for_review` already brings that pull request back here once it is ready, and a
          review of a draft is one a team pays for twice.
        required: false
        type: boolean
        default: false
      review_bots:
        description: >-
          true asks for a review of a pull request a bot opened. Off by default: a dependency bump
          is reviewed on repeat otherwise, and the review's own triage skips those authors anyway.
        required: false
        type: boolean
        default: false
      push_as_app:
        description: >-
          true where the review posts under the KSAI App, which is what decides the login this looks
          for when it asks whether the pull request has been reviewed already. It must match the
          value the review call carries, or every re-open spends another review.
        required: false
        type: boolean
        default: true
    secrets:
      ksai_private_key:
        description: private key for the KSAI GitHub App, which is what can resolve an organization team
        required: true

permissions: {}

jobs:
  dispatch:
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'review_requested' &&
      github.event.requested_team.slug == (vars.KSAI_REVIEW_TEAM || 'ksai') &&
      github.event.sender.type != 'Bot') ||
      (contains(fromJSON('["opened", "ready_for_review"]'), github.event.action) &&
      (inputs.review_drafts || github.event.pull_request.draft == false) &&
      (inputs.review_bots || github.event.pull_request.user.type != 'Bot') &&
      !contains(github.event.pull_request.labels.*.name, inputs.skip_label) &&
      (inputs.require_label == '' ||
      contains(github.event.pull_request.labels.*.name, inputs.require_label)))) }}
    runs-on: ${{ startsWith(inputs.runs_on, '[') && fromJSON(inputs.runs_on) || inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Mint a token that can resolve the team
        id: token
        if: ${{ github.event.action != 'review_requested' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          client-id: ${{ inputs.client_id || vars.KSAI_CLIENT_ID }}
          private-key: ${{ secrets.ksai_private_key }}
          permission-members: read
          permission-pull-requests: write

      - name: Look for a review this flow already posted
        id: reviewed
        if: ${{ github.event.action != 'review_requested' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BOT: >-
            ${{ inputs.push_as_app && format('{0}[bot]', steps.token.outputs.app-slug)
            || 'github-actions[bot]' }}
        run: |
          set -euo pipefail
          posted=$(gh api --paginate "repos/${REPO}/pulls/${PR}/reviews?per_page=100" \
            --jq '.[] | select(.user.login == env.BOT) | .id' | wc -l)
          echo "posted=${posted}" >> "${GITHUB_OUTPUT}"
          if [ "${posted}" != "0" ]; then
            echo "::notice::${BOT} has already reviewed #${PR}, so this job is not asking for another"
          fi

      - name: Request the review from the team
        id: request
        if: ${{ github.event.action != 'review_requested' && steps.reviewed.outputs.posted == '0' }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TEAM: ${{ vars.KSAI_REVIEW_TEAM || 'ksai' }}
        run: |
          requested=$(gh api --method POST "repos/${REPO}/pulls/${PR}/requested_reviewers" \
            -f "reviewers[]" \
            -f "team_reviewers[]=${TEAM}" \
            --jq '(.requested_teams // [])[].slug')
          if ! printf '%s\n' "${requested}" | grep -qxiF "${TEAM}"; then
            echo "::error::${TEAM} is not a requested reviewer on #${PR} after asking for it"
            exit 1
          fi

      - name: Run the review on the default branch
        id: dispatch
        if: >-
          ${{ github.event.action == 'review_requested' ||
          steps.reviewed.outputs.posted == '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          PR: ${{ github.event.pull_request.number }}
          ACTOR: >-
            ${{ github.event.action == 'review_requested' && github.event.sender.login ||
            github.event.pull_request.user.login }}
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          caller="${CALLER_REF%%@*}"
          caller="${caller##*/}"
          if [ -z "${caller}" ]; then
            echo "::error::read no workflow filename out of '${CALLER_REF}', so there is nothing to dispatch and the request this job made would wait on nothing"
            exit 1
          fi
          gh workflow run "${caller}" \
            --repo "${REPO}" \
            --ref "${REF}" \
            --field pr="${PR}" \
            --field actor="${ACTOR}"

      - name: Withdraw the request when no review was started
        if: ${{ always() && steps.request.outcome == 'success' && steps.dispatch.outcome != 'success' }}
        uses: $/.github/actions/clear-review-request
        with:
          pr_number: ${{ github.event.pull_request.number }}
          team_slug: ${{ vars.KSAI_REVIEW_TEAM || 'ksai' }}
          client-id: ${{ inputs.client_id || vars.KSAI_CLIENT_ID }}
          private-key: ${{ secrets.ksai_private_key }}
