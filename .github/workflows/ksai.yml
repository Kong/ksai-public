# Generated from the core workflow by .github/scripts/cp-entrypoint.mjs.
# Edit ksai-v5.yml and run `mise run cp:entrypoint`; edits here are overwritten.
name: KSAI control plane

on:
  workflow_call:
permissions: {}

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' && (
      !(github.event_name == 'pull_request' && github.event.action == 'review_requested')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ vars.KSAI_JOB_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    outputs:
      runs_on: ${{ steps.settings.outputs.runs_on || 'ubuntu-latest' }}
      trigger_phrase: ${{ steps.settings.outputs.trigger_phrase }}
      continuation_workflow: ${{ steps.settings.outputs.continuation_workflow || 'ksai.yml' }}
      blocker: ${{ steps.settings.outputs.blocker }}
      said: ${{ steps.settings.outputs.said }}
      federation_rule_id: ${{ steps.settings.outputs.federation_rule_id }}
      organization_id: ${{ steps.settings.outputs.organization_id }}
      service_account_id: ${{ steps.settings.outputs.service_account_id }}
      workspace_id: ${{ steps.settings.outputs.workspace_id }}
      model_gateway_url: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
      model_auth_mode: ${{ steps.credentials.outputs.model_auth_mode }}
      model_audience: ${{ steps.credentials.outputs.model_audience }}
      model_catalog: ${{ steps.run_settings.outputs.catalog }}
      credentials_read: ${{ steps.credentials.outputs.read }}
      endpoint: ${{ steps.endpoints.outputs.endpoint }}
      gateway: ${{ steps.endpoints.outputs.gateway }}
      codeowner: ${{ steps.gate.outputs.codeowner }}
      write_access: ${{ steps.gate.outputs.write_access }}
      write_access_commands: ${{ steps.gate.outputs.write_access_commands }}
      owners: ${{ steps.gate.outputs.owners }}
      thread_root_id: ${{ steps.gate.outputs.thread_root_id }}
      on_issue: ${{ steps.gate.outputs.on_issue }}
      issue_number: ${{ steps.gate.outputs.issue_number }}
      verdict: ${{ steps.gate.outputs.verdict }}
      classifier_model: ${{ steps.gate.outputs.classifier_model }}
      classifier_cost: ${{ steps.gate.outputs.classifier_cost }}
      classifier_input_tokens: ${{ steps.gate.outputs.classifier_input_tokens }}
      classifier_output_tokens: ${{ steps.gate.outputs.classifier_output_tokens }}
      classifier_turns: ${{ steps.gate.outputs.classifier_turns }}
      classifier_duration: ${{ steps.gate.outputs.classifier_duration }}
      model: ${{ steps.record.outputs.model || steps.run_settings.outputs.model }}
      effort: ${{ steps.record.outputs.effort || steps.run_settings.outputs.effort }}
      shadow_percent: ${{ steps.run_settings.outputs.shadow_percent }}
      review_triage_mode: ${{ steps.run_settings.outputs.review_triage_mode }}
      allowed_models: ${{ steps.run_settings.outputs.allowed_models }}
      max_effort: ${{ steps.run_settings.outputs.max_effort }}
      disabled_commands: ${{ steps.gate.outputs.disabled_commands || steps.run_settings.outputs.disabled_commands || '' }}
      denied_paths: ${{ steps.gate.outputs.denied_paths || steps.run_settings.outputs.denied_paths || 'CLAUDE.md,AGENTS.md,CONTRIBUTING.md,.claude,.mcp.json' }}
      bare_comments: ${{ steps.gate.outputs.bare_comments || steps.run_settings.outputs.bare_comments || 'auto' }}
      stop_mode: ${{ steps.gate.outputs.stop_mode || steps.run_settings.outputs.stop_mode || 'soft' }}
      require_plan_approval: ${{ steps.gate.outputs.require_plan_approval || steps.run_settings.outputs.require_plan_approval || false }}
      fix_review_bots: ${{ steps.run_settings.outputs.fix_review_bots || '' }}
      min_effort: ${{ steps.run_settings.outputs.min_effort }}
      job_timeout_minutes: ${{ steps.run_settings.outputs.job_timeout_minutes }}
      test_minutes: ${{ steps.minutes.outputs.test }}
      max_consecutive_tool_failures: ${{ steps.run_settings.outputs.max_consecutive_tool_failures }}
      max_repeated_tool_calls: ${{ steps.run_settings.outputs.max_repeated_tool_calls }}
      review_strategy: ${{ steps.run_settings.outputs.review_strategy }}
      review_diff_mib: ${{ steps.run_settings.outputs.review_diff_mib }}
      triage_write: ${{ steps.run_settings.outputs.triage_write }}
      report_rendering: cp
      opencode_version: 2.0.25
      run_settings_arm: ${{ (steps.record.outputs.bound_command == '' && steps.record.outputs.model == '' || steps.record.outputs.bound_command != '' && steps.record.outputs.model == steps.run_settings.outputs.model && steps.record.outputs.effort == steps.run_settings.outputs.effort) && steps.run_settings.outputs.arm || '' }}
      record_requester: ${{ steps.record.outputs.requester }}
      record_guidance: ${{ (steps.record.outputs.work_ref == '' || steps.jira_readable.outputs.allowed == 'true') && steps.record.outputs.guidance_html || '' }}
      record_work_item: ${{ steps.jira_readable.outputs.allowed == 'true' && steps.record.outputs.work_item || '' }}
      record_ask: ${{ steps.record.outputs.ask }}
      record_id: ${{ steps.record.outputs.record_id }}
      asked_pr: ${{ steps.record.outputs.pr }}
      asked_actor: ${{ steps.record.outputs.actor }}
      asked_issue_number: ${{ steps.record.outputs.issue_number }}
      asked_work_ref: ${{ steps.record.outputs.work_ref }}
      asked_attempt: ${{ steps.record.outputs.attempt }}
      asked_stall: ${{ steps.record.outputs.stall }}
      asked_prev_remaining: ${{ steps.record.outputs.prev_remaining }}
      asked_comment_id: ${{ steps.record.outputs.read == 'true' && steps.record.outputs.comment_id || '' }}
      asked_comment_kind: ${{ steps.record.outputs.read == 'true' && steps.record.outputs.comment_kind || '' }}
      number: ${{ github.event.issue.number || github.event.pull_request.number || steps.record.outputs.pr }}
      on_pull_request: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || '' }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      source_revision: ${{ steps.record.outputs.source_revision }}
      stage_minutes: ${{ steps.record.outputs.stage_minutes }}
      stage_job_minutes: ${{ steps.record.outputs.stage_job_minutes }}
      flow: >-
        ${{ steps.record.outputs.workflow_job != '' && 'stage' ||
        ((steps.gate.outputs.authorized == 'true' && steps.gate.outputs.implement == 'true' && steps.gate.outputs.review != 'true') ||
        (steps.record.outputs.read == 'true' && steps.record.outputs.comment_kind == '' &&
        (steps.record.outputs.issue_number != '' || steps.record.outputs.work_ref != '') &&
        contains(fromJSON('["", "implement", "fix", "approve"]'), steps.record.outputs.command))) && 'implement' ||
        steps.gate.outputs.authorized == 'true' && steps.gate.outputs.help == 'true' && 'help' ||
        steps.gate.outputs.authorized == 'true' && steps.gate.outputs.review == 'true' && 'review' ||
        steps.gate.outputs.authorized == 'true' && steps.gate.outputs.test == 'true' && 'test' || '' }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Ask which runner this repository's work is carried out on
        id: settings
        uses: $/.github/actions/run-settings
        with:
          endpoint: https://ksai.kongcloud.io
          model: flagship
          effort:

      - name: Refuse a review request from the reviewer sidebar
        env:
          SIDEBAR: ${{ github.event_name == 'pull_request' && github.event.action == 'review_requested' }}
        run: |
          set -euo pipefail
          case "${SIDEBAR}" in
            false) ;;
            true)
              echo "::error::a review request in the reviewer sidebar mints nothing and is answered by the dispatch job, so this job must not have started"
              exit 1 ;;
            *)
              echo "::error::could not tell whether this run is a review request in the reviewer sidebar, and being unable to tell is not the same as no"
              exit 1 ;;
          esac

      - name: Refuse an OpenCode build v5 does not run
        env:
          OPENCODE_VERSION: 2.0.25
        run: |
          set -euo pipefail
          case "${OPENCODE_VERSION}" in
            2.*) ;;
            *)
              echo "::error::opencode_version: ${OPENCODE_VERSION} is not an OpenCode 2 build, and v5 runs only OpenCode 2"
              exit 1 ;;
          esac

      - name: Read this run's credentials
        id: credentials
        uses: $/.github/actions/run-credentials
        with:
          endpoint: https://ksai.kongcloud.io

      - name: Say the hosts a job that blocks its egress has to reach
        id: endpoints
        env:
          ENDPOINT: https://ksai.kongcloud.io
          BASE_URL: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
          MODEL_AUTH_MODE: ${{ steps.credentials.outputs.model_auth_mode }}
          ANTHROPIC_AUTH: oidc-bearer
        run: |
          set -euo pipefail

          if [[ "${MODEL_AUTH_MODE}" == cp_exchange && "${ANTHROPIC_AUTH}" != oidc-bearer ]]; then
            echo "::error::CP model exchange requires anthropic_auth: oidc-bearer"
            exit 1
          fi

          host() {
            local origin="${1#*://}"
            origin="${origin%%/*}"
            origin="${origin//[[:space:]]/}"
            case "${origin}" in ''|*:[0-9]*) ;; *) origin="${origin}:443" ;; esac
            printf '%s' "${origin}"
          }

          {
            echo "endpoint=$(host "${ENDPOINT}")"
            echo "gateway=$(host "${BASE_URL}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Read the run settings
        id: run_settings
        uses: $/.github/actions/run-settings
        with:
          endpoint: https://ksai.kongcloud.io
          model: flagship
          effort:
          shadow_percent: 10
          review_triage_mode: shadow
          allowed_models: zai-org/GLM-5.3-Flash,zai-org/GLM-5.3,claude-opus-5,claude-opus-5-5,claude-sonnet-5,claude-haiku-4-5
          max_effort:
          min_effort:
          job_timeout_minutes: 35
          max_consecutive_tool_failures: 50
          max_repeated_tool_calls: 8
          review_strategy: baseline
          key_held: false

      - name: Give a test run's publisher time past the tester's ceiling
        id: minutes
        env:
          CEILING: ${{ steps.run_settings.outputs.job_timeout_minutes || 35 }}
        run: |
          set -euo pipefail
          case "${CEILING}" in
            ''|*[!0-9]*) echo "test=" >> "${GITHUB_OUTPUT}" ;;
            *) echo "test=$(( CEILING + 10 ))" >> "${GITHUB_OUTPUT}" ;;
          esac

      - name: Read the dispatch record
        id: record
        uses: $/.github/actions/dispatch-record
        with:
          endpoint: https://ksai.kongcloud.io

      - name: Say whether this repository may be handed the work item
        id: jira_readable
        if: ${{ steps.record.outputs.work_ref != '' }}
        env:
          WORK_REF: ${{ steps.record.outputs.work_ref }}
          JIRA_PROJECTS:
          JIRA_ALLOW_PUBLIC: false
          PRIVATE: ${{ github.event.repository.private }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          node -e '
            const key = String(process.env.WORK_REF || "").replace(/^jira\//, "").toUpperCase();
            const projects = [...new Set(String(process.env.JIRA_PROJECTS || "").split(/[\s,]+/).filter(Boolean).map((one) => one.toUpperCase()))];
            const readable =
              /^[A-Z][A-Z0-9]{1,9}-[1-9][0-9]{0,9}$/.test(key) &&
              projects.length > 0 &&
              projects.every((one) => /^[A-Z][A-Z0-9]{1,9}$/.test(one)) &&
              projects.includes(key.slice(0, key.indexOf("-"))) &&
              (process.env.PRIVATE === "true" || process.env.JIRA_ALLOW_PUBLIC === "true");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, "allowed=" + readable + "\n");
          '

      - name: Validate anthropic_base_url
        if: ${{ steps.record.outputs.workflow_job == '' }}
        env:
          ANTHROPIC_BASE_URL: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
          ANTHROPIC_AUTH: oidc-bearer
        run: |
          set -euo pipefail

          if [[ -z "${ANTHROPIC_BASE_URL}" ]]; then
            why="The control plane handed this run no model origin, or could not be read, so every model call it would make has nowhere to go. Empty is refused rather than falling back to Anthropic, because that would take the spend off the gateway that attributes it. The step that read this run's credentials notes what the control plane answered. See https://ksai.kongcloud.io/start/repo"
            echo "::error title=anthropic_base_url is not set::${why}"
            echo "${why}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          if [[ ! "${ANTHROPIC_BASE_URL}" =~ ^https:// ]]; then
            echo "::error::anthropic_base_url must start with https:// - the classifier this job runs is a model call like any other, got: ${ANTHROPIC_BASE_URL}"
            exit 1
          fi

          if [[ "${ANTHROPIC_BASE_URL}" =~ /v1/*$ ]]; then
            echo "::error::anthropic_base_url names an endpoint rather than an origin - the version segment is appended by every caller, so this would be called at it again. Drop the /v1, got: ${ANTHROPIC_BASE_URL}"
            exit 1
          fi

          case "${ANTHROPIC_AUTH}" in
            federation|oidc-bearer) ;;
            *) echo "::error::anthropic_auth must be one of federation, oidc-bearer, got: ${ANTHROPIC_AUTH}"; exit 1 ;;
          esac

      - name: Mint this repository's read token
        id: authz-token
        if: ${{ steps.record.outputs.workflow_job == '' }}
        continue-on-error: true
        uses: $/.github/actions/run-token
        with:
          grant: read
          mode: cp
          endpoint: https://ksai.kongcloud.io

      - name: Refuse a call whose credentials cannot read this repository
        if: ${{ steps.authz-token.outcome == 'failure' }}
        run: |
          set -euo pipefail
          echo "::error::the control plane minted no read token for this repository, so nothing below can read its CODEOWNERS, its comments or its pull requests. The step above fails with what the control plane answered, which names the permissions it asked for when GitHub refused the mint - GitHub refuses the whole mint when one of them is missing and never says which. Check that the App is installed here and grants them, and that the control plane has read the KSAI pin of this repository, see https://ksai.kongcloud.io/start/repo"
          exit 1

      - name: Resolve who asked and what they asked for
        id: gate
        if: ${{ steps.record.outputs.workflow_job == '' }}
        uses: $/.github/actions/ksai-gate
        env:
          KSAI_MODEL_AUTH_MODE: ${{ steps.credentials.outputs.model_auth_mode }}
        with:
          kong_org_github_token: ${{ github.token }}
          authorization_github_token: ${{ steps.authz-token.outputs.token }}
          post_github_token: ${{ github.token }}
          github_calls: cp
          federation_rule_id: ${{ steps.settings.outputs.federation_rule_id }}
          organization_id: ${{ steps.settings.outputs.organization_id }}
          service_account_id: ${{ steps.settings.outputs.service_account_id }}
          workspace_id: ${{ steps.settings.outputs.workspace_id }}
          anthropic_base_url: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
          anthropic_auth: oidc-bearer
          trigger_phrase: ${{ steps.settings.outputs.trigger_phrase }}
          bot_login: ${{ format('{0}[bot]', steps.authz-token.outputs.app-slug) }}
          app_slug: ${{ steps.authz-token.outputs.app-slug }}
          team:
          actor: ${{ steps.record.outputs.actor }}
          pr_number: ${{ steps.record.outputs.pr }}
          comment_id: ${{ steps.record.outputs.read == 'true' && steps.record.outputs.comment_id || '' }}
          comment_kind: ${{ steps.record.outputs.read == 'true' && steps.record.outputs.comment_kind || '' }}
          record_command: ${{ steps.record.outputs.command }}
          record_bound_command: ${{ steps.record.outputs.bound_command }}
          record_task_action: ${{ steps.record.outputs.task_action }}
          record_requester: ${{ steps.record.outputs.requester }}
          record_label: ${{ steps.record.outputs.label }}
          record_pr: ${{ steps.record.outputs.pr }}
          record_head_sha: ${{ steps.record.outputs.head_sha }}
          record_autofix_capability: ${{ steps.record.outputs.autofix_capability }}
          record_endpoint: https://ksai.kongcloud.io
          record_id: ${{ steps.record.outputs.record_id }}
          requester: >-
            ${{ steps.record.outputs.actor || github.event.comment.user.login ||
            github.event.review.user.login || github.actor }}
          sidebar_withdrawal: ${{ steps.record.outputs.trigger == 'review_requested' && steps.settings.outputs.clear_request == 'true' }}
          continuation: ${{ (steps.record.outputs.read == 'true' && steps.record.outputs.comment_kind || '') == '' && (steps.record.outputs.issue_number != '' || steps.record.outputs.work_ref != '') }}
          disabled_commands: ${{ steps.run_settings.outputs.disabled_commands || '' }}
          write_access_commands: ${{ steps.run_settings.outputs.write_access_commands || 'all' }}
          allowed_commands:
          classifier_model: balanced
          prompt_endpoint: https://ksai.kongcloud.io
          opencode_version: 2.0.25
          bare_comments: ${{ steps.run_settings.outputs.bare_comments || 'auto' }}
          denied_paths: ${{ steps.run_settings.outputs.denied_paths || 'CLAUDE.md,AGENTS.md,CONTRIBUTING.md,.claude,.mcp.json' }}
          stop_mode: ${{ steps.run_settings.outputs.stop_mode || 'soft' }}
          require_plan_approval: ${{ steps.run_settings.outputs.require_plan_approval || false }}
          otel_endpoint: https://otlp.datadoghq.com
          datadog_key: ${{ steps.credentials.outputs.datadog_key }}

      - name: Tell the control plane what this run decided
        if: ${{ steps.record.outputs.read == 'true' && steps.gate.outcome != 'skipped' }}
        uses: $/.github/actions/run-authorization
        with:
          authorized: ${{ steps.gate.outputs.authorized }}
          implement: ${{ steps.gate.outputs.implement == 'true' && steps.gate.outputs.review != 'true' }}
          review: ${{ steps.gate.outputs.review }}
          help: ${{ steps.gate.outputs.help }}
          test: ${{ steps.gate.outputs.test }}
          continuation: ${{ (steps.record.outputs.read == 'true' && steps.record.outputs.comment_kind || '') == '' && (steps.record.outputs.issue_number != '' || steps.record.outputs.work_ref != '') }}
          record_command: ${{ steps.record.outputs.command }}
          record_bound_command: ${{ steps.record.outputs.bound_command }}
          comment_kind: ${{ steps.record.outputs.comment_kind }}
          no_work: ${{ steps.gate.outputs.no_work }}
          native_pending: ${{ steps.gate.outputs.native_pending }}
          gate_outcome: ${{ steps.gate.outcome }}
          endpoint: https://ksai.kongcloud.io
          mode: cp

  run:
    needs: [gate]
    if: ${{ github.event_name == 'workflow_dispatch' && (!cancelled() && needs.gate.result == 'success' && needs.gate.outputs.flow != '') }}
    outputs:
      bot_login: ${{ format('{0}[bot]', steps.post-token.outputs.app-slug) }}
    runs-on: ${{ startsWith(needs.gate.outputs.runs_on, '[') && fromJSON(needs.gate.outputs.runs_on) || needs.gate.outputs.runs_on }}
    timeout-minutes: >-
      ${{ fromJSON(needs.gate.outputs.flow == 'test' && needs.gate.outputs.test_minutes ||
      needs.gate.outputs.flow == 'stage' && needs.gate.outputs.stage_job_minutes ||
      needs.gate.outputs.job_timeout_minutes || 35) }}
    environment: ${{ vars.KSAI_JOB_ENVIRONMENT }}
    env:
      KSAI_MODEL_AUTH_MODE: ${{ needs.gate.outputs.model_auth_mode }}
      KSAI_MODEL_CATALOG_JSON: ${{ needs.gate.outputs.model_catalog }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: >-
        ${{ needs.gate.outputs.flow == 'implement' && format('ksai-implement-{0}', vars.KSAI_IMPLEMENT_LANE ||
        format('{0}-{1}',
        (needs.gate.outputs.on_pull_request || needs.gate.outputs.asked_pr) && 'pr' || 'issue',
        needs.gate.outputs.number || needs.gate.outputs.asked_issue_number ||
        needs.gate.outputs.asked_work_ref || needs.gate.outputs.asked_pr || needs.gate.outputs.asked_comment_id)) ||
        needs.gate.outputs.flow == 'test' && format('ksai-test-{0}', needs.gate.outputs.asked_pr || needs.gate.outputs.number || github.run_id) ||
        needs.gate.outputs.flow == 'review' && format('ksai-{0}', needs.gate.outputs.asked_pr || needs.gate.outputs.number || github.run_id) ||
        format('ksai-{0}-{1}', needs.gate.outputs.flow, github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: ${{ needs.gate.outputs.flow == 'implement' && 'block' || 'audit' }}
          allowed-endpoints: >-
            api.github.com:443 github.com:443 *.githubusercontent.com:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 *.datadoghq.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80 security.ubuntu.com:80 registry.npmjs.org:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 pypi.org:443 files.pythonhosted.org:443 crates.io:443 index.crates.io:443 static.crates.io:443
            ${{ needs.gate.outputs.gateway }}
            ${{ needs.gate.outputs.endpoint }}
          disable-telemetry: ${{ needs.gate.outputs.flow == 'implement' }}

      - name: Refuse a review request from the reviewer sidebar
        if: ${{ needs.gate.outputs.flow == 'implement' }}
        env:
          SIDEBAR: ${{ github.event_name == 'pull_request' && github.event.action == 'review_requested' }}
        run: |
          set -euo pipefail
          case "${SIDEBAR}" in
            false) ;;
            true)
              echo "::error::a review request in the reviewer sidebar mints nothing and is answered by the dispatch job, so this job must not have started"
              exit 1 ;;
            *)
              echo "::error::could not tell whether this run is a review request in the reviewer sidebar, and being unable to tell is not the same as no"
              exit 1 ;;
          esac

      - name: Refuse a call that blocks every destination and names none
        if: ${{ needs.gate.outputs.flow == 'implement' }}
        env:
          ALLOWED: api.github.com:443 github.com:443 *.githubusercontent.com:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443 *.datadoghq.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80 security.ubuntu.com:80 registry.npmjs.org:443 proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 pypi.org:443 files.pythonhosted.org:443 crates.io:443 index.crates.io:443 static.crates.io:443
          ENDPOINT: https://ksai.kongcloud.io
          DESTINATION: ${{ needs.gate.outputs.endpoint }}
          GATEWAY: ${{ needs.gate.outputs.gateway }}
        run: |
          set -euo pipefail

          case "${ALLOWED}" in
            *[0-9A-Za-z]*) ;;
            *)
              echo "::error::harden_runner_allowed_endpoints is empty, and an empty list configures no rule at all rather than the strictest one, so this job would write code with nothing bounding where its runner may talk to. Name the destinations this repository needs"
              exit 1 ;;
          esac

          if [ "${ALLOWED#*$'\n'}" != "${ALLOWED}" ]; then
            echo "::error::harden_runner_allowed_endpoints holds a newline, and the monitor splits this list on spaces alone - the first host loses its port and every host after it is dropped, so the registries and the gateway this job needs are blocked while the workflow still reads egress-policy: block. Write the list space-separated, in a folded block rather than a literal one"
            exit 1
          fi

          if [ -n "${ENDPOINT}" ] && [ -z "${DESTINATION}" ]; then
            echo "::error::this call names a control plane and the job that reads it handed back no host, so the monitor is blocking the record this run was sent to read. Read the gate job"
            exit 1
          fi

          if [ -z "${GATEWAY}" ]; then
            echo "::error::the job that reads anthropic_base_url handed back no host, so the monitor is blocking every model call this job would make. Read the gate job"
            exit 1
          fi

      - name: Mint this repository's read token
        id: authz-token
        if: ${{ needs.gate.outputs.flow != 'help' }}
        uses: $/.github/actions/run-token
        with:
          grant: read
          mode: cp
          endpoint: https://ksai.kongcloud.io

      - name: Read the owners of this repository's private Go modules
        id: go-owners
        if: ${{ needs.gate.outputs.flow == 'test' || needs.gate.outputs.flow == 'implement' }}
        env:
          OWNERS:
          HOME_OWNER: ${{ github.repository_owner }}
          PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${OWNERS}" ]; then
            if [ "${PRIVATE}" = "false" ] || [ "$(printf '%s' "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')" = "" ]; then
              printf 'one=\ntwo=\n' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [ "$(printf '%s' "${HOME_OWNER}" | tr '[:upper:]' '[:lower:]')" = "kong" ]; then
              OWNERS="${HOME_OWNER}"
            else
              OWNERS="${HOME_OWNER} Kong"
            fi
          fi
          read -r -a named <<< "${OWNERS//[$'\n\r\t']/ }"
          if [ "${#named[@]}" -eq 0 ]; then
            echo "::error::go_module_owners holds only whitespace; leave it out rather than blank, or name the owners whose private Go modules this repository imports"
            exit 1
          fi
          if [ "${#named[@]}" -gt 2 ]; then
            echo "::error::go_module_owners names ${#named[@]} owners and this workflow mints at most two; the rest would be silently unreachable, which reads as a repository whose build is broken"
            exit 1
          fi
          for one in "${named[@]}"; do
            case "${one}" in
              -*|*[!A-Za-z0-9-]*)
                echo "::error::'${one}' is not a GitHub owner login, so no read token can be minted for its private Go modules"
                exit 1 ;;
            esac
            if [ "${#one}" -gt 39 ]; then
              echo "::error::'${one}' is ${#one} characters and no GitHub owner is over 39, so no read token can be minted for its private Go modules"
              exit 1
            fi
          done
          if [ "${#named[@]}" -eq 2 ] && [ "$(printf '%s' "${named[0]}" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "${named[1]}" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::go_module_owners names ${named[0]} twice, which would mint two tokens for one owner and leave the second reaching nothing"
            exit 1
          fi
          {
            echo "one=${named[0]}"
            echo "two=${named[1]:-}"
          } >> "${GITHUB_OUTPUT}"

