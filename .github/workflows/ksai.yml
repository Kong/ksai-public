name: KSAI control plane
on:
  workflow_call: null
permissions: {}
jobs:
  stage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ vars.KSAI_JOB_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >-
            api.github.com:443
            github.com:443
            *.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.datadoghq.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            registry.npmjs.org:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            pypi.org:443
            files.pythonhosted.org:443
            crates.io:443
            index.crates.io:443
            static.crates.io:443
            ksai.kongcloud.io:443
          disable-telemetry: true
      - name: Ask which runner this repository's work is carried out on
        id: settings
        uses: $/.github/actions/run-settings
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Read this run's credentials
        id: credentials
        uses: $/.github/actions/run-credentials
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Read the dispatch record
        id: record
        uses: $/.github/actions/dispatch-record
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Decide whether this job carries the stage
        id: claim
        if: ${{ steps.record.outputs.read == 'true' && steps.record.outputs.workflow_job != '' }}
        uses: $/.github/actions/stage-claim
        with:
          runner: ubuntu-latest
          runs_on: ${{ steps.settings.outputs.runs_on }}
          egress_endpoints: ${{ steps.settings.outputs.egress_endpoints }}
          job_minutes: ${{ steps.record.outputs.stage_job_minutes || steps.settings.outputs.job_timeout_minutes }}
          most_minutes: "180"
          endpoint: https://ksai.kongcloud.io
          gateway_url: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
      - name: Mint this repository's read token
        id: authz-token
        if: ${{ steps.claim.outputs.claimed == 'true' }}
        uses: $/.github/actions/run-token
        with:
          grant: read
          endpoint: https://ksai.kongcloud.io
      - name: Check out the revision the package stage reads
        if: ${{ steps.claim.outputs.claimed == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.record.outputs.source_revision }}
          token: ${{ steps.authz-token.outputs.token }}
          persist-credentials: false
      - if: ${{ steps.claim.outputs.claimed == 'true' }}
        uses: $/.github/actions/ksai
        env:
          KSAI_PROVIDER_OBSERVATIONS: "true"
          KSAI_MODEL_AUTH_MODE: ${{ steps.credentials.outputs.model_auth_mode }}
          KSAI_REVIEW_ADMISSION: ${{ steps.record.outputs.review_admission }}
        with:
          source_org_github_token: ${{ steps.authz-token.outputs.token }}
          kong_org_github_token: ${{ github.token }}
          artifact_retention_days: 14
          job_timeout_minutes: ${{ steps.record.outputs.stage_minutes || steps.settings.outputs.job_timeout_minutes }}
          max_consecutive_tool_failures: ${{ steps.settings.outputs.max_consecutive_tool_failures }}
          max_repeated_tool_calls: ${{ steps.settings.outputs.max_repeated_tool_calls }}
          otel_endpoint: https://otlp.datadoghq.com
          otel_headers: ${{ steps.credentials.outputs.otel_headers }}
          denied_paths: ${{ steps.settings.outputs.denied_paths }}
          control_plane_endpoint: https://ksai.kongcloud.io
          record_id: ${{ steps.record.outputs.record_id }}
          opencode_version: 2.0.29
          anthropic_base_url: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
    name: Package stage
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ vars.KSAI_JOB_ENVIRONMENT }}
    permissions:
      contents: read
      id-token: write
    outputs:
      runs_on: ${{ steps.settings.outputs.runs_on }}
      stage_job_minutes: ${{ steps.record.outputs.stage_job_minutes }}
      review_admission: ${{ steps.record.outputs.review_admission }}
      job_timeout_minutes: ${{ steps.settings.outputs.job_timeout_minutes }}
      model_auth_mode: ${{ steps.credentials.outputs.model_auth_mode }}
      egress_endpoints: ${{ steps.settings.outputs.egress_endpoints }}
      gateway: ${{ steps.endpoints.outputs.gateway }}
      endpoint: ${{ steps.endpoints.outputs.endpoint }}
      source_revision: ${{ steps.record.outputs.source_revision }}
      stage_minutes: ${{ steps.record.outputs.stage_minutes }}
      max_consecutive_tool_failures: ${{ steps.settings.outputs.max_consecutive_tool_failures }}
      max_repeated_tool_calls: ${{ steps.settings.outputs.max_repeated_tool_calls }}
      denied_paths: ${{ steps.settings.outputs.denied_paths }}
      record_id: ${{ steps.record.outputs.record_id }}
      opencode_version: 2.0.29
      model_gateway_url: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Ask which runner this repository's work is carried out on
        id: settings
        uses: $/.github/actions/run-settings
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Refuse an OpenCode build v5 does not run
        env:
          OPENCODE_VERSION: 2.0.29
        run: >
          set -euo pipefail

          case "${OPENCODE_VERSION}" in
            2.*) ;;
            *)
              echo "::error::opencode_version: ${OPENCODE_VERSION} is not an OpenCode 2 build, and v5 runs only OpenCode 2"
              exit 1 ;;
          esac
      - name: Read this run's credentials
        id: credentials
        uses: $/.github/actions/run-credentials
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Say the hosts a job that blocks its egress has to reach
        id: endpoints
        env:
          ENDPOINT: https://ksai.kongcloud.io
          BASE_URL: ${{ steps.credentials.outputs.model_origin || steps.credentials.outputs.model_gateway_url }}
        run: |
          set -euo pipefail

          host() {
            local origin="${1#*://}"
            origin="${origin%%/*}"
            origin="${origin//[[:space:]]/}"
            case "${origin}" in ''|*:[0-9]*) ;; *) origin="${origin}:443" ;; esac
            printf '%s' "${origin}"
          }

          {
            echo "endpoint=$(host "${ENDPOINT}")"
            echo "gateway=$(host "${BASE_URL}")"
          } >>"${GITHUB_OUTPUT}"
      - name: Read the dispatch record
        id: record
        uses: $/.github/actions/dispatch-record
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Require a control-plane package stage
        shell: bash
        env:
          RECORD_READ: ${{ steps.record.outputs.read }}
          WORKFLOW_JOB: ${{ steps.record.outputs.workflow_job }}
        run: |-
          set -euo pipefail
          if [[ "${RECORD_READ}" != "true" || -z "${WORKFLOW_JOB}" ]]; then
            echo "::error::The control plane did not admit a package stage"
            exit 1
          fi
  run:
    needs:
      - gate
      - stage
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.stage.outputs.claimed != 'true' }}
    runs-on: ${{ startsWith(needs.gate.outputs.runs_on, '[') && fromJSON(needs.gate.outputs.runs_on) ||
      needs.gate.outputs.runs_on }}
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.stage_job_minutes || needs.gate.outputs.job_timeout_minutes) }}
    environment: ${{ vars.KSAI_JOB_ENVIRONMENT }}
    env:
      KSAI_MODEL_AUTH_MODE: ${{ needs.gate.outputs.model_auth_mode }}
      KSAI_REVIEW_ADMISSION: ${{ needs.gate.outputs.review_admission }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443 github.com:443 *.githubusercontent.com:443 *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443 *.datadoghq.com:443 archive.ubuntu.com:80 azure.archive.ubuntu.com:80
            security.ubuntu.com:80 registry.npmjs.org:443 proxy.golang.org:443 sum.golang.org:443
            storage.googleapis.com:443 pypi.org:443 files.pythonhosted.org:443 crates.io:443 index.crates.io:443
            static.crates.io:443 ${{ needs.gate.outputs.egress_endpoints }} ${{ needs.gate.outputs.gateway }} ${{
            needs.gate.outputs.endpoint }}
          disable-telemetry: true
      - name: Mint this repository's read token
        id: authz-token
        uses: $/.github/actions/run-token
        with:
          grant: read
          endpoint: https://ksai.kongcloud.io
      - name: Read this run's credentials
        id: credentials
        uses: $/.github/actions/run-credentials
        with:
          endpoint: https://ksai.kongcloud.io
      - name: Check out the revision the package stage reads
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.source_revision }}
          token: ${{ steps.authz-token.outputs.token }}
          persist-credentials: false
      - uses: $/.github/actions/ksai
        env:
          KSAI_PROVIDER_OBSERVATIONS: "true"
        with:
          source_org_github_token: ${{ steps.authz-token.outputs.token }}
          kong_org_github_token: ${{ github.token }}
          artifact_retention_days: 14
          job_timeout_minutes: ${{ needs.gate.outputs.stage_minutes || needs.gate.outputs.job_timeout_minutes }}
          max_consecutive_tool_failures: ${{ needs.gate.outputs.max_consecutive_tool_failures }}
          max_repeated_tool_calls: ${{ needs.gate.outputs.max_repeated_tool_calls }}
          otel_endpoint: https://otlp.datadoghq.com
          otel_headers: ${{ steps.credentials.outputs.otel_headers }}
          denied_paths: ${{ needs.gate.outputs.denied_paths }}
          control_plane_endpoint: https://ksai.kongcloud.io
          record_id: ${{ needs.gate.outputs.record_id }}
          opencode_version: ${{ needs.gate.outputs.opencode_version }}
          anthropic_base_url: ${{ needs.gate.outputs.model_gateway_url }}
    name: Package stage
